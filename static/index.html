<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NHL Live</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-2: #232323;
      --silver: #e6e9ea;
      --silver-dim: #9ca3aa;
      --blue: #1f5fce;
      --red: #c8102e;
      --border: #2c2c2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 24px;
      background: var(--bg);
      color: var(--silver);
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    header {
      padding: 20px 16px 14px;
      border-bottom: 2px solid var(--blue);
      background: linear-gradient(180deg, #141414 0%, var(--bg) 100%);
    }

    header h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 2px;
      color: var(--silver);
      font-family: Oswald, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    header h1 .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    header .sub {
      color: var(--silver-dim);
      font-size: 12px;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 6px;
      padding: 12px 16px 0;
      background: var(--bg);
    }

    nav button,
    .cat-row button,
    .back-btn,
    .date-row button,
    .show-more {
      border: 1px solid var(--border);
      color: var(--silver-dim);
      background: var(--surface);
      cursor: pointer;
    }

    nav button {
      flex: 1;
      padding: 10px 8px;
      border-radius: 10px;
      font-family: Oswald, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    nav button.active {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
      font-weight: 700;
    }

    main {
      padding: 14px 16px 0;
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 14px;
    }

    .date-input {
      width: 140px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: var(--silver);
      background: transparent;
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      text-align: center;
    }

    select.date-input {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
    }

    select.date-input option {
      color: var(--silver);
      background: #1a1a1a;
    }

    .date-row button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: var(--silver);
      font-size: 18px;
    }

    .card {
      margin-bottom: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .loading,
    .empty {
      padding: 30px 0;
      color: var(--silver-dim);
      font-size: 13px;
      text-align: center;
    }

    .loading {
      font-family: "Roboto Mono", monospace;
    }

    .game-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .team.right {
      justify-content: flex-end;
      text-align: right;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .abbr {
      font-family: Oswald, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .team-record {
      margin-top: 3px;
      color: var(--silver-dim);
      font-family: "Roboto Mono", monospace;
      font-size: 10px;
      white-space: nowrap;
    }

    .team-record strong {
      color: var(--silver);
    }

    .score-box {
      min-width: 70px;
      padding: 4px 6px;
      border-radius: 10px;
      text-align: center;
    }

    .score-box.clickable {
      cursor: pointer;
    }

    .score-box.clickable:active {
      background: var(--surface-2);
    }

    .score-box .score {
      color: var(--silver);
      font-family: "Roboto Mono", monospace;
      font-size: 22px;
      font-weight: 700;
    }

    .score-box .status {
      margin-top: 2px;
      color: var(--red);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cat-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .cat-row button {
      flex: 1;
      min-width: 80px;
      padding: 8px 6px;
      border-radius: 8px;
      font-family: Oswald, sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .cat-row button.active {
      border-color: var(--red);
      color: #fff;
      background: var(--red);
      font-weight: 700;
    }

    .table-wrapper,
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .standings-table {
      display: grid;
      grid-template-columns: 24px 30px 110px repeat(8, 35px);
      min-width: 600px;
      align-items: center;
    }

    .sticky-col {
      position: sticky;
      z-index: 2;
      background: var(--surface);
    }

    .sticky-col-1 {
      left: 0;
    }

    .sticky-col-2 {
      left: 24px;
    }

    .sticky-col-3 {
      left: 54px;
    }

    .standings-head,
    .standings-row {
      display: contents;
    }

    .standings-head > div,
    .standings-row > div {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .standings-head > div {
      color: var(--silver-dim);
      font-size: 10px;
      text-transform: uppercase;
    }

    .standings-head .sortable {
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .standings-row {
      cursor: pointer;
    }

    .standings-row:active > div {
      background: var(--surface-2) !important;
    }

    .standings-row .name {
      width: 100%;
      justify-content: flex-start;
      overflow: hidden;
      padding-left: 5px;
      font-family: Oswald, sans-serif;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .standings-row .team-logo {
      width: 20px;
      height: 20px;
    }

    .num,
    .diff,
    .pts {
      font-family: "Roboto Mono", monospace;
    }

    .pts {
      color: var(--blue);
      font-weight: 700;
    }

    .group-header-row {
      display: contents;
    }

    .group-header-row > div {
      grid-column: 1 / -1;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--silver);
      background: var(--surface-2);
      font-family: Oswald, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .player-row:active {
      background: var(--surface-2);
    }

    .rank {
      width: 20px;
      flex-shrink: 0;
      color: var(--silver-dim);
      font-family: "Roboto Mono", monospace;
      text-align: center;
    }

    .headshot {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface-2);
      object-fit: cover;
    }

    .player-info {
      min-width: 0;
      flex: 1;
    }

    .player-name {
      overflow: hidden;
      font-family: Oswald, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-team {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      color: var(--silver-dim);
      font-size: 11px;
    }

    .player-team .team-logo {
      width: 16px;
      height: 16px;
    }

    .player-value {
      color: var(--blue);
      font-family: "Roboto Mono", monospace;
      font-size: 20px;
      font-weight: 700;
    }

    .show-more {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-family: Oswald, sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      padding: 8px 14px;
      border-radius: 10px;
      color: var(--silver);
      font-family: Oswald, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .detail-head .team-logo {
      width: 48px;
      height: 48px;
    }

    .detail-head .headshot {
      width: 64px;
      height: 64px;
    }

    .detail-head .title {
      font-family: Oswald, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .detail-head .subtitle {
      margin-top: 2px;
      color: var(--silver-dim);
      font-size: 12px;
    }

    .section-title {
      margin: 16px 0 8px;
      color: var(--silver-dim);
      font-family: Oswald, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .stat-table th,
    .stat-table td {
      padding: 7px 4px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    .stat-table th {
      color: var(--silver-dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-table th:first-child,
    .stat-table td:first-child {
      font-family: Oswald, sans-serif;
      text-align: left;
    }

    .stat-table th.sortable {
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .stat-table tbody tr.clickable-row {
      cursor: pointer;
    }

    .stat-table tbody tr.clickable-row:active {
      background: var(--surface-2);
    }

    .bio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
      font-size: 13px;
    }

    .bio-grid .label {
      color: var(--silver-dim);
      font-size: 11px;
      text-transform: uppercase;
    }

    .bio-grid .value {
      font-family: Oswald, sans-serif;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1><span class="dot"></span>NHL LIVE</h1>
    <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
  </header>

  <nav id="main-nav">
    <button id="tab-schedule" class="active">Матчи</button>
    <button id="tab-standings">Таблица</button>
    <button id="tab-players">Игроки</button>
  </nav>

  <main>
    <section id="view-schedule">
      <div class="date-row">
        <button id="prev-day">‹</button>
        <input id="date-picker" class="date-input" type="date">
        <button id="next-day">›</button>
      </div>

      <div id="games">
        <div class="loading">Загрузка...</div>
      </div>
    </section>

    <section id="view-standings" style="display:none">
      <div class="cat-row">
        <button id="std-mode-all" class="active">Общая</button>
        <button id="std-mode-conf">Конференции</button>
        <button id="std-mode-div">Дивизионы</button>
      </div>

      <div class="card" style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--silver-dim);font-family:Oswald,sans-serif;font-size:12px;text-transform:uppercase;">
          Сезон
        </span>
        <select id="season-select" class="date-input" style="width:auto;flex:1;"></select>
      </div>

      <div class="card" style="padding:0;">
        <div class="table-wrapper">
          <div class="standings-table">
            <div class="standings-head">
              <div class="sticky-col sticky-col-1"></div>
              <div class="sticky-col sticky-col-2"></div>
              <div class="sticky-col sticky-col-3"></div>
              <div class="sortable" data-sort="gamesPlayed">И</div>
              <div class="sortable" data-sort="wins">В</div>
              <div class="sortable" data-sort="otLosses">ОТ</div>
              <div class="sortable" data-sort="losses">П</div>
              <div class="sortable" data-sort="goalFor">ЗШ</div>
              <div class="sortable" data-sort="goalAgainst">ПШ</div>
              <div class="sortable" data-sort="goalDifferential">+/-</div>
              <div class="sortable" data-sort="points">О</div>
            </div>

            <div id="standings-body" style="display:contents;">
              <div class="loading">Загрузка...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-players" style="display:none">
      <div class="cat-row">
        <button data-cat="points" class="active">Очки</button>
        <button data-cat="goals">Голы</button>
        <button data-cat="assists">Передачи</button>
        <button data-cat="plusMinus">+/-</button>
        <button data-cat="goalies">Вратари</button>
      </div>

      <div class="card">
        <div id="players-body">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
    </section>

    <section id="view-detail" style="display:none">
      <button id="back-btn" class="back-btn">‹ Назад</button>

      <div id="detail-body">
        <div class="loading">Загрузка...</div>
      </div>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const API_BASE = "https://nhl-live-api.sergvolk504.workers.dev";

    let currentDate = new Date();
    let lastMainTab = "schedule";

    let currentStandingsData = [];
    let standingsSortKey = "points";
    let standingsSortAsc = false;
    let standingsViewMode = "all";
    let selectedSeasonEndDate = "";

    let currentCat = "points";
    let currentLimit = 25;

    let currentTeamFullData = null;
    let currentTeamType = "regular";
    let currentTeamSortKey = "points";
    let currentTeamSortAsc = false;

    const datePicker = document.getElementById("date-picker");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function nameStr(value) {
      if (!value) return "";
      if (typeof value === "string") return value;
      return value.default || value.name || "";
    }

    function val(value, fallback = "—") {
      return value === undefined || value === null || value === ""
        ? fallback
        : value;
    }

    function fmtDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getTeamAbbrev(team) {
      if (!team) return "";

      if (typeof team === "string") {
        return team.trim().toUpperCase();
      }

      if (typeof team === "object") {
        return String(
          team.default ||
          team.abbrev ||
          team.abbreviation ||
          team.teamAbbrev ||
          ""
        ).trim().toUpperCase();
      }

      return "";
    }

    function getTeamName(team) {
      if (!team) return "";

      if (typeof team === "string") {
        return team;
      }

      if (typeof team === "object") {
        return String(
          team.default ||
          team.name ||
          team.teamName ||
          ""
        );
      }

      return "";
    }

    function getTeamLogo(team) {
      if (!team) return "";

      if (typeof team === "string") {
        return team;
      }

      if (typeof team === "object") {
        return String(
          team.logo ||
          team.teamLogo ||
          team.crest ||
          ""
        );
      }

      return "";
    }

    function seasonIdFromEndDate(endDate) {
      if (!endDate || typeof endDate !== "string") {
        return null;
      }

      const match = endDate.match(/^(\d{4})-\d{2}-\d{2}$/);

      if (!match) {
        return null;
      }

      const endYear = Number(match[1]);
      return `${endYear - 1}${endYear}`;
    }

    function openDetail() {
      document.getElementById("view-schedule").style.display = "none";
      document.getElementById("view-standings").style.display = "none";
      document.getElementById("view-players").style.display = "none";
      document.getElementById("view-detail").style.display = "";
      document.getElementById("main-nav").style.display = "none";
      document.getElementById("detail-body").innerHTML =
        '<div class="loading">Загрузка...</div>';
      window.scrollTo(0, 0);
    }

    function switchTab(tab) {
      lastMainTab = tab;

      document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
      document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
      document.getElementById("tab-players").classList.toggle("active", tab === "players");

      document.getElementById("view-schedule").style.display =
        tab === "schedule" ? "" : "none";

      document.getElementById("view-standings").style.display =
        tab === "standings" ? "" : "none";

      document.getElementById("view-players").style.display =
        tab === "players" ? "" : "none";

      document.getElementById("view-detail").style.display = "none";
      document.getElementById("main-nav").style.display = "flex";

      if (tab === "schedule") {
        loadSchedule();
      }

      if (tab === "standings") {
        loadStandings();
      }

      if (tab === "players") {
        loadPlayers();
      }
    }

    document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
    document.getElementById("tab-standings").onclick = () => switchTab("standings");
    document.getElementById("tab-players").onclick = () => switchTab("players");
    document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);

    datePicker.addEventListener("change", event => {
      if (event.target.value) {
        currentDate = new Date(`${event.target.value}T12:00:00`);
        loadSchedule();
      }
    });

    document.getElementById("prev-day").onclick = () => {
      currentDate.setDate(currentDate.getDate() - 1);
      loadSchedule();
    };

    document.getElementById("next-day").onclick = () => {
      currentDate.setDate(currentDate.getDate() + 1);
      loadSchedule();
    };

    async function loadSchedule() {
      const gamesElement = document.getElementById("games");
      const date = fmtDate(currentDate);

      datePicker.value = date;
      gamesElement.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const response = await fetch(
          `${API_BASE}/api/schedule?date=${encodeURIComponent(date)}`
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const day = (data.gameWeek || []).find(item => item.date === date);
        const games = day?.games || [];

        if (!games.length) {
          gamesElement.innerHTML = '<div class="empty">В этот день матчей нет</div>';
          return;
        }

        gamesElement.innerHTML = games.map(renderGame).join("");

        gamesElement
          .querySelectorAll(".score-box.clickable")
          .forEach(element => {
            element.addEventListener("click", () => {
              openGameDetail(
                element.dataset.gameId,
                element.dataset.away,
                element.dataset.home,
                element.dataset.awayLogo,
                element.dataset.homeLogo
              );
            });
          });
      } catch (error) {
        console.error("Ошибка загрузки матчей:", error);
        gamesElement.innerHTML =
          '<div class="empty">Не удалось загрузить матчи</div>';
      }
    }

    function renderTeamRecord(team) {
      const record = team?.currentRecord;

      if (!record) {
        return "";
      }

      return `
        <div class="team-record">
          <strong>
            ${record.wins ?? 0}-${record.losses ?? 0}-${record.otLosses ?? 0}-${record.points ?? 0}
          </strong>
        </div>
      `;
    }

    function renderGame(game) {
      const away = game.awayTeam || {};
      const home = game.homeTeam || {};
      const state = game.gameState;

      const started = state !== "FUT" && state !== "PRE";

      const status = started
        ? (state === "LIVE" || state === "CRIT" ? "LIVE" : "Финал")
        : new Date(game.startTimeUTC).toLocaleTimeString("ru-RU", {
            hour: "2-digit",
            minute: "2-digit"
          });

      const score = started
        ? `${away.score ?? 0} : ${home.score ?? 0}`
        : "vs";

      const className = started
        ? "score-box clickable"
        : "score-box";

      return `
        <div class="card">
          <div class="game-row">
            <div class="team">
              <img
                class="team-logo"
                src="${escapeHtml(away.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >
              <div>
                <div class="abbr">${escapeHtml(away.abbrev)}</div>
                ${renderTeamRecord(away)}
              </div>
            </div>

            <div
              class="${className}"
              ${started ? `
                data-game-id="${escapeHtml(game.id)}"
                data-away="${escapeHtml(away.abbrev)}"
                data-home="${escapeHtml(home.abbrev)}"
                data-away-logo="${escapeHtml(away.logo)}"
                data-home-logo="${escapeHtml(home.logo)}"
              ` : ""}
            >
              <div class="score">${score}</div>
              <div class="status">${status}</div>
            </div>

            <div class="team right">
              <div>
                <div class="abbr">${escapeHtml(home.abbrev)}</div>
                ${renderTeamRecord(home)}
              </div>

              <img
                class="team-logo"
                src="${escapeHtml(home.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >
            </div>
          </div>
        </div>
      `;
    }

    async function buildSeasonOptions() {
      const select = document.getElementById("season-select");
      select.innerHTML = '<option value="">Текущий сезон</option>';

      try {
        const response = await fetch(`${API_BASE}/api/seasons-list`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const seasons = Array.isArray(data.seasons) ? data.seasons : [];

        seasons
          .slice()
          .sort((a, b) => Number(b.id) - Number(a.id))
          .forEach(season => {
            const startYear = String(season.id).slice(0, 4);
            const endYear = String(season.id).slice(4, 8);
            const option = document.createElement("option");

            option.value = season.standingsEnd || "";
            option.dataset.startYear = startYear;
            option.textContent = `${startYear}-${endYear.slice(2)}`;

            select.appendChild(option);
          });
      } catch (error) {
        console.error("Ошибка загрузки сезонов:", error);
      }
    }

    document.getElementById("season-select").addEventListener("change", event => {
      selectedSeasonEndDate = event.target.value;
      currentStandingsData = [];
      loadStandings();
    });

    document.querySelectorAll(".standings-head .sortable").forEach(header => {
      header.addEventListener("click", () => {
        const key = header.dataset.sort;

        if (standingsSortKey === key) {
          standingsSortAsc = !standingsSortAsc;
        } else {
          standingsSortKey = key;
          standingsSortAsc = false;
        }

        renderStandings();
      });
    });

    document.getElementById("std-mode-all").onclick = () => setStandingsMode("all");
    document.getElementById("std-mode-conf").onclick = () => setStandingsMode("conf");
    document.getElementById("std-mode-div").onclick = () => setStandingsMode("div");

    function setStandingsMode(mode) {
      standingsViewMode = mode;

      document.getElementById("std-mode-all").classList.toggle("active", mode === "all");
      document.getElementById("std-mode-conf").classList.toggle("active", mode === "conf");
      document.getElementById("std-mode-div").classList.toggle("active", mode === "div");

      renderStandings();
    }

    async function loadStandings() {
      const body = document.getElementById("standings-body");
      body.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const endpoint = selectedSeasonEndDate
          ? `/api/standings-by-date/${encodeURIComponent(selectedSeasonEndDate)}`
          : "/api/standings";

        const response = await fetch(`${API_BASE}${endpoint}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        currentStandingsData = Array.isArray(data.standings)
          ? data.standings
          : [];

        renderStandings();
      } catch (error) {
        console.error("Ошибка загрузки таблицы:", error);
        body.innerHTML =
          '<div class="empty">Не удалось загрузить таблицу</div>';
      }
    }

    function sortTeams(teams) {
      return teams.slice().sort((a, b) => {
        let valueA = a[standingsSortKey] ?? 0;
        let valueB = b[standingsSortKey] ?? 0;

        if (standingsSortKey === "goalDifferential") {
          valueA = a.goalDifferential ??
            ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));

          valueB = b.goalDifferential ??
            ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
        }

        valueA = Number(valueA);
        valueB = Number(valueB);

        return standingsSortAsc
          ? valueA - valueB
          : valueB - valueA;
      });
    }

    function renderTeamRow(team, rank) {
      const teamAbbrev = getTeamAbbrev(
        team.teamAbbrev ||
        team.abbrev ||
        team.team
      );

      const teamName = getTeamName(
        team.teamName ||
        team.name
      ) || teamAbbrev;

      const teamLogo = getTeamLogo(
        team.teamLogo ||
        team.logo
      );

      const goalFor = Number(team.goalFor ?? 0);
      const goalAgainst = Number(team.goalAgainst ?? 0);

      const difference = Number(
        team.goalDifferential ??
        (goalFor - goalAgainst)
      );

      const formattedDifference =
        difference > 0 ? `+${difference}` : difference;

      return `
        <div
          class="standings-row"
          data-team="${escapeHtml(teamAbbrev)}"
          data-name="${escapeHtml(teamName)}"
          data-logo="${escapeHtml(teamLogo)}"
        >
          <div class="num sticky-col sticky-col-1">${rank}</div>

          <div class="sticky-col sticky-col-2">
            <img
              class="team-logo"
              src="${escapeHtml(teamLogo)}"
              alt=""
              onerror="this.style.visibility='hidden'"
            >
          </div>

          <div class="name sticky-col sticky-col-3">
            ${escapeHtml(teamAbbrev)}
          </div>

          <div class="num">${team.gamesPlayed ?? 0}</div>
          <div class="num">${team.wins ?? 0}</div>
          <div class="num">${team.otLosses ?? 0}</div>
          <div class="num">${team.losses ?? 0}</div>
          <div class="num">${goalFor}</div>
          <div class="num">${goalAgainst}</div>

          <div
            class="diff"
            style="color:${difference >= 0 ? "#2ecc71" : "#e74c3c"}"
          >
            ${formattedDifference}
          </div>

          <div class="pts">${team.points ?? 0}</div>
        </div>
      `;
    }

    function renderStandings() {
      const body = document.getElementById("standings-body");

      if (!currentStandingsData.length) {
        body.innerHTML = '<div class="empty">Нет данных</div>';
        return;
      }

      let html = "";

      if (standingsViewMode === "all") {
        html = sortTeams(currentStandingsData)
          .map((team, index) => renderTeamRow(team, index + 1))
          .join("");
      } else {
        const field = standingsViewMode === "conf"
          ? "conferenceName"
          : "divisionName";

        const groups = {};

        currentStandingsData.forEach(team => {
          const group = nameStr(team[field]) || "Без группы";

          if (!groups[group]) {
            groups[group] = [];
          }

          groups[group].push(team);
        });

        Object.keys(groups)
          .sort()
          .forEach(group => {
            html += `
              <div class="group-header-row">
                <div>${escapeHtml(group)}</div>
              </div>
            `;

            html += sortTeams(groups[group])
              .map((team, index) => renderTeamRow(team, index + 1))
              .join("");
          });
      }

      body.innerHTML = html;

      body.querySelectorAll(".standings-row").forEach(row => {
        row.addEventListener("click", () => {
          openTeamDetail(
            row.dataset.team,
            row.dataset.name,
            row.dataset.logo
          );
        });
      });
    }

    async function loadPlayers() {
      const body = document.getElementById("players-body");
      body.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
        const params = new URLSearchParams({
          limit: String(currentLimit)
        });

        if (seasonId) {
          params.set("season", seasonId);
        }

        const endpoint = currentCat === "goalies"
          ? `/api/goalie-leaders?${params.toString()}`
          : `/api/leaders/${encodeURIComponent(currentCat)}?${params.toString()}`;

        const response = await fetch(`${API_BASE}${endpoint}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        const players = currentCat === "goalies"
          ? data.goalies || []
          : data[currentCat] || [];

        if (!players.length) {
          body.innerHTML = '<div class="empty">Нет данных игроков</div>';
          return;
        }

        if (currentCat === "goalies") {
          renderGoalies(body, players);
        } else {
          renderPlayerLeaders(body, players);
        }
      } catch (error) {
        console.error("Ошибка загрузки игроков:", error);
        body.innerHTML =
          '<div class="empty">Не удалось загрузить игроков</div>';
      }
    }

    function renderPlayerLeaders(body, players) {
      body.innerHTML = players.map((player, index) => `
        <div
          class="player-row"
          data-player-id="${escapeHtml(player.id || player.playerId)}"
        >
          <div class="rank">${index + 1}</div>

          <img
            class="headshot"
            src="${escapeHtml(player.headshot)}"
            alt=""
            onerror="this.style.visibility='hidden'"
          >

          <div class="player-info">
            <div class="player-name">
              ${escapeHtml(nameStr(player.firstName))}
              ${escapeHtml(nameStr(player.lastName))}
            </div>

            <div class="player-team">
              <img
                class="team-logo"
                src="${escapeHtml(player.teamLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >
              ${escapeHtml(player.teamAbbrev || "")}
            </div>
          </div>

          <div class="player-value">${escapeHtml(player.value ?? "")}</div>
        </div>
      `).join("");

      body.querySelectorAll(".player-row").forEach(row => {
        row.addEventListener("click", () => {
          openPlayerDetail(row.dataset.playerId);
        });
      });
    }

    function renderGoalies(body, goalies) {
      body.innerHTML = `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Вратарь</th>
                <th>И</th>
                <th>В</th>
                <th>П</th>
                <th>ПБО</th>
                <th>%ОБ</th>
                <th>ГКИ</th>
              </tr>
            </thead>
            <tbody>
              ${goalies.map((goalie, index) => `
                <tr
                  class="clickable-row"
                  data-player-id="${escapeHtml(goalie.playerId || goalie.id)}"
                >
                  <td>${index + 1}. ${escapeHtml(
                    `${nameStr(goalie.firstName)} ${nameStr(goalie.lastName)}`.trim()
                  )}</td>
                  <td>${val(goalie.gamesPlayed)}</td>
                  <td>${val(goalie.wins)}</td>
                  <td>${val(goalie.losses)}</td>
                  <td>${val(goalie.otLosses)}</td>
                  <td>${val(goalie.savePctg)}</td>
                  <td>${val(goalie.gaa)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;

      body.querySelectorAll(".clickable-row").forEach(row => {
        row.addEventListener("click", () => {
          openPlayerDetail(row.dataset.playerId);
        });
      });
    }

    document
      .querySelectorAll(".cat-row button[data-cat]")
      .forEach(button => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".cat-row button[data-cat]")
            .forEach(item => item.classList.remove("active"));

          button.classList.add("active");
          currentCat = button.dataset.cat;
          currentLimit = 25;
          loadPlayers();
        });
      });

    async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
      const abbrev = getTeamAbbrev(teamAbbrev);
      const name = getTeamName(teamName) || abbrev;
      const logo = getTeamLogo(teamLogo);

      if (!abbrev) {
        openDetail();
        document.getElementById("detail-body").innerHTML =
          '<div class="empty">Не удалось определить клуб</div>';
        return;
      }

      openDetail();

      try {
        const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
        const params = new URLSearchParams();

        if (seasonId) {
          params.set("season", seasonId);
        }

        const query = params.toString()
          ? `?${params.toString()}`
          : "";

        const url =
          `${API_BASE}/api/roster-stats/` +
          `${encodeURIComponent(abbrev)}${query}`;

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        });

        let data = null;

        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {
          throw new Error(data?.error || `HTTP ${response.status}`);
        }

        if (!data || typeof data !== "object") {
          throw new Error("Сервер вернул пустой ответ");
        }

        if (data.error) {
          throw new Error(data.error);
        }

        currentTeamFullData =
          data.data ||
          data.result ||
          data.roster ||
          data;

        currentTeamType = "regular";
        currentTeamSortKey = "points";
        currentTeamSortAsc = false;

        renderTeamTabsAndTables(abbrev, name, logo);
      } catch (error) {
        console.error("Ошибка загрузки состава клуба:", error);

        document.getElementById("detail-body").innerHTML = `
          <div class="empty">
            Не удалось загрузить состав команды
            <br>
            <small>${escapeHtml(error.message || "Ошибка сервера")}</small>
          </div>
        `;
      }
    }

    function renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo) {
      const body = document.getElementById("detail-body");

      body.innerHTML = `
        <div class="detail-head">
          <img
            class="team-logo"
            src="${escapeHtml(teamLogo)}"
            alt=""
            onerror="this.style.visibility='hidden'"
          >

          <div>
            <div class="title">${escapeHtml(teamName)}</div>
            <div class="subtitle">${escapeHtml(teamAbbrev)}</div>
          </div>
        </div>

        <div class="cat-row">
          <button id="btn-team-reg" class="active">
            Регулярный сезон
          </button>

          <button id="btn-team-po">
            Плей-офф
          </button>
        </div>

        <div id="team-tables-container"></div>
      `;

      document.getElementById("btn-team-reg").onclick = () => {
        currentTeamType = "regular";

        document.getElementById("btn-team-reg").classList.add("active");
        document.getElementById("btn-team-po").classList.remove("active");

        buildTeamTablesBlock();
      };

      document.getElementById("btn-team-po").onclick = () => {
        currentTeamType = "playoff";

        document.getElementById("btn-team-po").classList.add("active");
        document.getElementById("btn-team-reg").classList.remove("active");

        buildTeamTablesBlock();
      };

      buildTeamTablesBlock();
    }

    function normalizeTeamDataset(data) {
      if (!data || typeof data !== "object") {
        return {
          skaters: [],
          goalies: []
        };
      }

      const skaters =
        data.skaters ||
        data.skatersStats ||
        data.players ||
        data.forwards ||
        [];

      const goalies =
        data.goalies ||
        data.goaltenders ||
        data.goaliesStats ||
        [];

      return {
        skaters: Array.isArray(skaters) ? skaters : [],
        goalies: Array.isArray(goalies) ? goalies : []
      };
    }

    function buildTeamTablesBlock() {
      const container = document.getElementById("team-tables-container");

      if (!currentTeamFullData) {
        container.innerHTML = '<div class="empty">Данные отсутствуют</div>';
        return;
      }

      const source =
        currentTeamFullData[currentTeamType] ||
        currentTeamFullData[
          currentTeamType === "regular"
            ? "regularSeason"
            : "playoffs"
        ] ||
        currentTeamFullData;

      const dataset = normalizeTeamDataset(source);

      const skaters = dataset.skaters.slice().sort((a, b) => {
        const key = currentTeamSortKey;

        const valueA = Number(
          key === "penaltyMinutes"
            ? a.penaltyMinutes ?? a.pim ?? 0
            : a[key] ?? 0
        );

        const valueB = Number(
          key === "penaltyMinutes"
            ? b.penaltyMinutes ?? b.pim ?? 0
            : b[key] ?? 0
        );

        return currentTeamSortAsc
          ? valueA - valueB
          : valueB - valueA;
      });

      const goalies = dataset.goalies.slice().sort((a, b) => {
        return Number(b.gamesPlayed ?? 0) - Number(a.gamesPlayed ?? 0);
      });

      let html = '<div class="section-title">Полевые игроки</div>';

      if (!skaters.length) {
        html += '<div class="empty">Нет данных полевых игроков</div>';
      } else {
        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Игрок</th>
                  <th class="sortable" data-sort="gamesPlayed">И</th>
                  <th class="sortable" data-sort="goals">Г</th>
                  <th class="sortable" data-sort="assists">П</th>
                  <th class="sortable" data-sort="points">О</th>
                  <th class="sortable" data-sort="plusMinus">+/-</th>
                  <th class="sortable" data-sort="penaltyMinutes">Штр</th>
                </tr>
              </thead>
              <tbody>
                ${skaters.map(player => {
                  const id = player.playerId || player.id || "";
                  const fullName = `${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim();

                  return `
                    <tr
                      class="clickable-row"
                      data-player-id="${escapeHtml(id)}"
                    >
                      <td>${escapeHtml(fullName || "Игрок")}</td>
                      <td>${val(player.gamesPlayed)}</td>
                      <td>${val(player.goals)}</td>
                      <td>${val(player.assists)}</td>
                      <td>${val(player.points)}</td>
                      <td>${val(player.plusMinus)}</td>
                      <td>${val(player.penaltyMinutes ?? player.pim)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      html += '<div class="section-title">Вратари</div>';

      if (!goalies.length) {
        html += '<div class="empty">Нет данных вратарей</div>';
      } else {
        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Игрок</th>
                  <th>И</th>
                  <th>В</th>
                  <th>П</th>
                  <th>%ОБ</th>
                  <th>ГКИ</th>
                </tr>
              </thead>
              <tbody>
                ${goalies.map(player => {
                  const id = player.playerId || player.id || "";
                  const fullName = `${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim();

                  return `
                    <tr
                      class="clickable-row"
                      data-player-id="${escapeHtml(id)}"
                    >
                      <td>${escapeHtml(fullName || "Вратарь")}</td>
                      <td>${val(player.gamesPlayed)}</td>
                      <td>${val(player.wins)}</td>
                      <td>${val(player.losses)}</td>
                      <td>${val(player.savePercentage ?? player.savePctg)}</td>
                      <td>${val(player.goalsAgainstAverage ?? player.gaa)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      container.innerHTML = html;

      container.querySelectorAll(".clickable-row").forEach(row => {
        row.addEventListener("click", () => {
          if (row.dataset.playerId) {
            openPlayerDetail(row.dataset.playerId);
          }
        });
      });

      container.querySelectorAll("th.sortable").forEach(header => {
        header.addEventListener("click", () => {
          const key = header.dataset.sort;

          if (currentTeamSortKey === key) {
            currentTeamSortAsc = !currentTeamSortAsc;
          } else {
            currentTeamSortKey = key;
            currentTeamSortAsc = false;
          }

          buildTeamTablesBlock();
        });
      });
    }

    async function openPlayerDetail(playerId) {
      openDetail();

      if (!playerId) {
        document.getElementById("detail-body").innerHTML =
          '<div class="empty">Не удалось определить игрока</div>';
        return;
      }

      try {
        const response = await fetch(
          `${API_BASE}/api/player/${encodeURIComponent(playerId)}`
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const player = await response.json();

        const fullName =
          `${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim();

        document.getElementById("detail-body").innerHTML = `
          <div class="detail-head">
            <img
              class="headshot"
              src="${escapeHtml(player.headshot)}"
              alt=""
              onerror="this.style.visibility='hidden'"
            >

            <div>
              <div class="title">${escapeHtml(fullName || "Игрок")}</div>
              <div class="subtitle">
                ${escapeHtml(player.teamAbbrev || "")}
                · №${escapeHtml(player.sweaterNumber || "—")}
                · ${escapeHtml(player.positionCode || "")}
              </div>
            </div>

            <img
              class="team-logo"
              src="${escapeHtml(player.teamLogo)}"
              alt=""
              onerror="this.style.visibility='hidden'"
              style="margin-left:auto"
            >
          </div>

          <div class="section-title">Личные данные</div>

          <div class="bio-grid">
            <div>
              <div class="label">Дата рождения</div>
              <div class="value">${escapeHtml(player.birthDate || "—")}</div>
            </div>

            <div>
              <div class="label">Место рождения</div>
              <div class="value">
                ${escapeHtml(
                  [nameStr(player.birthCity), player.birthCountry]
                    .filter(Boolean)
                    .join(", ") || "—"
                )}
              </div>
            </div>

            <div>
              <div class="label">Рост</div>
              <div class="value">
                ${player.heightInCentimeters
                  ? `${player.heightInCentimeters} см`
                  : "—"}
              </div>
            </div>

            <div>
              <div class="label">Вес</div>
              <div class="value">
                ${player.weightInKilograms
                  ? `${player.weightInKilograms} кг`
                  : "—"}
              </div>
            </div>

            <div>
              <div class="label">Хват</div>
              <div class="value">${escapeHtml(player.shootsCatches || "—")}</div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error("Ошибка загрузки игрока:", error);

        document.getElementById("detail-body").innerHTML =
          '<div class="empty">Не удалось загрузить карточку игрока</div>';
      }
    }

    buildSeasonOptions();
    loadSchedule();
  </script>
</body>
</html>
