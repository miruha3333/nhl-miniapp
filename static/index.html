<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NHL Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --surface: #161616;
    --surface-2: #232323;
    --silver: #E6E9EA;
    --silver-dim: #9CA3AA;
    --blue: #1F5FCE;
    --red: #C8102E;
    --border: #2C2C2C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--silver);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }

  header {
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--blue);
    background: linear-gradient(180deg, #141414 0%, var(--bg) 100%);
  }

  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--silver);
  }

  header h1 .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  header .sub {
    color: var(--silver-dim);
    font-size: 12px;
  }

  /* Переключатель глобального режима типа сезона */
  .season-toggle-container {
    padding: 10px 16px 0;
    display: flex;
    justify-content: flex-end;
  }
  
  .season-toggle {
    display: inline-flex;
    background: var(--surface);
    padding: 2px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .season-toggle button {
    background: transparent;
    border: none;
    color: var(--silver-dim);
    padding: 6px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 6px;
    cursor: pointer;
  }

  .season-toggle button.active {
    background: var(--surface-2);
    color: #fff;
    font-weight: 700;
  }

  nav {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  nav button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 10px 8px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  nav button.active {
    color: #fff;
    background: var(--blue);
    border-color: var(--blue);
    font-weight: 700;
  }

  main { padding: 14px 16px 0; }

  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0 14px;
  }

  .date-row .label {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    color: var(--silver-dim);
  }

  .date-row button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .game-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }

  .team {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .team.right { 
    justify-content: flex-end; 
    text-align: right; 
    flex-direction: row-reverse; /* Разворачиваем, чтобы логотип был БЛИЖЕ к центру, у аббревиатуры */
  }

  .team .abbr {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
  }

  .team-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .score-box {
    text-align: center;
    min-width: 70px;
    border-radius: 10px;
    padding: 4px 6px;
  }

  .score-box.clickable {
    cursor: pointer;
    transition: background 0.15s;
  }

  .score-box.clickable:active {
    background: var(--surface-2);
  }

  .score-box .score {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 22px;
    color: var(--silver);
  }

  .score-box .status {
    font-size: 10px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* ----- Standings (Обновленная сетка под новые столбцы) ----- */
  .standings-head, .standings-row {
    display: grid;
    grid-template-columns: 24px 24px 1fr 30px 30px 30px 30px 35px 35px 45px;
    gap: 4px;
    align-items: center;
    font-size: 12px;
  }

  .standings-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .standings-row:active { background: var(--surface-2); }
  .standings-row:last-child { border-bottom: none; }

  .standings-row .rank {
    font-family: 'Roboto Mono', monospace;
    color: var(--silver-dim);
  }

  .standings-row .team-logo {
    width: 20px;
    height: 20px;
  }

  .standings-row .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .standings-row .num, .standings-head .num {
    font-family: 'Roboto Mono', monospace;
    text-align: center;
    color: var(--silver-dim);
  }

  .standings-row .pts, .standings-head .pts {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    text-align: center;
    color: var(--blue);
  }

  .standings-head {
    font-size: 10px;
    color: var(--silver-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ----- Players / leaders ----- */

  .cat-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .cat-row button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 8px 6px;
    border-radius: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cat-row button.active {
    color: #fff;
    background: var(--red);
    border-color: var(--red);
    font-weight: 700;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .player-row:active { background: var(--surface-2); }
  .player-row:last-child { border-bottom: none; }

  .player-row .rank {
    font-family: 'Roboto Mono', monospace;
    color: var(--silver-dim);
    width: 20px;
    flex-shrink: 0;
    text-align: center;
  }

  .player-row .headshot {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .player-row .info {
    flex: 1;
    min-width: 0;
  }

  .player-row .pname {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-row .pteam {
    font-size: 11px;
    color: var(--silver-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .player-row .pteam .team-logo {
    width: 16px;
    height: 16px;
  }

  .player-row .pvalue {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    color: var(--blue);
    flex-shrink: 0;
  }

  .show-more {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 10px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
  }

  .empty {
    text-align: center;
    color: var(--silver-dim);
    font-size: 13px;
    padding: 30px 0;
  }

  .loading {
    text-align: center;
    color: var(--silver-dim);
    font-size: 13px;
    padding: 30px 0;
    font-family: 'Roboto Mono', monospace;
  }

  /* ----- Detail view ----- */

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver);
    padding: 8px 14px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 12px;
  }

  .detail-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .detail-head img.team-logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .detail-head img.headshot {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .detail-head .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .detail-head .subtitle {
    font-size: 12px;
    color: var(--silver-dim);
    margin-top: 2px;
  }

  .section-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--silver-dim);
    margin: 16px 0 8px;
    border-left: 3px solid var(--blue);
    padding-left: 6px;
  }

  .bio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    font-size: 13px;
    margin-bottom: 15px;
  }

  .bio-grid .label {
    color: var(--silver-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .bio-grid .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
  }

  .stat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 15px;
  }

  .stat-table th, .stat-table td {
    padding: 7px 6px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .stat-table th {
    background: #1c1c1c;
    color: var(--silver-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
  }

  .stat-table td:first-child, .stat-table th:first-child {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
  }

  .stat-table tbody tr:active { background: var(--surface-2); }
  .stat-table .num { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }

  .goal-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .goal-row:last-child { border-bottom: none; }

  .goal-row .time {
    font-family: 'Roboto Mono', monospace;
    color: var(--silver-dim);
    font-size: 12px;
    flex-shrink: 0;
    width: 46px;
  }

  .goal-row .desc { flex: 1; }

  .goal-row .scorer {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
  }

  .goal-row .assists {
    color: var(--silver-dim);
    font-size: 11px;
    margin-top: 2px;
  }

  .goal-row .scoreline {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    color: var(--blue);
    flex-shrink: 0;
  }

  .period-label {
    font-family: 'Roboto Mono', monospace;
    color: var(--silver-dim);
    font-size: 11px;
    text-transform: uppercase;
    margin: 14px 0 6px;
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>NHL LIVE</h1>
  <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
</header>

<div class="season-toggle-container">
  <div class="season-toggle">
    <button id="toggle-season-reg" class="active" onclick="setGlobalSeasonType(2)">Сезон</button>
    <button id="toggle-season-po" onclick="setGlobalSeasonType(3)">Плей-офф</button>
  </div>
</div>

<nav id="main-nav">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Игроки</button>
</nav>

<main>
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <div class="label" id="date-label">—</div>
      <button id="next-day">›</button>
    </div>
    <div id="games"><div class="loading">Загрузка...</div></div>
  </div>

  <div id="view-standings" style="display:none">
    <div class="card" style="padding: 10px; overflow-x: auto;">
      <div class="standings-head">
        <div>№</div><div></div><div>Команда</div><div class="num">И</div><div class="num">В</div><div class="num">П</div><div class="num">ОТ</div><div class="num">ЗШ</div><div class="num">ПШ</div><div class="pts">Очки</div>
      </div>
      <div id="standings-body"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div id="view-players" style="display:none">
    <div class="cat-row">
      <button data-cat="points" class="active">Очки</button>
      <button data-cat="goals">Голы</button>
      <button data-cat="assists">Передачи</button>
      <button data-cat="plusMinus">+/-</button>
    </div>
    <div class="card">
      <div id="players-body"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div id="view-detail" style="display:none">
    <button class="back-btn" id="back-btn">‹ Назад</button>
    <div id="detail-body"><div class="loading">Загрузка...</div></div>
  </div>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const API_BASE = "";
  
  // Глобальное состояние типа сезона: 2 = Регулярка, 3 = Плей-офф
  let globalSeasonType = 2; 

  function setGlobalSeasonType(type) {
    globalSeasonType = type;
    document.getElementById("toggle-season-reg").classList.toggle("active", type === 2);
    document.getElementById("toggle-season-po").classList.toggle("active", type === 3);
    
    // Перезагружаем текущую активную вкладку, если это не матчи
    if (lastMainTab === "standings") loadStandings();
    if (lastMainTab === "players") loadPlayers();
  }

  // ----- Утилиты -----
  function nameStr(n) {
    if (!n) return "";
    if (typeof n === "string") return n;
    return n.default ?? n.fr ?? "";
  }

  function val(v, fallback = "—") {
    return (v === undefined || v === null || v === "") ? fallback : v;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ----- Навигация -----
  let lastMainTab = "schedule";

  function switchTab(tab) {
    document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
    document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
    document.getElementById("tab-players").classList.toggle("active", tab === "players");

    document.getElementById("view-schedule").style.display = tab === "schedule" ? "" : "none";
    document.getElementById("view-standings").style.display = tab === "standings" ? "" : "none";
    document.getElementById("view-players").style.display = tab === "players" ? "" : "none";
    document.getElementById("view-detail").style.display = "none";
    document.getElementById("main-nav").style.display = "flex";

    lastMainTab = tab;

    if (tab === "schedule") loadSchedule();
    if (tab === "standings") loadStandings();
    if (tab === "players") loadPlayers();
  }

  document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);
  document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
  document.getElementById("tab-standings").onclick = () => switchTab("standings");
  document.getElementById("tab-players").onclick = () => switchTab("players");

  // ----- Матчи -----
  let currentDate = new Date();

  function fmtDate(d) { return d.toISOString().slice(0, 10); }
  function fmtLabel(d) { return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short", weekday: "short" }); }

  async function loadSchedule() {
    const games = document.getElementById("games");
    games.innerHTML = '<div class="loading">Загрузка...</div>';
    document.getElementById("date-label").textContent = fmtLabel(currentDate);

    try {
      const res = await fetch(`${API_BASE}/api/schedule?date=${fmtDate(currentDate)}`);
      const data = await res.json();
      const week = data.gameWeek || [];
      const day = week.find(d => d.date === fmtDate(currentDate));
      const list = day?.games || [];

      if (list.length === 0) {
        games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
        return;
      }

      games.innerHTML = list.map(renderGame).join("");

      games.querySelectorAll(".score-box.clickable").forEach(el => {
        el.addEventListener("click", () => openGameDetail(
          el.dataset.gameId, el.dataset.away, el.dataset.home,
          el.dataset.awayLogo, el.dataset.homeLogo
        ));
      });
    } catch (e) {
      games.innerHTML = '<div class="empty">Не удалось загрузить данные</div>';
    }
  }

  function renderGame(g) {
    const away = g.awayTeam;
    const home = g.homeTeam;
    const state = g.gameState;

    let status = "—";
    let awayScore = "";
    let homeScore = "";
    const started = !(state === "FUT" || state === "PRE");

    if (!started) {
      status = new Date(g.startTimeUTC).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    } else if (state === "LIVE" || state === "CRIT") {
      status = "LIVE";
      awayScore = away.score ?? 0;
      homeScore = home.score ?? 0;
    } else {
      status = "Финал";
      awayScore = away.score ?? 0;
      homeScore = home.score ?? 0;
    }

    const scoreClass = started ? "score-box clickable" : "score-box";
    const dataAttrs = started ? `data-game-id="${g.id}" data-away="${away.abbrev}" data-home="${home.abbrev}" data-away-logo="${away.logo ?? ""}" data-home-logo="${home.logo ?? ""}"` : "";

    return `
      <div class="card">
        <div class="game-row">
          <div class="team">
            <img class="team-logo" src="${away.logo}" alt="" onerror="this.style.display='none'">
            <div class="abbr">${away.abbrev}</div>
          </div>
          <div class="${scoreClass}" ${dataAttrs}>
            <div class="score">${awayScore !== "" ? awayScore + " : " + homeScore : "vs"}</div>
            <div class="status">${status}</div>
          </div>
          <div class="team right">
            <img class="team-logo" src="${home.logo}" alt="" onerror="this.style.display='none'">
            <div class="abbr">${home.abbrev}</div>
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById("prev-day").onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadSchedule(); };
  document.getElementById("next-day").onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadSchedule(); };

  // ----- Таблица (С новыми хоккейными метриками) -----
  async function loadStandings() {
    const body = document.getElementById("standings-body");
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/standings`);
      const data = await res.json();
      let rows = data.standings || [];

      // Если выбран Плей-офф (3), API выдает всех, но мы можем отсортировать по очкам, 
      // либо в будущем связать со специфичным плей-офф API. Пока выводим расширенную таблицу.
      body.innerHTML = rows.map((t, i) => `
        <div class="standings-row" data-team="${t.teamAbbrev?.default ?? t.teamAbbrev ?? ""}" data-name="${escapeHtml(nameStr(t.teamName))}" data-logo="${t.teamLogo ?? ""}">
          <div class="rank">${i + 1}</div>
          <img class="team-logo" src="${t.teamLogo}" alt="" onerror="this.style.visibility='hidden'">
          <div class="name">${t.teamAbbrev?.default ?? t.teamAbbrev ?? ""}</div>
          <div class="num">${val(t.gamesPlayed, 0)}</div>
          <div class="num">${val(t.wins, 0)}</div>
          <div class="num">${val(t.losses, 0)}</div>
          <div class="num">${val(t.otLosses, 0)}</div>
          <div class="num">${val(t.goalFor, 0)}</div>
          <div class="num">${val(t.goalAgainst, 0)}</div>
          <div class="pts">${val(t.points, 0)}</div>
        </div>
      `).join("");

      body.querySelectorAll(".standings-row").forEach(el => {
        el.addEventListener("click", () => openTeamDetail(el.dataset.team, el.dataset.name, el.dataset.logo));
      });
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить данные</div>';
    }
  }

  // ----- Игроки -----
  let currentCat = "points";
  let currentLimit = 25;

  async function loadPlayers() {
    const body = document.getElementById("players-body");
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/leaders/${currentCat}?limit=${currentLimit}&season_type=${globalSeasonType}`);
      const data = await res.json();
      const list = data[currentCat] || [];

      if (list.length === 0) {
        body.innerHTML = '<div class="empty">Нет данных для этого типа сезона</div>';
        return;
      }

      body.innerHTML = list.map((p, i) => `
        <div class="player-row" data-player-id="${p.id}">
          <div class="rank">${i + 1}</div>
          <img class="headshot" src="${p.headshot}" alt="" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="pname">${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</div>
            <div class="pteam">
              <img class="team-logo" src="${p.teamLogo}" alt="" onerror="this.style.display='none'">
              ${p.teamAbbrev ?? ""}
            </div>
          </div>
          <div class="pvalue">${p.value ?? ""}</div>
        </div>
      `).join("");

      if (list.length >= currentLimit && currentLimit < 50) {
        body.insertAdjacentHTML("beforeend", '<button class="show-more" id="show-more-players">Показать больше</button>');
        document.getElementById("show-more-players").onclick = () => { currentLimit = 50; loadPlayers(); };
      }

      body.querySelectorAll(".player-row").forEach(el => {
        el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
      });
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить данные</div>';
    }
  }

  document.querySelectorAll(".cat-row button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".cat-row button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      currentLimit = 25;
      loadPlayers();
    };
  });

  // ----- Детали: Состав команды -----
  async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
    openDetail();
    const body = document.getElementById("detail-body");

    try {
      const res = await fetch(`${API_BASE}/api/roster-stats/${teamAbbrev}`);
      const data = await res.json();
      const skaters = (data.skaters || []).slice().sort((a, b) => (b.points ?? 0) - (a.points ?? 0));
      const goalies = (data.goalies || []).slice().sort((a, b) => (b.gamesPlayed ?? 0) - (a.gamesPlayed ?? 0));

      let html = `
        <div class="detail-head">
          <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="title">${escapeHtml(teamName || teamAbbrev)}</div>
            <div class="subtitle">${teamAbbrev}</div>
          </div>
        </div>
      `;

      html += '<div class="section-title">Полевые игроки</div>';
      if (skaters.length === 0) { html += '<div class="empty">Нет данных</div>'; } 
      else {
        html += `<div class="table-scroll"><table class="stat-table"><thead><tr><th>Игрок</th><th>И</th><th>Г</th><th>П</th><th>О</th><th>+/-</th><th>Штр</th></tr></thead><tbody>`;
        html += skaters.map(p => `
          <tr data-player-id="${p.playerId}">
            <td>${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</td>
            <td class="num">${val(p.gamesPlayed)}</td>
            <td class="num">${val(p.goals)}</td>
            <td class="num">${val(p.assists)}</td>
            <td class="num">${val(p.points)}</td>
            <td class="num">${val(p.plusMinus)}</td>
            <td class="num">${val(p.pim)}</td>
          </tr>
        `).join("");
        html += "</tbody></table></div>";
      }

      body.innerHTML = html;
      body.querySelectorAll("tr[data-player-id]").forEach(el => {
        el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
      });
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить данные о составе</div>';
    }
  }

  // ----- Детали матча (Исправлены [object Object] и стили иконок) -----
  async function openGameDetail(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
    openDetail();
    const body = document.getElementById("detail-body");

    let html = `
      <div class="detail-head" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img class="team-logo" src="${awayLogo}" alt="">
          <span class="title">${awayAbbrev}</span>
        </div>
        <div class="subtitle" style="text-align: center; font-weight: bold;">vs</div>
        <div style="display: flex; align-items: center; gap: 10px; flex-direction: row-reverse;">
          <img class="team-logo" src="${homeLogo}" alt="">
          <span class="title">${homeAbbrev}</span>
        </div>
      </div>
    `;

    try {
      const [landingRes, boxRes] = await Promise.all([
        fetch(`${API_BASE}/api/score/${gameId}`),
        fetch(`${API_BASE}/api/boxscore/${gameId}`),
      ]);
      const landing = await landingRes.json();
      const box = await boxRes.json();

      // Голы
      const scoring = landing?.summary?.scoring || [];
      html += '<div class="section-title">Голы</div>';
      let anyGoals = false;

      scoring.forEach(period => {
        const goals = period.goals || [];
        if (goals.length === 0) return;
        anyGoals = true;
        html += `<div class="period-label">${period.periodDescriptor?.number}-й период</div>`;
        goals.forEach(goal => {
          // Исправление [object Object] в ассистентах
          const assists = (goal.assists || []).map(a => escapeHtml(nameStr(a.name || a))).join(", ");
          html += `
            <div class="goal-row">
              <div class="time">${val(goal.timeInPeriod)}</div>
              <div class="desc">
                <div class="scorer">${escapeHtml(nameStr(goal.name || goal))} (${escapeHtml(goal.teamAbbrev?.default ?? goal.teamAbbrev ?? "")})</div>
                ${assists ? `<div class="assists">Пасы: ${assists}</div>` : ""}
              </div>
              <div class="scoreline">${val(goal.awayScore)} : ${val(goal.homeScore)}</div>
            </div>
          `;
        });
      });
      if (!anyGoals) html += '<div class="empty">Голов пока не было</div>';

      // Штрафы
      const penalties = landing?.summary?.penalties || [];
      html += '<div class="section-title">Штрафы</div>';
      let anyPenalties = false;

      penalties.forEach(period => {
        const list = period.penalties || [];
        if (list.length === 0) return;
        anyPenalties = true;
        html += `<div class="period-label">${period.periodDescriptor?.number}-й период</div>`;
        list.forEach(pen => {
          // Исправление [object Object] в нарушителе
          const playerPenaltyName = nameStr(pen.committedByPlayer) || pen.committedByPlayer || "Неизвестный игрок";
          html += `
            <div class="goal-row">
              <div class="time">${val(pen.timeInPeriod)}</div>
              <div class="desc">
                <div class="scorer">${escapeHtml(playerPenaltyName)} (${escapeHtml(pen.teamAbbrev?.default ?? pen.teamAbbrev ?? "")})</div>
                <div class="assists">${escapeHtml(nameStr(pen.descKey) || pen.descKey || "Малый штраф")} — ${val(pen.duration)} мин</div>
              </div>
            </div>
          `;
        });
      });
      if (!anyPenalties) html += '<div class="empty">Штрафов не было</div>';

    } catch (e) {
      html += '<div class="empty">Ошибка загрузки статистики матча</div>';
    }

    body.innerHTML = html;
  }

  // ----- Карточка игрока: ВСЯ КАРЬЕРА (Регулярка + Плей-офф) -----
  async function openPlayerDetail(playerId) {
    openDetail();
    const body = document.getElementById("detail-body");

    try {
      const res = await fetch(`${API_BASE}/api/player/${playerId}`);
      const p = await res.json();

      const name = `${nameStr(p.firstName)} ${nameStr(p.lastName)}`;
      const birthPlace = [nameStr(p.birthCity), nameStr(p.birthCountry)].filter(Boolean).join(", ");

      let html = `
        <div class="detail-head">
          <img class="headshot" src="${p.headshot ?? ""}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="title">${escapeHtml(name)}</div>
            <div class="subtitle">${escapeHtml(p.teamAbbrev ?? "")} · №${val(p.sweaterNumber)} · ${escapeHtml(p.position ?? "")}</div>
          </div>
        </div>

        <div class="section-title">Личные данные</div>
        <div class="bio-grid">
          <div><div class="label">Дата рождения</div><div class="value">${val(p.birthDate)}</div></div>
          <div><div class="label">Место рождения</div><div class="value">${escapeHtml(birthPlace) || "—"}</div></div>
          <div><div class="label">Рост / Вес</div><div class="value">${val(p.heightInCentimeters, "—")} см / ${val(p.weightInKilograms, "—")} кг</div></div>
          <div><div class="label">Хват</div><div class="value">${val(p.shootsCatches)}</div></div>
        </div>
      `;

      // Таблица карьерных логов (careerTotals)
      html += '<div class="section-title">История карьеры</div>';
      
      const totals = p.seasonTotals || [];
      if (totals.length === 0) {
        html += '<div class="empty">История статистики недоступна</div>';
      } else {
        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Сезон</th>
                  <th>Команда</th>
                  <th>Лига</th>
                  <th>Тип</th>
                  <th>И</th>
                  <th>Г</th>
                  <th>П</th>
                  <th>О</th>
                  <th>+/-</th>
                  <th>Штр</th>
                </tr>
              </thead>
              <tbody>
        `;
        
        // Сортируем сезоны от новых к старым
        totals.sort((a, b) => b.season - a.season);

        totals.forEach(s => {
          // Форматируем год (из 20232024 делаем 23/24)
          const sStr = String(s.season);
          const formattedSeason = sStr.length === 8 ? `${sStr.slice(2,4)}/${sStr.slice(6,8)}` : sStr;
          
          // Тип сезона на русском
          const typeStr = s.gameTypeId === 2 ? "Рег" : s.gameTypeId === 3 ? "ПО" : "Другое";

          html += `
            <tr>
              <td>${formattedSeason}</td>
              <td style="font-family: inherit; font-weight: normal;">${escapeHtml(nameStr(s.teamName) || s.teamAbbrev || "—")}</td>
              <td>${escapeHtml(s.leagueAbbrev || "NHL")}</td>
              <td style="color: var(--silver-dim); font-size: 10px;">${typeStr}</td>
              <td class="num">${val(s.gamesPlayed, 0)}</td>
              <td class="num">${val(s.goals, 0)}</td>
              <td class="num">${val(s.assists, 0)}</td>
              <td class="num">${val(s.points, 0)}</td>
              <td class="num">${val(s.plusMinus, 0)}</td>
              <td class="num">${val(s.pim, 0)}</td>
            </tr>
          `;
        });

        html += `
              </tbody>
            </table>
          </div>
        `;
      }

      body.innerHTML = html;
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить карточку игрока</div>';
    }
  }

  loadSchedule();
</script>
</body>
