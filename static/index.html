<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NHL Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0A0A0A;
  --surface:#161616;
  --surface-2:#232323;
  --silver:#E6E9EA;
  --silver-dim:#9CA3AA;
  --blue:#1F5FCE;
  --red:#C8102E;
  --border:#2C2C2C;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding-bottom:24px;
  background:var(--bg);
  color:var(--silver);
  font-family:"Inter",sans-serif;
  -webkit-font-smoothing:antialiased;
}

header {
  padding:20px 16px 14px;
  border-bottom:2px solid var(--blue);
  background:linear-gradient(180deg,#141414 0%,var(--bg) 100%);
}

header h1 {
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 2px;
  color:var(--silver);
  font-family:"Oswald",sans-serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

header h1 .dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

header .sub {
  color:var(--silver-dim);
  font-size:12px;
}

nav {
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  gap:6px;
  padding:12px 16px 0;
  background:var(--bg);
}

button {
  font:inherit;
}

nav button,
.cat-row button,
.back-btn,
.date-row button,
.show-more {
  border:1px solid var(--border);
  color:var(--silver-dim);
  background:var(--surface);
  cursor:pointer;
}

nav button {
  flex:1;
  padding:10px 8px;
  border-radius:10px;
  font-family:"Oswald",sans-serif;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

nav button.active {
  border-color:var(--blue);
  color:#fff;
  background:var(--blue);
  font-weight:700;
}

main {
  padding:14px 16px 0;
}

.date-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 14px;
}

.date-input {
  width:140px;
  padding:6px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  color:var(--silver);
  background:transparent;
  font-family:"Roboto Mono",monospace;
  font-size:14px;
  text-align:center;
  cursor:pointer;
}

.date-input::-webkit-calendar-picker-indicator {
  filter:invert(1);
}

select.date-input {
  appearance:none;
  -webkit-appearance:none;
  background:var(--surface);
}

select.date-input option {
  color:var(--silver);
  background:#1A1A1A;
}

.date-row button {
  width:34px;
  height:34px;
  border-radius:8px;
  color:var(--silver);
  font-size:16px;
}

.card {
  margin-bottom:10px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}

.game-row {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  cursor:pointer;
}

.team.right {
  justify-content:flex-end;
  text-align:right;
}

.team-logo {
  width:32px;
  height:32px;
  flex-shrink:0;
  object-fit:contain;
}

.abbr {
  font-family:"Oswald",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.04em;
}

.team-record {
  margin-top:3px;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  line-height:1.1;
  white-space:nowrap;
}

.team-record strong {
  color:var(--silver);
}

.score-box {
  min-width:70px;
  padding:4px 6px;
  border-radius:10px;
  text-align:center;
}

.score-box.clickable {
  cursor:pointer;
}

.score-box.clickable:active,
.team:active,
.player-row:active,
.spotlight-card:active {
  background:var(--surface-2);
}

.score-box .score {
  color:var(--silver);
  font-family:"Roboto Mono",monospace;
  font-size:22px;
  font-weight:700;
}

.score-box .status {
  margin-top:2px;
  color:var(--red);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.table-wrapper,
.table-scroll {
  position:relative;
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.standings-table {
  display:grid;
  grid-template-columns:24px 30px 110px repeat(8,35px);
  min-width:600px;
  align-items:center;
}

.sticky-col {
  position:sticky;
  z-index:2;
  background:var(--surface);
}

.sticky-col-1 { left:0; }
.sticky-col-2 { left:24px; }
.sticky-col-3 { left:54px; }

.standings-head,
.standings-row,
.group-header-row {
  display:contents;
}

.standings-head > div,
.standings-row > div {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.standings-head > div {
  color:var(--silver-dim);
  font-size:10px;
  text-transform:uppercase;
}

.standings-head .sticky-col {
  z-index:3;
}

.standings-head .sortable {
  color:var(--silver);
  cursor:pointer;
  text-decoration:underline dotted;
}

.standings-row {
  cursor:pointer;
}

.standings-row:active > div {
  background:var(--surface-2)!important;
}

.standings-row .name {
  width:100%;
  justify-content:flex-start;
  overflow:hidden;
  padding-left:5px;
  font-family:"Oswald",sans-serif;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.standings-row .num,
.standings-row .diff,
.standings-row .pts,
.stat-table .num {
  font-family:"Roboto Mono",monospace;
}

.standings-row .num.sticky-col-1 {
  color:var(--silver-dim);
}

.standings-row .team-logo {
  width:20px;
  height:20px;
}

.standings-row .pts {
  color:var(--blue);
  font-weight:700;
}

.group-header-row > div {
  grid-column:1/-1;
  padding:8px 10px;
  border-bottom:1px solid var(--border);
  color:var(--silver);
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.cat-row {
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

.cat-row button {
  flex:1;
  min-width:0;
  padding:8px 6px;
  border-radius:8px;
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.cat-row button.active {
  border-color:var(--red);
  color:#fff;
  background:var(--red);
  font-weight:700;
}

.player-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.player-row:last-child {
  border-bottom:none;
}

.player-row .rank {
  width:20px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  text-align:center;
}

.player-row .headshot {
  width:42px;
  height:42px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.player-row .info {
  min-width:0;
  flex:1;
}

.player-row .pname {
  overflow:hidden;
  font-family:"Oswald",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-row .pteam {
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:2px;
  color:var(--silver-dim);
  font-size:11px;
}

.player-row .pteam .team-logo {
  width:16px;
  height:16px;
}

.player-row .pvalue {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-size:20px;
  font-weight:700;
}

.show-more {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.empty,
.loading {
  grid-column:1/-1;
  padding:30px 0;
  color:var(--silver-dim);
  font-size:13px;
  text-align:center;
}

.loading {
  font-family:"Roboto Mono",monospace;
}

.spotlight-title {
  margin:24px 0 12px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.spotlight-card {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  cursor:pointer;
}

.spotlight-headshot {
  width:52px;
  height:52px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.spotlight-info {
  min-width:0;
  flex:1;
}

.spotlight-name {
  font-family:"Oswald",sans-serif;
  font-size:15px;
  font-weight:600;
}

.spotlight-team {
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
  color:var(--silver-dim);
  font-size:12px;
}

.spotlight-team .team-logo {
  width:16px;
  height:16px;
}

.spotlight-rank {
  width:18px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  text-align:center;
}

.spotlight-value {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-size:20px;
  font-weight:700;
}

.back-btn {
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-bottom:12px;
  padding:8px 14px;
  border-radius:10px;
  color:var(--silver);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.detail-head-game {
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}

.detail-head {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}

.detail-head img.team-logo,
.detail-head-game img.team-logo {
  width:48px;
  height:48px;
}

.detail-head img.headshot {
  width:64px;
  height:64px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.detail-head .title,
.detail-head-game .title {
  font-family:"Oswald",sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:center;
  text-transform:uppercase;
}

.detail-head .subtitle,
.detail-head-game .subtitle {
  margin-top:2px;
  color:var(--silver-dim);
  font-size:12px;
  text-align:center;
}

.section-title {
  margin:16px 0 8px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.bio-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 14px;
  font-size:13px;
}

.bio-grid .label {
  color:var(--silver-dim);
  font-size:11px;
  text-transform:uppercase;
}

.bio-grid .value {
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.stat-table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.stat-table th,
.stat-table td {
  padding:7px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
  white-space:nowrap;
}

.stat-table th {
  color:var(--silver-dim);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.stat-table th.sortable {
  color:var(--silver);
  cursor:pointer;
  text-decoration:underline dotted;
}

.stat-table td:first-child,
.stat-table th:first-child {
  font-family:"Oswald",sans-serif;
  font-weight:600;
  text-align:left;
}

.stat-table tbody tr.clickable-row {
  cursor:pointer;
}

.stat-table tbody tr.clickable-row:active {
  background:var(--surface-2);
}

.stat-table tbody tr.playoff-header-row td {
  padding:6px 8px;
  color:var(--silver);
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.05em;
  text-align:left;
  text-transform:uppercase;
}

.stat-table tbody tr.playoff-border {
  border-bottom:3px solid var(--blue);
}

.goal-row {
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.goal-row .time {
  width:46px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:12px;
}

.goal-row .desc {
  flex:1;
}

.goal-row .scorer {
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.goal-row .assists {
  margin-top:2px;
  color:var(--silver-dim);
  font-size:11px;
}

.goal-row .scoreline {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-weight:700;
}

.period-label {
  margin:10px 0 4px;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:11px;
  text-transform:uppercase;
}

.bracket-wrap {
  margin-top:16px;
}

.bracket-round-title {
  margin:14px 0 8px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.bracket-series {
  margin-bottom:8px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
}

.bracket-team-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 0;
  font-size:13px;
}

.bracket-team-row .bt-name {
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.bracket-team-row .bt-name img {
  width:20px;
  height:20px;
  object-fit:contain;
}

.bracket-team-row.winner .bt-name {
  color:var(--blue);
}

.bracket-team-row .bt-wins {
  font-family:"Roboto Mono",monospace;
  font-weight:700;
}

.teamstat-head {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.teamstat-head .team-logo {
  width:26px;
  height:26px;
}

.teamstat-head .side {
  display:flex;
  align-items:center;
  gap:8px;
}

.teamstat-head .side.right {
  justify-content:flex-end;
}

.teamstat-row {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
}

.teamstat-row .val {
  color:var(--silver);
  font-family:"Roboto Mono",monospace;
  font-size:15px;
  font-weight:700;
  text-align:center;
}

.teamstat-row .val.away {
  text-align:left;
}

.teamstat-row .val.home {
  text-align:right;
}

.teamstat-row .periods {
  display:block;
  margin-top:1px;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
}

.teamstat-row .label {
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.04em;
  text-align:center;
  text-transform:uppercase;
}
</style>
</head>

<body>
<header>
  <h1><span class="dot"></span>NHL LIVE</h1>
  <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
</header>

<nav id="main-nav">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Лидеры</button>
</nav>

<main>
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <input type="date" id="date-picker" class="date-input">
      <button id="next-day">›</button>
    </div>

    <div id="games">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <div id="view-standings" style="display:none">
    <div class="cat-row">
      <button id="std-mode-all" class="active">Общая</button>
      <button id="std-mode-conf">По конференциям</button>
      <button id="std-mode-div">По дивизионам</button>
    </div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;">
      <span style="font-family:'Oswald',sans-serif;font-size:12px;color:var(--silver-dim);text-transform:uppercase;">
        Сезон
      </span>
      <select id="season-select" class="date-input" style="width:auto;flex:1;"></select>
    </div>

    <div class="card" style="padding:0;">
      <div class="table-wrapper">
        <div class="standings-table">
          <div class="standings-head">
            <div class="sticky-col sticky-col-1"></div>
            <div class="sticky-col sticky-col-2"></div>
            <div class="sticky-col sticky-col-3"></div>
            <div class="sortable" data-sort="gamesPlayed">И</div>
            <div class="sortable" data-sort="wins">В</div>
            <div class="sortable" data-sort="otLosses">ОТ</div>
            <div class="sortable" data-sort="losses">П</div>
            <div class="sortable" data-sort="goalFor">ЗШ</div>
            <div class="sortable" data-sort="goalAgainst">ПШ</div>
            <div class="sortable" data-sort="goalDifferential">+/-</div>
            <div class="sortable" data-sort="points">О</div>
          </div>

          <div id="standings-body" style="display:contents;">
            <div class="loading">Загрузка...</div>
          </div>
        </div>
      </div>
    </div>

    <div id="bracket-container"></div>
  </div>

  <div id="view-players" style="display:none">
    <div class="cat-row">
      <button id="leaders-skaters-btn" class="active">Игроки</button>
      <button id="leaders-goalies-btn">Вратари</button>
    </div>

    <div id="skater-categories" class="cat-row">
      <button data-cat="points" class="active">Очки</button>
      <button data-cat="goals">Голы</button>
      <button data-cat="assists">Передачи</button>
      <button data-cat="plusMinus">+/-</button>
    </div>

    <div id="goalie-categories" class="cat-row" style="display:none;">
      <button data-goalie-sort="wins" class="active">Победы</button>
      <button data-goalie-sort="losses">Поражения</button>
      <button data-goalie-sort="savePctg">%ОБ</button>
      <button data-goalie-sort="gaa">ГКИ</button>
    </div>

    <div class="card">
      <div id="players-body">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
  </div>

  <div id="view-detail" style="display:none">
    <button class="back-btn" id="back-btn">‹ Назад</button>

    <div id="detail-body">
      <div class="loading">Загрузка...</div>
    </div>
  </div>
</main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API_BASE = "https://nhl-live-api.sergvolk504.workers.dev";

let currentTeamFullData = null;
let currentTeamType = "regular";
let currentTeamSortKey = "points";
let currentTeamSortAsc = false;

let currentStandingsData = [];
let standingsSortKey = "points";
let standingsSortAsc = false;
let standingsViewMode = "all";
let selectedSeasonEndDate = "";
let bracketLoadedOnce = false;

let lastMainTab = "schedule";
let currentDate = new Date();
let currentCat = "points";
let currentLimit = 25;

let leadersMode = "skaters";
let currentGoalieSortKey = "wins";
let currentGoalieSortAsc = false;

const datePicker = document.getElementById("date-picker");

function nameStr(value) {
  if (!value) return "";
  if (typeof value === "string") return value;
  return value.default || value.name || "";
}

function val(value, fallback = "—") {
  return value === undefined || value === null || value === ""
    ? fallback
    : value;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function getTeamAbbrev(team) {
  if (!team) return "";

  if (typeof team === "string") {
    return team.trim().toUpperCase();
  }

  if (typeof team === "object") {
    return String(
      team.default ||
      team.abbrev ||
      team.abbreviation ||
      team.teamAbbrev ||
      ""
    ).trim().toUpperCase();
  }

  return "";
}

function getTeamName(team) {
  if (!team) return "";

  if (typeof team === "string") return team;

  if (typeof team === "object") {
    return String(
      team.default ||
      team.name ||
      team.teamName ||
      ""
    );
  }

  return "";
}

function getTeamLogo(team) {
  if (!team) return "";

  if (typeof team === "string") return team;

  if (typeof team === "object") {
    return String(
      team.logo ||
      team.teamLogo ||
      team.crest ||
      ""
    );
  }

  return "";
}

function getHeadshot(player) {
  if (player.headshot) return player.headshot;

  const id = player.playerId || player.id;
  return id
    ? `https://assets.nhle.com/mugs/nhl/20252026/${id}.png`
    : "";
}

function fmtDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function seasonIdFromEndDate(endDate) {
  if (!endDate || typeof endDate !== "string") return null;

  const match = endDate.match(/^(\d{4})-\d{2}-\d{2}$/);
  if (!match) return null;

  const endYear = Number(match[1]);
  return `${endYear - 1}${endYear}`;
}

function formatPeriodLabel(descriptor) {
  if (!descriptor) return "Период";

  if (descriptor.periodType === "SO") return "Буллиты";

  if (descriptor.periodType === "OT") {
    const number = descriptor.number && descriptor.number > 3
      ? descriptor.number - 3
      : 1;

    return number > 1
      ? `${number}-й овертайм`
      : "Овертайм";
  }

  return descriptor.number
    ? `${descriptor.number}-й период`
    : "Период";
}

function openDetail() {
  document.getElementById("view-schedule").style.display = "none";
  document.getElementById("view-standings").style.display = "none";
  document.getElementById("view-players").style.display = "none";
  document.getElementById("view-detail").style.display = "";
  document.getElementById("main-nav").style.display = "none";
  document.getElementById("detail-body").innerHTML =
    '<div class="loading">Загрузка...</div>';
  window.scrollTo(0, 0);
}

function switchTab(tab) {
  document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
  document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
  document.getElementById("tab-players").classList.toggle("active", tab === "players");

  document.getElementById("view-schedule").style.display =
    tab === "schedule" ? "" : "none";

  document.getElementById("view-standings").style.display =
    tab === "standings" ? "" : "none";

  document.getElementById("view-players").style.display =
    tab === "players" ? "" : "none";

  document.getElementById("view-detail").style.display = "none";
  document.getElementById("main-nav").style.display = "flex";

  lastMainTab = tab;

  if (tab === "standings") {
    loadStandings();

    if (!bracketLoadedOnce) {
      const now = new Date();
      const startYear = now.getMonth() >= 8
        ? now.getFullYear()
        : now.getFullYear() - 1;

      const playoffYear = startYear + 1;
      const playoffStart = new Date(playoffYear, 3, 14);

      if (now >= playoffStart) {
        loadPlayoffBracket(String(playoffYear));
      } else {
        document.getElementById("bracket-container").innerHTML = `
          <div class="bracket-wrap">
            <div class="section-title">Сетка плей-офф</div>
            <div class="empty">
              Регулярный сезон ещё не завершён — плей-офф начнётся позже
            </div>
          </div>
        `;
      }

      bracketLoadedOnce = true;
    }
  }

  if (tab === "players") {
    loadPlayers();
  }
}

document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
document.getElementById("tab-standings").onclick = () => switchTab("standings");
document.getElementById("tab-players").onclick = () => switchTab("players");
document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);

document.getElementById("prev-day").onclick = () => {
  currentDate.setDate(currentDate.getDate() - 1);
  loadSchedule();
};

document.getElementById("next-day").onclick = () => {
  currentDate.setDate(currentDate.getDate() + 1);
  loadSchedule();
};

datePicker.addEventListener("change", event => {
  if (event.target.value) {
    currentDate = new Date(`${event.target.value}T12:00:00`);
    loadSchedule();
  }
});

async function buildSeasonOptions() {
  const select = document.getElementById("season-select");
  select.innerHTML = "<option value=''>Загрузка сезонов...</option>";

  try {
    const response = await fetch(`${API_BASE}/api/seasons-list`);
    const data = await response.json();
    const seasons = data?.seasons || [];

    if (!seasons.length) {
      select.innerHTML = "<option value=''>Текущий сезон</option>";
      return;
    }

    let html = "<option value=''>Текущий сезон</option>";

    [...seasons]
      .sort((a, b) => b.id - a.id)
      .forEach(season => {
        const id = String(season.id);
        const startYear = id.slice(0, 4);
        const endYear = id.slice(6, 8);

        html += `
          <option
            value="${escapeHtml(season.standingsEnd || "")}"
            data-start-year="${startYear}"
          >
            ${startYear}-${endYear}
          </option>
        `;
      });

    select.innerHTML = html;
  } catch (error) {
    console.error(error);
    select.innerHTML = "<option value=''>Текущий сезон</option>";
  }
}

document.getElementById("season-select").addEventListener("change", event => {
  const option = event.target.options[event.target.selectedIndex];

  selectedSeasonEndDate = option.value;
  currentStandingsData = [];
  loadStandings();

  let startYear = option.dataset.startYear;

  if (!startYear) {
    const now = new Date();
    startYear = String(
      now.getMonth() >= 8
        ? now.getFullYear()
        : now.getFullYear() - 1
    );
  }

  const playoffYear = String(Number(startYear) + 1);

  if (option.dataset.startYear || new Date() >= new Date(Number(playoffYear), 3, 14)) {
    loadPlayoffBracket(playoffYear);
  } else {
    document.getElementById("bracket-container").innerHTML = `
      <div class="bracket-wrap">
        <div class="section-title">Сетка плей-офф</div>
        <div class="empty">
          Регулярный сезон ещё не завершён — плей-офф начнётся позже
        </div>
      </div>
    `;
  }
});

document.querySelectorAll(".standings-head .sortable").forEach(header => {
  header.onclick = () => {
    const key = header.dataset.sort;

    if (standingsSortKey === key) {
      standingsSortAsc = !standingsSortAsc;
    } else {
      standingsSortKey = key;
      standingsSortAsc = false;
    }

    renderStandings();
  };
});

document.getElementById("std-mode-all").onclick = () => setStandingsMode("all");
document.getElementById("std-mode-conf").onclick = () => setStandingsMode("conf");
document.getElementById("std-mode-div").onclick = () => setStandingsMode("div");

function setStandingsMode(mode) {
  standingsViewMode = mode;

  document.getElementById("std-mode-all").classList.toggle("active", mode === "all");
  document.getElementById("std-mode-conf").classList.toggle("active", mode === "conf");
  document.getElementById("std-mode-div").classList.toggle("active", mode === "div");

  currentStandingsData.length
    ? renderStandings()
    : loadStandings();
}

async function loadSchedule() {
  const games = document.getElementById("games");
  const date = fmtDate(currentDate);

  games.innerHTML = '<div class="loading">Загрузка...</div>';
  datePicker.value = date;

  try {
    const response = await fetch(
      `${API_BASE}/api/schedule?date=${encodeURIComponent(date)}`
    );

    const data = await response.json();
    const day = (data.gameWeek || []).find(item => item.date === date);
    const list = day?.games || [];

    if (!list.length) {
      games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
      loadSpotlight();
      return;
    }

    games.innerHTML = list.map(renderGame).join("");

    games.querySelectorAll(".score-box.clickable").forEach(element => {
      element.addEventListener("click", () => {
        openGameDetail(
          element.dataset.gameId,
          element.dataset.away,
          element.dataset.home,
          element.dataset.awayLogo,
          element.dataset.homeLogo
        );
      });
    });

    games.querySelectorAll(".team[data-team]").forEach(team => {
      team.addEventListener("click", event => {
        event.stopPropagation();

        openTeamDetail(
          team.dataset.team,
          team.dataset.name,
          team.dataset.logo
        );
      });
    });
  } catch (error) {
    console.error(error);
    games.innerHTML =
      '<div class="empty">Не удалось загрузить матчи</div>';
  }
}

function renderTeamRecord(team) {
  const record = team?.currentRecord;
  if (!record) return "";

  return `
    <div class="team-record">
      <strong>
        ${record.wins ?? 0}-${record.losses ?? 0}-${record.otLosses ?? 0}-${record.points ?? 0}
      </strong>
    </div>
  `;
}

function renderGame(game) {
  const away = game.awayTeam || {};
  const home = game.homeTeam || {};
  const started = game.gameState !== "FUT" && game.gameState !== "PRE";

  const status = started
    ? ((game.gameState === "LIVE" || game.gameState === "CRIT")
        ? "LIVE"
        : "Финал")
    : new Date(game.startTimeUTC).toLocaleTimeString("ru-RU", {
        hour:"2-digit",
        minute:"2-digit"
      });

  return `
    <div class="card">
      <div class="game-row">
        <div
          class="team"
          data-team="${escapeHtml(away.abbrev || "")}"
          data-name="${escapeHtml(away.name || away.abbrev || "")}"
          data-logo="${escapeHtml(away.logo || "")}"
        >
          <img
            class="team-logo"
            src="${escapeHtml(away.logo || "")}"
            alt=""
            onerror="this.style.display='none'"
          >

          <div>
            <div class="abbr">${escapeHtml(away.abbrev || "")}</div>
            ${renderTeamRecord(away)}
          </div>
        </div>

        <div
          class="${started ? "score-box clickable" : "score-box"}"
          ${started ? `
            data-game-id="${escapeHtml(game.id)}"
            data-away="${escapeHtml(away.abbrev || "")}"
            data-home="${escapeHtml(home.abbrev || "")}"
            data-away-logo="${escapeHtml(away.logo || "")}"
            data-home-logo="${escapeHtml(home.logo || "")}"
          ` : ""}
        >
          <div class="score">
            ${started
              ? `${away.score ?? 0} : ${home.score ?? 0}`
              : "vs"}
          </div>
          <div class="status">${status}</div>
        </div>

        <div
          class="team right"
          data-team="${escapeHtml(home.abbrev || "")}"
          data-name="${escapeHtml(home.name || home.abbrev || "")}"
          data-logo="${escapeHtml(home.logo || "")}"
        >
          <div>
            <div class="abbr">${escapeHtml(home.abbrev || "")}</div>
            ${renderTeamRecord(home)}
          </div>

          <img
            class="team-logo"
            src="${escapeHtml(home.logo || "")}"
            alt=""
            onerror="this.style.display='none'"
          >
        </div>
      </div>
    </div>
  `;
}

async function loadStandings() {
  const body = document.getElementById("standings-body");
  body.innerHTML = '<div class="loading">Загрузка...</div>';

  try {
    const url = selectedSeasonEndDate
      ? `${API_BASE}/api/standings-by-date/${encodeURIComponent(selectedSeasonEndDate)}`
      : `${API_BASE}/api/standings`;

    const response = await fetch(url);
    const data = await response.json();

    currentStandingsData = data.standings || [];
    renderStandings();
  } catch (error) {
    console.error(error);
    body.innerHTML =
      '<div class="empty">Не удалось загрузить таблицу</div>';
  }
}

function renderTeamRow(team, rank) {
  const abbreviation = getTeamAbbrev(
    team.teamAbbrev ||
    team.abbrev ||
    team.team
  );

  const teamName = getTeamName(
    team.teamName ||
    team.name
  ) || abbreviation;

  const logo = getTeamLogo(
    team.teamLogo ||
    team.logo
  );

  const goalFor = Number(team.goalFor ?? 0);
  const goalAgainst = Number(team.goalAgainst ?? 0);
  const difference = Number(
    team.goalDifferential ??
    goalFor - goalAgainst
  );

  return `
    <div
      class="standings-row"
      data-team="${escapeHtml(abbreviation)}"
      data-name="${escapeHtml(teamName)}"
      data-logo="${escapeHtml(logo)}"
    >
      <div class="num sticky-col sticky-col-1">${rank}</div>

      <div class="sticky-col sticky-col-2">
        <img
          class="team-logo"
          src="${escapeHtml(logo)}"
          alt=""
          onerror="this.style.visibility='hidden'"
        >
      </div>

      <div class="name sticky-col sticky-col-3">
        ${escapeHtml(abbreviation)}
      </div>

      <div class="num">${team.gamesPlayed ?? 0}</div>
      <div class="num">${team.wins ?? 0}</div>
      <div class="num">${team.otLosses ?? 0}</div>
      <div class="num">${team.losses ?? 0}</div>
      <div class="num">${goalFor}</div>
      <div class="num">${goalAgainst}</div>

      <div
        class="diff"
        style="color:${difference >= 0 ? "#2ecc71" : "#e74c3c"}"
      >
        ${difference > 0 ? "+" : ""}${difference}
      </div>

      <div class="pts">${team.points ?? 0}</div>
    </div>
  `;
}

function sortTeams(teams) {
  return [...teams].sort((a, b) => {
    let valueA = a[standingsSortKey] ?? 0;
    let valueB = b[standingsSortKey] ?? 0;

    if (standingsSortKey === "goalDifferential") {
      valueA = a.goalDifferential ??
        ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));

      valueB = b.goalDifferential ??
        ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
    }

    return standingsSortAsc
      ? Number(valueA) - Number(valueB)
      : Number(valueB) - Number(valueA);
  });
}

function renderStandings() {
  const body = document.getElementById("standings-body");

  if (!currentStandingsData.length) {
    body.innerHTML = '<div class="empty">Нет данных</div>';
    return;
  }

  let html = "";

  if (standingsViewMode === "all") {
    html = sortTeams(currentStandingsData)
      .map((team, index) => renderTeamRow(team, index + 1))
      .join("");
  } else {
    const field = standingsViewMode === "conf"
      ? "conferenceName"
      : "divisionName";

    const groups = {};

    currentStandingsData.forEach(team => {
      const group = nameStr(team[field]) || "Без группы";
      if (!groups[group]) groups[group] = [];
      groups[group].push(team);
    });

    Object.keys(groups).sort().forEach(group => {
      html += `
        <div class="group-header-row">
          <div>${escapeHtml(group)}</div>
        </div>
      `;

      html += sortTeams(groups[group])
        .map((team, index) => renderTeamRow(team, index + 1))
        .join("");
    });
  }

  body.innerHTML = html;

  body.querySelectorAll(".standings-row").forEach(row => {
    row.addEventListener("click", () => {
      openTeamDetail(
        row.dataset.team,
        row.dataset.name,
        row.dataset.logo
      );
    });
  });
}

async function loadPlayoffBracket(playoffYear) {
  const container = document.getElementById("bracket-container");

  container.innerHTML = `
    <div class="bracket-wrap">
      <div class="loading">Загрузка сетки плей-офф...</div>
    </div>
  `;

  try {
    const response = await fetch(
      `${API_BASE}/api/playoff-bracket/${encodeURIComponent(playoffYear)}`
    );

    const data = await response.json();
    const series = data?.series || [];

    if (!series.length) {
      container.innerHTML = `
        <div class="bracket-wrap">
          <div class="section-title">Сетка плей-офф</div>
          <div class="empty">Плей-офф недоступен</div>
        </div>
      `;
      return;
    }

    const rounds = {};

    series.forEach(item => {
      const round =
        item.round ??
        item.roundNumber ??
        item.playoffRound ??
        1;

      if (!rounds[round]) rounds[round] = [];
      rounds[round].push(item);
    });

    const roundNames = {
      1:"1-й раунд",
      2:"2-й раунд (полуфинал конференции)",
      3:"Финал конференции",
      4:"Финал Кубка Стэнли"
    };

    let html = `
      <div class="bracket-wrap">
        <div class="section-title">Сетка плей-офф</div>
    `;

    Object.keys(rounds)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(round => {
        html += `
          <div class="bracket-round-title">
            ${escapeHtml(roundNames[round] || `Раунд ${round}`)}
          </div>
        `;

        rounds[round].forEach(item => {
          const top =
            item.topSeedTeam ||
            item.matchupTeams?.[0] ||
            item.team1 ||
            {};

          const bottom =
            item.bottomSeedTeam ||
            item.matchupTeams?.[1] ||
            item.team2 ||
            {};

          const topWins =
            item.topSeedWins ??
            item.matchupTeams?.[0]?.seriesWins ??
            item.team1Wins ??
            0;

          const bottomWins =
            item.bottomSeedWins ??
            item.matchupTeams?.[1]?.seriesWins ??
            item.team2Wins ??
            0;

          const topName =
            top.abbrev ||
            top.teamAbbrev?.default ||
            top.placeName?.default ||
            "TBD";

          const bottomName =
            bottom.abbrev ||
            bottom.teamAbbrev?.default ||
            bottom.placeName?.default ||
            "TBD";

          html += `
            <div class="bracket-series">
              <div class="bracket-team-row ${
                topWins > bottomWins && topWins === 4 ? "winner" : ""
              }">
                <div class="bt-name">
                  <img src="${escapeHtml(top.logo || top.teamLogo || "")}" alt="">
                  <span>${escapeHtml(topName)}</span>
                </div>
                <div class="bt-wins">${topWins}</div>
              </div>

              <div class="bracket-team-row ${
                bottomWins > topWins && bottomWins === 4 ? "winner" : ""
              }">
                <div class="bt-name">
                  <img src="${escapeHtml(bottom.logo || bottom.teamLogo || "")}" alt="">
                  <span>${escapeHtml(bottomName)}</span>
                </div>
                <div class="bt-wins">${bottomWins}</div>
              </div>
            </div>
          `;
        });
      });

    html += "</div>";
    container.innerHTML = html;
  } catch (error) {
    console.error(error);
    container.innerHTML =
      '<div class="bracket-wrap"><div class="empty">Не удалось загрузить сетку плей-офф</div></div>';
  }
}

async function loadPlayers() {
  const body = document.getElementById("players-body");
  body.innerHTML = '<div class="loading">Загрузка...</div>';

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams({
      limit:String(currentLimit)
    });

    if (seasonId) params.set("season", seasonId);

    const response = await fetch(
      `${API_BASE}/api/leaders/${encodeURIComponent(currentCat)}?${params}`
    );

    const data = await response.json();
    const list = data[currentCat] || [];

    if (!list.length) {
      body.innerHTML = '<div class="empty">Нет данных игроков</div>';
      return;
    }

    body.innerHTML = list.map((player, index) => `
      <div class="player-row" data-player-id="${escapeHtml(player.id || player.playerId || "")}">
        <div class="rank">${index + 1}</div>

        <img
          class="headshot"
          src="${escapeHtml(getHeadshot(player))}"
          alt=""
          onerror="this.style.visibility='hidden'"
        >

        <div class="info">
          <div class="pname">
            ${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Игрок")}
          </div>

          <div class="pteam">
            <img
              class="team-logo"
              src="${escapeHtml(player.teamLogo || "")}"
              alt=""
              onerror="this.style.display='none'"
            >
            ${escapeHtml(player.teamAbbrev || "")}
          </div>
        </div>

        <div class="pvalue">${escapeHtml(player.value ?? "")}</div>
      </div>
    `).join("");

    if (list.length >= currentLimit && currentLimit < 50) {
      body.insertAdjacentHTML(
        "beforeend",
        '<button class="show-more" id="show-more-players">Показать больше</button>'
      );

      document.getElementById("show-more-players").onclick = () => {
        currentLimit = 50;
        loadPlayers();
      };
    }

    body.querySelectorAll(".player-row").forEach(row => {
      row.addEventListener("click", () => {
        openPlayerDetail(row.dataset.playerId);
      });
    });
  } catch (error) {
    console.error(error);
    body.innerHTML =
      '<div class="empty">Не удалось загрузить лидеров</div>';
  }
}

function goalieSortValue(player) {
  if (currentGoalieSortKey === "name") {
    return `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
      .trim()
      .toLowerCase();
  }

  if (currentGoalieSortKey === "savePctg") {
    return Number(player.savePctg ?? player.savePercentage ?? -Infinity);
  }

  if (currentGoalieSortKey === "gaa") {
    return Number(player.gaa ?? player.goalsAgainstAverage ?? Infinity);
  }

  return Number(player[currentGoalieSortKey] ?? -Infinity);
}

async function loadGoalieCards() {
  const body = document.getElementById("players-body");
  body.innerHTML = '<div class="loading">Загрузка статистики вратарей...</div>';

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams({ limit:"100" });

    if (seasonId) params.set("season", seasonId);

    const response = await fetch(
      `${API_BASE}/api/goalie-leaders?${params}`,
      { cache:"no-store" }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data?.error || `HTTP ${response.status}`);
    }

    const rows = Array.isArray(data.goalies)
      ? [...data.goalies]
      : [];

    rows.sort((a, b) => {
      const valueA = goalieSortValue(a);
      const valueB = goalieSortValue(b);

      if (typeof valueA === "string" || typeof valueB === "string") {
        const result = String(valueA).localeCompare(String(valueB), "ru");
        return currentGoalieSortAsc ? result : -result;
      }

      return currentGoalieSortAsc
        ? valueA - valueB
        : valueB - valueA;
    });

    if (!rows.length) {
      body.innerHTML =
        '<div class="empty">Нет данных вратарей за выбранный сезон</div>';
      return;
    }

    body.innerHTML = rows.map((player, index) => {
      const savePct = player.savePctg ?? player.savePercentage;
      const gaa = player.gaa ?? player.goalsAgainstAverage;
      const value = player[currentGoalieSortKey];

      let mainValue = value;

      if (currentGoalieSortKey === "savePctg") {
        mainValue = typeof savePct === "number"
          ? savePct.toFixed(3)
          : "—";
      }

      if (currentGoalieSortKey === "gaa") {
        mainValue = typeof gaa === "number"
          ? gaa.toFixed(2)
          : "—";
      }

      if (currentGoalieSortKey === "losses") {
        mainValue = player.losses ?? "—";
      }

      return `
        <div
          class="player-row"
          data-player-id="${escapeHtml(player.playerId || player.id || "")}"
        >
          <div class="rank">${index + 1}</div>

          <img
            class="headshot"
            src="${escapeHtml(getHeadshot(player))}"
            alt=""
            onerror="this.style.visibility='hidden'"
          >

          <div class="info">
            <div class="pname">
              ${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Вратарь")}
            </div>

            <div class="pteam">
              <img
                class="team-logo"
                src="${escapeHtml(player.teamLogo || "")}"
                alt=""
                onerror="this.style.display='none'"
              >
              ${escapeHtml(player.teamAbbrev || "")}
            </div>
          </div>

          <div class="pvalue">${escapeHtml(mainValue ?? "—")}</div>
        </div>
      `;
    }).join("");

    body.querySelectorAll(".player-row").forEach(row => {
      row.addEventListener("click", () => {
        openPlayerDetail(row.dataset.playerId);
      });
    });
  } catch (error) {
    console.error(error);
    body.innerHTML = `
      <div class="empty">
        Не удалось загрузить статистику вратарей
        <br>
        <small>${escapeHtml(error.message || "Ошибка загрузки")}</small>
      </div>
    `;
  }
}

async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
  const abbreviation = getTeamAbbrev(teamAbbrev);
  const name = getTeamName(teamName) || abbreviation;
  const logo = getTeamLogo(teamLogo);

  openDetail();

  if (!abbreviation) {
    document.getElementById("detail-body").innerHTML =
      '<div class="empty">Не удалось определить клуб</div>';
    return;
  }

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams();

    if (seasonId) params.set("season", seasonId);

    const query = params.toString()
      ? `?${params}`
      : "";

    const response = await fetch(
      `${API_BASE}/api/roster-stats/${encodeURIComponent(abbreviation)}${query}`,
      {
        cache:"no-store",
        headers:{ Accept:"application/json" }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data?.error || `HTTP ${response.status}`);
    }

    if (data?.error) {
      throw new Error(data.error);
    }

    currentTeamFullData =
      data.data ||
      data.result ||
      data.roster ||
      data;

    currentTeamType = "regular";
    currentTeamSortKey = "points";
    currentTeamSortAsc = false;

    renderTeamTabsAndTables(abbreviation, name, logo);
  } catch (error) {
    console.error(error);

    document.getElementById("detail-body").innerHTML = `
      <div class="empty">
        Не удалось загрузить состав команды
        <br>
        <small>${escapeHtml(error.message || "Ошибка сервера")}</small>
      </div>
    `;
  }
}

function renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo) {
  const body = document.getElementById("detail-body");

  body.innerHTML = `
    <div class="detail-head">
      <img
        class="team-logo"
        src="${escapeHtml(teamLogo)}"
        alt=""
        onerror="this.style.visibility='hidden'"
      >

      <div>

        <div class="subtitle">${escapeHtml(teamAbbrev)}</div>
      </div>
    </div>

    <div class="cat-row" style="margin-top:14px;">
      <button id="btn-team-reg" class="active">Регулярный сезон</button>
      <button id="btn-team-po">Плей-офф</button>
    </div>

    <div id="team-tables-container"></div>
  `;

  document.getElementById("btn-team-reg").onclick = () => {
    currentTeamType = "regular";
    document.getElementById("btn-team-reg").classList.add("active");
    document.getElementById("btn-team-po").classList.remove("active");

    currentTeamType = "playoff";
    document.getElementById("btn-team-po").classList.add("active");
    document.getElementById("btn-team-reg").classList.remove("active");
    buildTeamTablesBlock();
  };

  buildTeamTablesBlock();
}

function normalizeTeamDataset(data) {
  if (!data || typeof data !== "object") {
    return { skaters:[], goalies:[] };
  }

  const skaters =
    data.skaters ||
    data.skatersStats ||
    data.players ||
    data.forwards ||
    [];

  const goalies =
    data.goalies ||
    data.goaltenders ||
    data.goaliesStats ||
    [];

  return {
    skaters:Array.isArray(skaters) ? skaters : [],
    goalies:Array.isArray(goalies) ? goalies : []
  };
}

function buildTeamTablesBlock() {
  const container = document.getElementById("team-tables-container");

  const source =
    currentTeamFullData?.[currentTeamType] ||
    currentTeamFullData?.[
      currentTeamType === "regular"
        ? "regularSeason"
        : "playoffs"
    ] ||
    currentTeamFullData;

  const dataset = normalizeTeamDataset(source);

  const skaters = [...dataset.skaters].sort((a, b) => {
    const valueA = Number(
      currentTeamSortKey === "penaltyMinutes"
        ? a.penaltyMinutes ?? a.pim ?? 0
        : a[currentTeamSortKey] ?? 0
    );

    const valueB = Number(
      currentTeamSortKey === "penaltyMinutes"
        ? b.penaltyMinutes ?? b.pim ?? 0
        : b[currentTeamSortKey] ?? 0
    );

    return currentTeamSortAsc
      ? valueA - valueB
      : valueB - valueA;
  });

  const goalies = [...dataset.goalies].sort(
    (a, b) => Number(b.gamesPlayed ?? 0) - Number(a.gamesPlayed ?? 0)
  );

  let html = '<div class="section-title">Полевые игроки</div>';

  if (!skaters.length) {
    html += '<div class="empty">Нет данных полевых игроков</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th class="sortable" data-sort="gamesPlayed">И</th>
              <th class="sortable" data-sort="goals">Г</th>
              <th class="sortable" data-sort="assists">П</th>
              <th class="sortable" data-sort="points">О</th>
              <th class="sortable" data-sort="plusMinus">+/-</th>
              <th class="sortable" data-sort="penaltyMinutes">Штр</th>
            </tr>
          </thead>

          <tbody>
            ${skaters.map(player => `
              <tr
                class="clickable-row"
                data-player-id="${escapeHtml(player.playerId || player.id || "")}"
              >
                <td>
                  ${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Игрок")}
                </td>
                <td class="num">${val(player.gamesPlayed)}</td>
                <td class="num">${val(player.goals)}</td>
                <td class="num">${val(player.assists)}</td>
                <td class="num">${val(player.points)}</td>
                <td class="num">${val(player.plusMinus)}</td>
                <td class="num">${val(player.penaltyMinutes ?? player.pim)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  html += '<div class="section-title">Вратари</div>';

  if (!goalies.length) {
    html += '<div class="empty">Нет данных вратарей</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th>И</th>
              <th>В</th>
              <th>П</th>
              <th>%ОБ</th>
              <th>ГКИ</th>
            </tr>
          </thead>

          <tbody>
            ${goalies.map(player => {
              const savePct = player.savePercentage ?? player.savePctg;
              const gaa = player.goalsAgainstAverage ?? player.gaa;

              return `
                <tr
                  class="clickable-row"
                  data-player-id="${escapeHtml(player.playerId || player.id || "")}"
                >
                  <td>
                    ${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Вратарь")}
                  </td>
                  <td class="num">${val(player.gamesPlayed)}</td>
                  <td class="num">${val(player.wins)}</td>
                  <td class="num">${val(player.losses)}</td>
                  <td class="num">
                    ${typeof savePct === "number" ? savePct.toFixed(3) : val(savePct)}
                  </td>
                  <td class="num">
                    ${typeof gaa === "number" ? gaa.toFixed(2) : val(gaa)}
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;

  container.querySelectorAll(".clickable-row").forEach(row => {
    row.addEventListener("click", () => {
      if (row.dataset.playerId) {
        openPlayerDetail(row.dataset.playerId);
      }
    });
  });

  container.querySelectorAll("th.sortable").forEach(header => {
    header.onclick = () => {
      const key = header.dataset.sort;

      if (currentTeamSortKey === key) {
        currentTeamSortAsc = !currentTeamSortAsc;
      } else {
        currentTeamSortKey = key;
        currentTeamSortAsc = false;
      }

      buildTeamTablesBlock();
    };
  });
}

const TEAM_STAT_LABELS = {
  sog:"Броски в створ",
  shotsOnGoal:"Броски в створ",
  faceoffWinningPctg:"Вбрасывания, %",
  faceoffWins:"Выигранные вбрасывания",
  powerPlay:"Большинство",
  powerPlayPctg:"Большинство, %",
  pim:"Штраф (мин)",
  penaltyMinutes:"Штраф (мин)",
  hits:"Силовые приёмы",
  blockedShots:"Заблокировано бросков",
  giveaways:"Потери шайбы",
  takeaways:"Отборы шайбы"
};

function formatPeriodsBreakdown(periods) {
  if (!Array.isArray(periods) || !periods.length) return "";
  return `(${periods.map(value => val(value, "0")).join(" / ")})`;
}

function renderTeamGameStats(
  rightRail,
  awayAbbrev,
  homeAbbrev,
  awayLogo,
  homeLogo
) {
  const stats = rightRail?.teamGameStats || [];
  let html = '<div class="section-title">Статистика команд</div>';

  if (!stats.length) {
    return html + '<div class="empty">Статистика недоступна</div>';
  }

  html += `
    <div class="teamstat-head">
      <div class="side">
        <img class="team-logo" src="${escapeHtml(awayLogo)}" alt="">
        <span>${escapeHtml(awayAbbrev)}</span>
      </div>
      <div></div>
      <div class="side right">
        <span>${escapeHtml(homeAbbrev)}</span>
        <img class="team-logo" src="${escapeHtml(homeLogo)}" alt="">
      </div>
    </div>
  `;

  stats.forEach(stat => {
    const category = stat.category;
    const label = TEAM_STAT_LABELS[category] || category;

    let awayValue = stat.awayValue;
    let homeValue = stat.homeValue;

    if (
      typeof awayValue === "number" &&
      (category === "faceoffWinningPctg" ||
       category === "powerPlayPctg")
    ) {
      awayValue = `${(awayValue * 100).toFixed(1)}%`;
      homeValue = `${(homeValue * 100).toFixed(1)}%`;
    }

    const awayPeriods = formatPeriodsBreakdown(
      stat.awayPeriods || stat.away?.periods
    );

    const homePeriods = formatPeriodsBreakdown(
      stat.homePeriods || stat.home?.periods
    );

    html += `
      <div class="teamstat-row">
        <div class="val away">
          ${escapeHtml(val(awayValue))}
          ${awayPeriods ? `<span class="periods">${escapeHtml(awayPeriods)}</span>` : ""}
        </div>

        <div class="label">${escapeHtml(label)}</div>

        <div class="val home">
          ${escapeHtml(val(homeValue))}
          ${homePeriods ? `<span class="periods">${escapeHtml(homePeriods)}</span>` : ""}
        </div>
      </div>
    `;
  });

  return html;
}

async function openGameDetail(
  gameId,
  awayAbbrev,
  homeAbbrev,
  awayLogo,
  homeLogo
) {
  openDetail();

  const body = document.getElementById("detail-body");

  let html = `
    <div class="detail-head-game">
      <img class="team-logo" src="${escapeHtml(awayLogo)}" alt="">
      <div>
        <div class="title">
          ${escapeHtml(awayAbbrev)} — ${escapeHtml(homeAbbrev)}
        </div>
        <div class="subtitle">Статистика матча</div>
      </div>
      <img class="team-logo" src="${escapeHtml(homeLogo)}" alt="">
    </div>
  `;

  try {
    const [scoreResponse, railResponse, boxResponse] =
      await Promise.all([
        fetch(`${API_BASE}/api/score/${encodeURIComponent(gameId)}`),
        fetch(`${API_BASE}/api/right-rail/${encodeURIComponent(gameId)}`),
        fetch(`${API_BASE}/api/boxscore/${encodeURIComponent(gameId)}`)
      ]);

    const score = await scoreResponse.json();
    const rail = await railResponse.json();
    const box = await boxResponse.json();

    html += '<div class="section-title">Голы</div>';

    const scoring = score?.summary?.scoring || [];
    let hasGoals = false;

    scoring.forEach(period => {
      const goals = period.goals || [];
      if (!goals.length) return;

      hasGoals = true;

      html += `
        <div class="period-label">
          ${escapeHtml(formatPeriodLabel(period.periodDescriptor))}
        </div>
      `;

      goals.forEach(goal => {
        const scorer =
          `${nameStr(goal.firstName)} ${nameStr(goal.lastName)}`
            .trim();

        const assists = Array.isArray(goal.assists)
          ? goal.assists
              .map(item =>
                `${nameStr(item.firstName)} ${nameStr(item.lastName)}`
              )
              .join(", ")
          : "";

        html += `
          <div class="goal-row">
            <div class="time">${escapeHtml(val(goal.timeInPeriod))}</div>

            <div class="desc">
              <div class="scorer">
                ${escapeHtml(scorer)}
                (${escapeHtml(goal.teamAbbrev?.default || goal.teamAbbrev || "")})
              </div>

              ${assists
                ? `<div class="assists">Передачи: ${escapeHtml(assists)}</div>`
                : ""}
            </div>

            <div class="scoreline">
              ${escapeHtml(val(goal.awayScore))} :
              ${escapeHtml(val(goal.homeScore))}
            </div>
          </div>
        `;
      });
    });

    if (!hasGoals) {
      html += '<div class="empty">Голов пока не было</div>';
    }

    html += renderTeamGameStats(
      rail,
      awayAbbrev,
      homeAbbrev,
      awayLogo,
      homeLogo
    );

    html += '<div class="section-title">Вратари</div>';

    const goalies = [
      ...(box?.playerByGameStats?.awayTeam?.goalies || []),
      ...(box?.playerByGameStats?.homeTeam?.goalies || [])
    ];

    if (!goalies.length) {
      html += '<div class="empty">Нет данных о вратарях</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Вратарь</th>
                <th>Броски</th>
                <th>%ОБ</th>
                <th>Время</th>
                <th>ГКИ</th>
              </tr>
            </thead>

            <tbody>
              ${goalies.map(goalie => `
                <tr>
                  <td>
                    ${escapeHtml(
                      goalie.name?.default ||
                      goalie.playerName?.default ||
                      `${nameStr(goalie.firstName)} ${nameStr(goalie.lastName)}`.trim() ||
                      "Вратарь"
                    )}
                  </td>
                  <td class="num">${escapeHtml(val(goalie.saveShotsAgainst))}</td>
                  <td class="num">
                    ${typeof goalie.savePctg === "number"
                      ? goalie.savePctg.toFixed(3)
                      : escapeHtml(val(goalie.savePctg))}
                  </td>
                  <td class="num">${escapeHtml(val(goalie.toi))}</td>
                  <td class="num">
                    ${typeof goalie.goalsAgainstAverage === "number"
                      ? goalie.goalsAgainstAverage.toFixed(2)
                      : "—"}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
  } catch (error) {
    console.error(error);
    html += '<div class="empty">Не удалось загрузить подробности матча</div>';
  }

  body.innerHTML = html;
}

                <td class="num">${escapeHtml(val(currentStats.points))}</td>
                <td class="num">${escapeHtml(val(currentStats.plusMinus))}</td>
                <td class="num">${escapeHtml(val(currentStats.pim ?? currentStats.penaltyMinutes))}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    html += '<div class="section-title">История карьеры в NHL</div>';

    const history = Array.isArray(player.seasonTotals)
      ? player.seasonTotals.filter(item => item.leagueAbbrev === "NHL")
      : [];

    if (!history.length) {
      html += '<div class="empty">История выступлений в NHL отсутствует</div>';
    } else {
      const regular = history.filter(item =>
        item.gameTypeId === 2 ||
        item.gameTypeCode === 2
      );

      const playoffs = history.filter(item =>
        item.gameTypeId === 3 ||
        item.gameTypeCode === 3
      );

      const columns = position === "G" ? 7 : 8;

      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Сезон</th>
                <th>Клуб</th>
                <th>И</th>
      `;

      if (position === "G") {
        html += `
                <th>В</th>
                <th>П</th>
                <th>%ОБ</th>
                <th>ГКИ</th>
        `;
      } else {
        html += `
                <th>Г</th>
                <th>П</th>
                <th>О</th>
                <th>+/-</th>
                <th>Штр</th>
        `;
      }

      html += `
              </tr>
            </thead>
            <tbody>
      `;

      if (regular.length) {
        html += `
          <tr class="playoff-header-row">
            <td colspan="${columns}">Регулярный сезон</td>
          </tr>
        `;

        regular.forEach(item => {
          html += renderCareerRow(item, position);
        });
      }

      if (playoffs.length) {
        html += `
          <tr class="playoff-header-row playoff-border">
            <td colspan="${columns}">Плей-офф</td>
          </tr>
        `;

        playoffs.forEach(item => {
          html += renderCareerRow(item, position);
        });
      }

      html += `
            </tbody>
          </table>
        </div>
      `;
    }

    body.innerHTML = html;
  } catch (error) {
    console.error(error);
    body.innerHTML =
      '<div class="empty">Не удалось загрузить карточку игрока</div>';
  }
}

function renderCareerRow(season, position) {
  const seasonName = String(season.season)
    .replace(/^(\d{4})(\d{4})$/, "$1-$2");

  const teamName =
    season.teamName?.default ||
    season.teamAbbrev ||
    "—";

  let html = `
    <tr>
      <td>${escapeHtml(seasonName)}</td>
      <td>${escapeHtml(teamName)}</td>
      <td class="num">${escapeHtml(val(season.gamesPlayed))}</td>
  `;

  if (position === "G") {
    const savePct = season.savePctg ?? season.savePercentage;
    const gaa = season.goalsAgainstAverage ?? season.gaa;

    html += `
      <td class="num">${escapeHtml(val(season.wins))}</td>
      <td class="num">${escapeHtml(val(season.losses))}</td>
      <td class="num">
        ${typeof savePct === "number"
          ? savePct.toFixed(3)
          : escapeHtml(val(savePct))}
      </td>
      <td class="num">
        ${typeof gaa === "number"
          ? gaa.toFixed(2)
          : escapeHtml(val(gaa))}
      </td>
    `;
  } else {
    html += `
      <td class="num">${escapeHtml(val(season.goals))}</td>
      <td class="num">${escapeHtml(val(season.assists))}</td>
      <td class="num">${escapeHtml(val(season.points))}</td>
      <td class="num">${escapeHtml(val(season.plusMinus))}</td>
      <td class="num">${escapeHtml(val(season.pim ?? season.penaltyMinutes))}</td>
    `;
  }

  return `${html}</tr>`;
}

buildSeasonOptions();
loadSchedule();
</script>
