<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NHL Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --surface: #161616;
    --surface-2: #232323;
    --silver: #E6E9EA;
    --silver-dim: #9CA3AA;
    --blue: #1F5FCE;
    --red: #C8102E;
    --border: #2C2C2C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--silver);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }

  header {
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--blue);
    background: linear-gradient(180deg, #141414 0%, var(--bg) 100%);
  }

  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--silver);
  }

  header h1 .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  header .sub { color: var(--silver-dim); font-size: 12px; }

  nav {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  nav button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 10px 8px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  nav button.active {
    color: #fff;
    background: var(--blue);
    border-color: var(--blue);
    font-weight: 700;
  }

  main { padding: 14px 16px 0; }

  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0 14px;
  }

  .date-row .label { font-family: 'Roboto Mono', monospace; font-size: 13px; color: var(--silver-dim); }

  .date-row button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }

  .game-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }

  .team { display: flex; align-items: center; gap: 10px; }
  .team.right { justify-content: flex-end; text-align: right; }
  .team .abbr { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }

  .team-logo { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }

  .score-box { text-align: center; min-width: 70px; border-radius: 10px; padding: 4px 6px; }
  .score-box.clickable { cursor: pointer; transition: background 0.15s; }
  .score-box.clickable:active { background: var(--surface-2); }

  .score-box .score { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 22px; color: var(--silver); }
  .score-box .status { font-size: 10px; color: var(--red); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  .standings-head {
    display: grid;
    grid-template-columns: 24px 24px 1fr 28px 28px 28px 28px 32px 32px 32px 40px;
    gap: 4px;
    font-size: 10px;
    color: var(--silver-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }

  .standings-head .sortable { cursor: pointer; text-decoration: underline dotted; color: var(--silver); transition: color 0.15s; }
  .standings-head .sortable:hover { color: #fff; }

  .standings-head .num, .standings-head .pts, .standings-head .diff { text-align: center; }

  .standings-row {
    display: grid;
    grid-template-columns: 24px 24px 1fr 28px 28px 28px 28px 32px 32px 32px 40px;
    gap: 4px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
  }

  .standings-row:active { background: var(--surface-2); }
  .standings-row:last-child { border-bottom: none; }

  .standings-row .rank { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); }
  .standings-row .team-logo { width: 20px; height: 20px; }
  .standings-row .name { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.02em; }
  .standings-row .num { font-family: 'Roboto Mono', monospace; text-align: center; color: var(--silver-dim); }
  .standings-row .diff { font-family: 'Roboto Mono', monospace; text-align: center; font-size: 12px; font-weight: 600; }
  .standings-row .pts { font-family: 'Roboto Mono', monospace; font-weight: 700; text-align: center; color: var(--blue); }

  .cat-row { display: flex; gap: 6px; margin-bottom: 12px; }

  .cat-row button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 8px 6px;
    border-radius: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cat-row button.active { color: #fff; background: var(--red); border-color: var(--red); font-weight: 700; }

  .player-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .player-row:active { background: var(--surface-2); }
  .player-row:last-child { border-bottom: none; }

  .player-row .rank { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); width: 20px; flex-shrink: 0; text-align: center; }
  .player-row .headshot { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--border); }
  .player-row .info { flex: 1; min-width: 0; }
  .player-row .pname { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-row .pteam { font-size: 11px; color: var(--silver-dim); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .player-row .pteam .team-logo { width: 16px; height: 16px; }
  .player-row .pvalue { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 20px; color: var(--blue); flex-shrink: 0; }

  .show-more {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--silver-dim);
    padding: 10px; border-radius: 10px; font-family: 'Oswald', sans-serif; font-size: 12px;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; margin-top: 10px;
  }

  .empty, .loading { text-align: center; color: var(--silver-dim); font-size: 13px; padding: 30px 0; }
  .loading { font-family: 'Roboto Mono', monospace; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
    color: var(--silver); padding: 8px 14px; border-radius: 10px; font-family: 'Oswald', sans-serif;
    font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; margin-bottom: 12px;
  }

  .detail-head-game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-bottom: 14px; }
  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .detail-head img.team-logo, .detail-head-game img.team-logo { width: 48px; height: 48px; object-fit: contain; }
  .detail-head img.headshot { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface-2); border: 1px solid var(--border); }
  
  .detail-head .title, .detail-head-game .title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.03em; text-transform: uppercase; text-align: center; }
  .detail-head .subtitle, .detail-head-game .subtitle { font-size: 12px; color: var(--silver-dim); margin-top: 2px; text-align: center; }

  .section-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--silver-dim); margin: 16px 0 8px; }

  .bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; }
  .bio-grid .label { color: var(--silver-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .bio-grid .value { font-family: 'Oswald', sans-serif; font-weight: 600; }

  .stat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stat-table th, .stat-table td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  
  .stat-table th { color: var(--silver-dim); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  .stat-table th.sortable { cursor: pointer; text-decoration: underline dotted; color: var(--silver); }
  .stat-table td:first-child, .stat-table th:first-child { text-align: left; font-family: 'Oswald', sans-serif; font-weight: 600; }

  .stat-table tbody tr.clickable-row { cursor: pointer; }
  .stat-table tbody tr.clickable-row:active { background: var(--surface-2); }
  .stat-table tbody tr.playoff-header-row td { background: var(--surface-2); color: var(--silver); font-family: 'Oswald', sans-serif; font-weight: 700; text-align: left; padding: 6px 8px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .stat-table tbody tr.playoff-border { border-bottom: 3px solid var(--blue); }

  .stat-table .num { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); }
  .table-scroll { overflow-x: auto; }

  .goal-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .goal-row:last-child { border-bottom: none; }
  .goal-row .time { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); font-size: 12px; flex-shrink: 0; width: 46px; }
  .goal-row .desc { flex: 1; }
  .goal-row .scorer { font-family: 'Oswald', sans-serif; font-weight: 600; }
  .goal-row .assists { color: var(--silver-dim); font-size: 11px; margin-top: 2px; }
  .goal-row .scoreline { font-family: 'Roboto Mono', monospace; font-weight: 700; color: var(--blue); flex-shrink: 0; }

  .period-label { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); font-size: 11px; text-transform: uppercase; margin: 10px 0 4px; }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>NHL LIVE</h1>
  <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
</header>

<nav id="main-nav">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Игроки</button>
</nav>

<main>
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <div class="label" id="date-label">—</div>
      <button id="next-day">›</button>
    </div>
    <div id="games"><div class="loading">Загрузка...</div></div>
  </div>

  <div id="view-standings" style="display:none">
    <div class="card">
      <div class="standings-head">
        <div></div><div></div><div>Команда</div>
        <div class="num sortable" data-sort="gamesPlayed">И</div>
        <div class="num sortable" data-sort="wins">В</div>
        <div class="num sortable" data-sort="otLosses">ОТ</div>
        <div class="num sortable" data-sort="losses">П</div>
        <div class="num sortable" data-sort="goalFor">ЗШ</div>
        <div class="num sortable" data-sort="goalAgainst">ПШ</div>
        <div class="diff sortable" data-sort="goalDifferential">+/-</div>
        <div class="pts sortable" data-sort="points">Очки</div>
      </div>
      <div id="standings-body"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div id="view-players" style="display:none">
    <div class="cat-row">
      <button data-cat="points" class="active">Очки</button>
      <button data-cat="goals">Голы</button>
      <button data-cat="assists">Передачи</button>
      <button data-cat="plusMinus">+/-</button>
    </div>
    <div class="card">
      <div id="players-body"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div id="view-detail" style="display:none">
    <button class="back-btn" id="back-btn">‹ Назад</button>
    <div id="detail-body"><div class="loading">Загрузка...</div></div>
  </div>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const API_BASE = "";

  let currentTeamFullData = null; 
  let currentTeamType = "regular"; 
  let currentTeamSortKey = "points"; 
  let currentTeamSortAsc = false;
  
  let currentStandingsData = [];
  let standingsSortKey = "points";
  let standingsSortAsc = false;

  let lastMainTab = "schedule";
  let currentDate = new Date();
  let currentCat = "points";
  let currentLimit = 25;

  // Словарь для перевода нарушений
  const penaltyTranslations = {
    "tripping": "Подножка",
    "hooking": "Задержка клюшкой",
    "slashing": "Удар клюшкой",
    "interference": "Блокировка",
    "holding": "Задержка руками",
    "high-sticking": "Опасная игра высоко поднятой клюшкой",
    "roughing": "Грубость",
    "cross-checking": "Толчок клюшкой",
    "boarding": "Толчок на борт",
    "delaying-game-puck-over-glass": "Задержка (выброс шайбы)",
    "fighting": "Драка",
    "unsportsmanlike-conduct": "Неспортивное поведение",
    "too-many-men-on-ice": "Нарушение численного состава"
  };

  // Инициализация сортировки таблицы
  document.querySelectorAll(".standings-head .sortable").forEach(th => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if (standingsSortKey === key) {
        standingsSortAsc = !standingsSortAsc;
      } else {
        standingsSortKey = key;
        standingsSortAsc = false;
      }
      renderStandings();
    };
  });

  function openDetail() {
    document.getElementById("view-schedule").style.display = "none";
    document.getElementById("view-standings").style.display = "none";
    document.getElementById("view-players").style.display = "none";
    document.getElementById("view-detail").style.display = "";
    document.getElementById("main-nav").style.display = "none";
    document.getElementById("detail-body").innerHTML = '<div class="loading">Загрузка...</div>';
    window.scrollTo(0, 0);
  }

  function nameStr(n) {
    if (!n) return "";
    if (typeof n === "string") return n;
    return n.default || "";
  }

  function val(v, fallback = "—") {
    return (v === undefined || v === null || v === "") ? fallback : v;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // --- Поиск имени в Boxscore ---
  function findNameInBoxscore(box, playerId) {
    if (!playerId || !box) return "";
    const targetId = String(playerId);
    const statsContainer = box.playerByGameStats || box.boxscore?.playerByGameStats;
    if (!statsContainer) return "";

    const teams = ['awayTeam', 'homeTeam'];
    const positions = ['forwards', 'defense', 'goalies'];
    
    for (const t of teams) {
      const teamData = statsContainer[t];
      if (!teamData) continue;
      for (const pos of positions) {
        const list = teamData[pos];
        if (!list || !Array.isArray(list)) continue;
        const found = list.find(p => String(p.playerId) === targetId || String(p.id) === targetId);
        if (found) {
          if (found.name?.default) return found.name.default;
          if (found.playerName?.default) return found.playerName.default;
          return `${nameStr(found.firstName)} ${nameStr(found.lastName)}`.trim();
        }
      }
    }
    return "";
  }

  function switchTab(tab) {
    document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
    document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
    document.getElementById("tab-players").classList.toggle("active", tab === "players");

    document.getElementById("view-schedule").style.display = tab === "schedule" ? "" : "none";
    document.getElementById("view-standings").style.display = tab === "standings" ? "" : "none";
    document.getElementById("view-players").style.display = tab === "players" ? "" : "none";
    document.getElementById("view-detail").style.display = "none";
    document.getElementById("main-nav").style.display = "flex";

    lastMainTab = tab;
    if (tab === "standings") loadStandings();
    if (tab === "players") loadPlayers();
  }

  document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);
  document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
  document.getElementById("tab-standings").onclick = () => switchTab("standings");
  document.getElementById("tab-players").onclick = () => switchTab("players");

  // ----- РАЗДЕЛ МАТЧЕЙ -----
  function fmtDate(d) { return d.toISOString().slice(0, 10); }
  function fmtLabel(d) { return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short", weekday: "short" }); }

  async function loadSchedule() {
    const games = document.getElementById("games");
    games.innerHTML = '<div class="loading">Загрузка...</div>';
    document.getElementById("date-label").textContent = fmtLabel(currentDate);

    try {
      const res = await fetch(`${API_BASE}/api/schedule?date=${fmtDate(currentDate)}`);
      const data = await res.json();
      const week = data.gameWeek || [];
      const day = week.find(d => d.date === fmtDate(currentDate));
      const list = day?.games || [];

      if (list.length === 0) {
        games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
        return;
      }
      games.innerHTML = list.map(renderGame).join("");

      games.querySelectorAll(".score-box.clickable").forEach(el => {
        el.addEventListener("click", () => openGameDetail(
          el.dataset.gameId, el.dataset.away, el.dataset.home, el.dataset.awayLogo, el.dataset.homeLogo
        ));
      });
    } catch (e) {
      games.innerHTML = '<div class="empty">Не удалось загрузить матчи</div>';
    }
  }

  function renderGame(g) {
    const away = g.awayTeam;
    const home = g.homeTeam;
    const state = g.gameState; 

    let status = "—";
    let awayScore = "";
    let homeScore = "";
    const started = !(state === "FUT" || state === "PRE");

    if (!started) {
      status = new Date(g.startTimeUTC).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    } else {
      status = (state === "LIVE" || state === "CRIT") ? "LIVE" : "Финал";
      awayScore = away.score ?? 0;
      homeScore = home.score ?? 0;
    }

    const scoreClass = started ? "score-box clickable" : "score-box";
    const dataAttrs = started ? `data-game-id="${g.id}" data-away="${away.abbrev}" data-home="${home.abbrev}" data-away-logo="${away.logo ?? ""}" data-home-logo="${home.logo ?? ""}"` : "";

    return `
      <div class="card">
        <div class="game-row">
          <div class="team">
            <img class="team-logo" src="${away.logo}" alt="" onerror="this.style.display='none'">
            <div class="abbr">${away.abbrev}</div>
          </div>
          <div class="${scoreClass}" ${dataAttrs}>
            <div class="score">${awayScore !== "" ? awayScore + " : " + homeScore : "vs"}</div>
            <div class="status">${status}</div>
          </div>
          <div class="team right">
            <div class="abbr">${home.abbrev}</div>
            <img class="team-logo" src="${home.logo}" alt="" onerror="this.style.display='none'">
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById("prev-day").onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadSchedule(); };
  document.getElementById("next-day").onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadSchedule(); };

  // ----- ТУРНИРНАЯ ТАБЛИЦА (С сортировкой) -----
  async function loadStandings() {
    const body = document.getElementById("standings-body");
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/standings`);
      const data = await res.json();
      currentStandingsData = data.standings || [];
      renderStandings();
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить таблицу</div>';
    }
  }

  function renderStandings() {
    const body = document.getElementById("standings-body");
    if (!currentStandingsData.length) {
       body.innerHTML = '<div class="empty">Нет данных</div>';
       return;
    }

    let arr = [...currentStandingsData];
    arr.sort((a, b) => {
      let valA = a[standingsSortKey] ?? 0;
      let valB = b[standingsSortKey] ?? 0;

      if (standingsSortKey === 'goalDifferential') {
          valA = a.goalDifferential ?? ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));
          valB = b.goalDifferential ?? ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
      }

      return standingsSortAsc ? valA - valB : valB - valA;
    });

    body.innerHTML = arr.map((t, i) => {
      const gf = t.goalFor ?? 0;
      const ga = t.goalAgainst ?? 0;
      const diff = t.goalDifferential ?? (gf - ga);
      const formattedDiff = diff > 0 ? `+${diff}` : diff;
      const tName = t.teamName?.default || t.teamAbbrev?.default || t.teamAbbrev || "";

      return `
        <div class="standings-row" data-team="${t.teamAbbrev?.default || t.teamAbbrev || ""}" data-name="${escapeHtml(tName)}" data-logo="${t.teamLogo || ""}">
          <div class="rank">${i + 1}</div>
          <img class="team-logo" src="${t.teamLogo}" alt="" onerror="this.style.visibility='hidden'">
          <div class="name">${t.teamAbbrev?.default || t.teamAbbrev || ""}</div>
          <div class="num">${t.gamesPlayed ?? 0}</div>
          <div class="num">${t.wins ?? 0}</div>
          <div class="num">${t.otLosses ?? 0}</div>
          <div class="num">${t.losses ?? 0}</div>
          <div class="num">${gf}</div>
          <div class="num">${ga}</div>
          <div class="diff" style="color: ${diff >= 0 ? '#2ecc71' : '#e74c3c'}">${formattedDiff}</div>
          <div class="pts">${t.points ?? 0}</div>
        </div>
      `;
    }).join("");

    body.querySelectorAll(".standings-row").forEach(el => {
      el.addEventListener("click", () => openTeamDetail(el.dataset.team, el.dataset.name, el.dataset.logo));
    });
  }

  // ----- ЛИДЕРЫ ЛИГИ -----
  async function loadPlayers() {
    const body = document.getElementById("players-body");
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/leaders/${currentCat}?limit=${currentLimit}`);
      const data = await res.json();
      const list = data[currentCat] || [];

      if (list.length === 0) {
        body.innerHTML = '<div class="empty">Нет данных игроков</div>';
        return;
      }

      body.innerHTML = list.map((p, i) => `
        <div class="player-row" data-player-id="${p.id}">
          <div class="rank">${i + 1}</div>
          <img class="headshot" src="${p.headshot}" alt="" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="pname">${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</div>
            <div class="pteam">
              <img class="team-logo" src="${p.teamLogo}" alt="" onerror="this.style.display='none'">
              ${p.teamAbbrev || ""}
            </div>
          </div>
          <div class="pvalue">${p.value ?? ""}</div>
        </div>
      `).join("");

      if (list.length >= currentLimit && currentLimit < 50) {
        body.insertAdjacentHTML("beforeend", '<button class="show-more" id="show-more-players">Показать больше</button>');
        document.getElementById("show-more-players").onclick = () => { currentLimit = 50; loadPlayers(); };
      }

      body.querySelectorAll(".player-row").forEach(el => {
        el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
      });
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить лидеров</div>';
    }
  }

  document.querySelectorAll(".cat-row button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".cat-row button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      currentLimit = 25;
      loadPlayers();
    };
  });

  // ----- ДЕТАЛИ КЛУБА -----
  async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
    openDetail();
    try {
      const res = await fetch(`${API_BASE}/api/roster-stats/${teamAbbrev}`);
      currentTeamFullData = await res.json();

      currentTeamType = "regular"; 
      currentTeamSortKey = "points";
      currentTeamSortAsc = false;

      renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo);
    } catch (e) {
      document.getElementById("detail-body").innerHTML = '<div class="empty">Не удалось загрузить состав команды</div>';
    }
  }

  function renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo) {
    const body = document.getElementById("detail-body");
    body.innerHTML = `
      <div class="detail-head">
        <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="title">${escapeHtml(teamName || teamAbbrev)}</div>
          <div class="subtitle">${teamAbbrev}</div>
        </div>
      </div>
      <div class="cat-row" style="margin-top: 14px;">
        <button id="btn-team-reg" class="active">Регулярный сезон</button>
        <button id="btn-team-po">Плей-офф</button>
      </div>
      <div id="team-tables-container"></div>
    `;

    document.getElementById("btn-team-reg").onclick = () => {
      currentTeamType = "regular";
      document.getElementById("btn-team-reg").classList.add("active");
      document.getElementById("btn-team-po").classList.remove("active");
      buildTeamTablesBlock();
    };

    document.getElementById("btn-team-po").onclick = () => {
      currentTeamType = "playoff";
      document.getElementById("btn-team-po").classList.add("active");
      document.getElementById("btn-team-reg").classList.remove("active");
      buildTeamTablesBlock();
    };

    buildTeamTablesBlock();
  }

  function buildTeamTablesBlock() {
    const container = document.getElementById("team-tables-container");
    if (!currentTeamFullData || !currentTeamFullData[currentTeamType]) {
      container.innerHTML = '<div class="empty">Данные отсутствуют</div>';
      return;
    }

    const dataset = currentTeamFullData[currentTeamType];
    let filteredSkaters = [...(dataset.skaters || [])];
    let filteredGoalies = [...(dataset.goalies || [])];

    filteredSkaters.sort((a, b) => {
      let valA = a[currentTeamSortKey] ?? (currentTeamSortKey === "penaltyMinutes" ? a.penaltyMinutes : 0) ?? 0;
      let valB = b[currentTeamSortKey] ?? (currentTeamSortKey === "penaltyMinutes" ? b.penaltyMinutes : 0) ?? 0;
      return currentTeamSortAsc ? valA - valB : valB - valA;
    });

    filteredGoalies.sort((a, b) => (b.gamesPlayed ?? 0) - (a.gamesPlayed ?? 0));

    let html = '<div class="section-title">Полевые игроки</div>';
    if (filteredSkaters.length === 0) {
      html += '<div class="empty">Нет данных полевых игроков</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Игрок</th>
                <th class="sortable" data-sort="gamesPlayed">И</th>
                <th class="sortable" data-sort="goals">Г</th>
                <th class="sortable" data-sort="assists">П</th>
                <th class="sortable" data-sort="points">О</th>
                <th class="sortable" data-sort="plusMinus">+/-</th>
                <th class="sortable" data-sort="penaltyMinutes">Штр</th>
              </tr>
            </thead>
            <tbody>
      `;
      html += filteredSkaters.map(p => {
        const pMinutes = p.penaltyMinutes ?? p.pim ?? 0;
        return `
          <tr class="clickable-row" data-player-id="${p.playerId}">
            <td>${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</td>
            <td class="num">${val(p.gamesPlayed)}</td>
            <td class="num">${val(p.goals)}</td>
            <td class="num">${val(p.assists)}</td>
            <td class="num">${val(p.points)}</td>
            <td class="num">${val(p.plusMinus)}</td>
            <td class="num">${val(pMinutes)}</td>
          </tr>
        `;
      }).join("");
      html += "</tbody></table></div>";
    }

    html += '<div class="section-title">Вратари</div>';
    if (filteredGoalies.length === 0) {
      html += '<div class="empty">Нет данных вратарей</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Игрок</th><th>И</th><th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>
              </tr>
            </thead>
            <tbody>
      `;
      html += filteredGoalies.map(p => {
        const svPct = p.savePercentage ?? p.savePctg;
        const gaa = p.goalsAgainstAverage ?? p.gaa;
        return `
          <tr class="clickable-row" data-player-id="${p.playerId}">
            <td>${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</td>
            <td class="num">${val(p.gamesPlayed)}</td>
            <td class="num">${val(p.wins)}</td>
            <td class="num">${val(p.losses)}</td>
            <td class="num">${typeof svPct === 'number' ? svPct.toFixed(3) : val(svPct)}</td>
            <td class="num">${typeof gaa === 'number' ? gaa.toFixed(2) : val(gaa)}</td>
          </tr>
        `;
      }).join("");
      html += "</tbody></table></div>";
    }

    container.innerHTML = html;

    container.querySelectorAll("tr.clickable-row").forEach(el => {
      el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
    });

    container.querySelectorAll("th.sortable").forEach(th => {
      th.onclick = () => {
        const key = th.dataset.sort;
        if (currentTeamSortKey === key) {
          currentTeamSortAsc = !currentTeamSortAsc;
        } else {
          currentTeamSortKey = key;
          currentTeamSortAsc = false;
        }
        buildTeamTablesBlock();
      };
    });
  }

  // ----- ДЕТАЛИ МАТЧА -----
  async function openGameDetail(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
    openDetail();
    const body = document.getElementById("detail-body");

    let html = `
      <div class="detail-head-game">
        <img class="team-logo" src="${awayLogo}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="title">${awayAbbrev} — ${homeAbbrev}</div>
          <div class="subtitle">Статистика матча</div>
        </div>
        <img class="team-logo" src="${homeLogo}" alt="" onerror="this.style.visibility='hidden'">
      </div>
    `;

    try {
      const [landingRes, boxRes] = await Promise.all([
        fetch(`${API_BASE}/api/score/${gameId}`),
        fetch(`${API_BASE}/api/boxscore/${gameId}`),
      ]);
      const landing = await landingRes.json();
      const box = await boxRes.json();

      const scoring = landing?.summary?.scoring || [];
      html += '<div class="section-title">Голы</div>';

      let anyGoals = false;
      scoring.forEach(period => {
        const goals = period.goals || [];
        if (goals.length === 0) return;
        anyGoals = true;
        const periodNum = period.periodDescriptor?.number;
        html += `<div class="period-label">${periodNum ? periodNum + "-й период" : "Период"}</div>`;
        goals.forEach(goal => {
          const scorerName = `${nameStr(goal.firstName)} ${nameStr(goal.lastName)}`;
          const assistsArr = [];
          if (goal.assists && Array.isArray(goal.assists)) {
            goal.assists.forEach(ast => { assistsArr.push(`${nameStr(ast.firstName)} ${nameStr(ast.lastName)}`); });
          }
          const assists = assistsArr.join(", ");

          html += `
            <div class="goal-row">
              <div class="time">${val(goal.timeInPeriod)}</div>
              <div class="desc">
                <div class="scorer">${escapeHtml(scorerName)} (${escapeHtml(goal.teamAbbrev?.default || goal.teamAbbrev || "")})</div>
                ${assists ? `<div class="assists">Передачи: ${escapeHtml(assists)}</div>` : ""}
              </div>
              <div class="scoreline">${val(goal.awayScore)} : ${val(goal.homeScore)}</div>
            </div>
          `;
        });
      });
      if (!anyGoals) html += '<div class="empty">Голов пока не было</div>';

      // --- ИСПРАВЛЕНИЕ: Вывод имени игрока в штрафах ---
      const penalties = landing?.summary?.penalties || [];
      html += '<div class="section-title">Штрафы</div>';

      let anyPenalties = false;
      penalties.forEach(period => {
        const list = period.penalties || [];
        if (list.length === 0) return;
        anyPenalties = true;
        const periodNum = period.periodDescriptor?.number;
        html += `<div class="period-label">${periodNum ? periodNum + "-й период" : "Период"}</div>`;
        
        list.forEach(pen => {
          let violatorName = "";
          
          // 1. Попытка взять готовое строковое имя, которое API иногда отдает напрямую
          if (typeof pen.committedByPlayer === 'string') {
            violatorName = pen.committedByPlayer;
          }
          // 2. Если его нет, ищем по ID в боксскоре
          if (!violatorName && pen.committedByPlayerId) {
            violatorName = findNameInBoxscore(box, pen.committedByPlayerId);
          }
          // 3. Последний шанс: склейка firstName и lastName
          if (!violatorName) {
            const fn = nameStr(pen.firstName);
            const ln = nameStr(pen.lastName);
            if (fn || ln) violatorName = `${fn} ${ln}`.trim();
          }
          
          if (!violatorName) violatorName = "Игрок";
          
          const rawDesc = pen.descKey || pen.penaltyDescriptionDefault || "Штраф";
          const penDesc = penaltyTranslations[rawDesc] || rawDesc;
          
          html += `
            <div class="goal-row">
              <div class="time">${val(pen.timeInPeriod)}</div>
              <div class="desc">
                <div class="scorer">${escapeHtml(violatorName)} (${escapeHtml(pen.teamAbbrev?.default || pen.teamAbbrev || "")})</div>
                <div class="assists">${escapeHtml(penDesc)} — ${val(pen.duration)} мин</div>
              </div>
            </div>
          `;
        });
      });
      if (!anyPenalties) html += '<div class="empty">Штрафов не зафиксировано</div>';

      html += '<div class="section-title">Вратари</div>';
      const awayGoalies = box?.playerByGameStats?.awayTeam?.goalies || [];
      const homeGoalies = box?.playerByGameStats?.homeTeam?.goalies || [];
      const allGoalies = [...awayGoalies, ...homeGoalies];

      if (allGoalies.length === 0) {
        html += '<div class="empty">Нет данных о вратарях</div>';
      } else {
        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Вратарь</th><th>Броски</th><th>%ОБ</th><th>Время</th><th>ГКИ</th>
                </tr>
              </thead>
              <tbody>
        `;
        html += allGoalies.map(gk => {
          let gaa = "—";
          if (typeof gk.goalsAgainstAverage === 'number') {
            gaa = gk.goalsAgainstAverage.toFixed(2);
          } else if (gk.goalsAgainst !== undefined) {
            gaa = Number(gk.goalsAgainst).toFixed(2);
          }

          let gName = gk.name?.default || gk.playerName?.default || `${nameStr(gk.firstName)} ${nameStr(gk.lastName)}`.trim() || "Вратарь";

          return `
            <tr>
              <td>${escapeHtml(gName)}</td>
              <td class="num">${val(gk.saveShotsAgainst)}</td>
              <td class="num">${typeof gk.savePctg === 'number' ? gk.savePctg.toFixed(3) : val(gk.savePctg)}</td>
              <td class="num">${val(gk.toi)}</td>
              <td class="num">${gaa}</td>
            </tr>
          `;
        }).join("");
        html += "</tbody></table></div>";
      }
    } catch (e) {
      html += '<div class="empty">Не удалось загрузить подробности матча</div>';
    }

    body.innerHTML = html;
  }

  // ----- ДЕТАЛИ ИГРОКА И ЕГО КАРЬЕРА -----
  async function openPlayerDetail(playerId) {
    openDetail();
    const body = document.getElementById("detail-body");

    try {
      const res = await fetch(`${API_BASE}/api/player/${playerId}`);
      const p = await res.json();

      const name = `${nameStr(p.firstName)} ${nameStr(p.lastName)}`;
      const birthPlace = [nameStr(p.birthCity), p.birthCountry].filter(Boolean).join(", ");
      const pos = p.positionCode || p.position || "";

      // Формируем текст для драфта
      let draftText = "На драфте не выбран";
      if (p.draftDetails) {
        const d = p.draftDetails;
        draftText = `Выбран командой «${d.teamAbbrev || ""}» в ${d.year} году (раунд ${d.round}, общий номер ${d.overallPick})`;
      }

      let html = `
        <div class="detail-head">
          <img class="headshot" src="${p.headshot || ""}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="title">${escapeHtml(name)}</div>
            <div class="subtitle">${escapeHtml(p.teamAbbrev || "")} · №${val(p.sweaterNumber)} · ${escapeHtml(pos)}</div>
          </div>
          <img class="team-logo" src="${p.teamLogo || ""}" alt="" onerror="this.style.visibility='hidden'" style="margin-left:auto">
        </div>

        <div class="section-title">Личные данные</div>
        <div class="bio-grid">
          <div><div class="label">Дата рождения</div><div class="value">${val(p.birthDate)}</div></div>
          <div><div class="label">Место рождения</div><div class="value">${escapeHtml(birthPlace) || "—"}</div></div>
          <div><div class="label">Рост</div><div class="value">${p.heightInCentimeters ? p.heightInCentimeters + " см" : "—"}</div></div>
          <div><div class="label">Вес</div><div class="value">${p.weightInKilograms ? p.weightInKilograms + " кг" : "—"}</div></div>
          <div><div class="label">Хват</div><div class="value">${val(p.shootsCatches)}</div></div>
          <div style="grid-column: 1 / -1;"><div class="label">Драфт</div><div class="value">${escapeHtml(draftText)}</div></div>
        </div>
      `;

      const subSeason = p.featuredStats?.regularSeason?.subSeason;
      html += '<div class="section-title">Статистика в текущем сезоне</div>';

      if (!subSeason) {
        html += '<div class="empty">Статистика текущего сезона отсутствует</div>';
      } else if (pos === "G") {
        html += `
          <div class="table-scroll"><table class="stat-table"><thead><tr>
            <th>И</th><th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>
          </tr></thead><tbody><tr>
            <td class="num">${val(subSeason.gamesPlayed)}</td>
            <td class="num">${val(subSeason.wins)}</td>
            <td class="num">${val(subSeason.losses)}</td>
            <td class="num">${subSeason.savePctg !== undefined ? subSeason.savePctg.toFixed(3) : "—"}</td>
            <td class="num">${subSeason.goalsAgainstAverage !== undefined ? subSeason.goalsAgainstAverage.toFixed(2) : "—"}</td>
          </tr></tbody></table></div>
        `;
      } else {
        html += `
          <div class="table-scroll"><table class="stat-table"><thead><tr>
            <th>И</th><th>Г</th><th>П</th><th>О</th><th>+/-</th><th>Штр</th>
          </tr></thead><tbody><tr>
            <td class="num">${val(subSeason.gamesPlayed)}</td>
            <td class="num">${val(subSeason.goals)}</td>
            <td class="num">${val(subSeason.assists)}</td>
            <td class="num">${val(subSeason.points)}</td>
            <td class="num">${val(subSeason.plusMinus)}</td>
            <td class="num">${val(subSeason.pim ?? subSeason.penaltyMinutes)}</td>
          </tr></tbody></table></div>
        `;
      }

      html += '<div class="section-title">История карьеры в NHL</div>';
      
      if (p.seasonTotals && Array.isArray(p.seasonTotals)) {
        const nhlHistory = p.seasonTotals.filter(s => s.leagueAbbrev === "NHL");

        if (nhlHistory.length === 0) {
          html += '<div class="empty">История выступлений в NHL отсутствует</div>';
        } else {
          const regularSeasonRows = nhlHistory.filter(s => s.gameTypeId === 2 || s.gameTypeCode === 2);
          const playoffRows = nhlHistory.filter(s => s.gameTypeId === 3 || s.gameTypeCode === 3);

          html += `<div class="table-scroll"><table class="stat-table"><thead><tr>`;
          html += `<th>Сезон</th><th>Клуб</th><th>И</th>`;
          if (pos === "G") {
            html += `<th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>`;
          } else {
            html += `<th>Г</th><th>П</th><th>О</th><th>+/-</th><th>Штр</th>`;
          }
          html += `</tr></thead><tbody>`;

          if (regularSeasonRows.length > 0) {
            html += `<tr class="playoff-header-row"><td colspan="${pos === 'G' ? 7 : 8}">Регулярный сезон</td></tr>`;
            regularSeasonRows.forEach(s => { html += renderCareerRow(s, pos); });
          }

          if (playoffRows.length > 0) {
            html += `<tr class="playoff-header-row playoff-border"><td colspan="${pos === 'G' ? 7 : 8}">Плей-офф</td></tr>`;
            playoffRows.forEach(s => { html += renderCareerRow(s, pos); });
          }

          html += `</tbody></table></div>`;
        }
      } else {
         html += '<div class="empty">История выступлений недоступна</div>';
      }

      body.innerHTML = html;
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить карточку игрока</div>';
    }
  }

  function renderCareerRow(s, pos) {
    const yearStr = String(s.season).replace(/^(\d{4})(\d{4})$/, "$1-$2");
    const teamName = s.teamName?.default || s.teamAbbrev || "—";
    
    let rHtml = `<tr>
      <td>${yearStr}</td>
      <td>${escapeHtml(teamName)}</td>
      <td class="num">${val(s.gamesPlayed)}</td>`;
    
    if (pos === "G") {
      const svPct = s.savePctg ?? s.savePercentage;
      const gaa = s.goalsAgainstAverage ?? s.gaa;
      rHtml += `
        <td class="num">${val(s.wins)}</td>
        <td class="num">${val(s.losses)}</td>
        <td class="num">${typeof svPct === 'number' ? svPct.toFixed(3) : val(svPct)}</td>
        <td class="num">${typeof gaa === 'number' ? gaa.toFixed(2) : val(gaa)}</td>`;
    } else {
      rHtml += `
        <td class="num">${val(s.goals)}</td>
        <td class="num">${val(s.assists)}</td>
        <td class="num">${val(s.points)}</td>
        <td class="num">${val(s.plusMinus)}</td>
        <td class="num">${val(s.pim ?? s.penaltyMinutes)}</td>`;
    }
    rHtml += `</tr>`;
    return rHtml;
  }

  loadSchedule();
</script>
</body>
</html>
