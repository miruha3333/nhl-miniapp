<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NHL Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0A0A0A;
  --surface: #161616;
  --surface-2: #232323;
  --silver: #E6E9EA;
  --silver-dim: #9CA3AA;
  --blue: #1F5FCE;
  --red: #C8102E;
  --border: #2C2C2C;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding-bottom: 24px;
  background: var(--bg);
  color: var(--silver);
  font-family: "Inter", sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  padding: 20px 16px 14px;
  border-bottom: 2px solid var(--blue);
  background: linear-gradient(180deg, #141414 0%, var(--bg) 100%);
}

header h1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 2px;
  color: var(--silver);
  font-family: "Oswald", sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

header h1 .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
}

header .sub {
  color: var(--silver-dim);
  font-size: 12px;
}

nav {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 6px;
  padding: 12px 16px 0;
  background: var(--bg);
}

nav button {
  flex: 1;
  padding: 10px 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--silver-dim);
  background: var(--surface);
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

nav button.active {
  border-color: var(--blue);
  color: #fff;
  background: var(--blue);
  font-weight: 700;
}

main {
  padding: 14px 16px 0;
}

.date-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px 0 14px;
}

.date-input {
  width: 140px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  color: var(--silver);
  background: transparent;
  font-family: "Roboto Mono", monospace;
  font-size: 14px;
  text-align: center;
  cursor: pointer;
}

.date-input::-webkit-calendar-picker-indicator {
  filter: invert(1);
}

select.date-input {
  appearance: none;
  -webkit-appearance: none;
}

select.date-input option {
  color: var(--silver);
  background: #1A1A1A;
}

.date-row button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--silver);
  background: var(--surface);
  font-size: 16px;
  cursor: pointer;
}

.card {
  margin-bottom: 10px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
}

.game-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}

.team {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.team.right {
  justify-content: flex-end;
  text-align: right;
}

.team-logo {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  object-fit: contain;
}

.abbr {
  font-family: "Oswald", sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.team-record {
  margin-top: 3px;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  font-size: 10px;
  line-height: 1.1;
  white-space: nowrap;
}

.team-record strong {
  color: var(--silver);
  font-weight: 700;
}

.score-box {
  min-width: 70px;
  padding: 4px 6px;
  border-radius: 10px;
  text-align: center;
}

.score-box.clickable {
  cursor: pointer;
  transition: background 0.15s;
}

.score-box.clickable:active {
  background: var(--surface-2);
}

.score-box .score {
  color: var(--silver);
  font-family: "Roboto Mono", monospace;
  font-size: 22px;
  font-weight: 700;
}

.score-box .status {
  margin-top: 2px;
  color: var(--red);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.table-wrapper {
  position: relative;
  width: 100%;
  overflow-x: auto;
  border-radius: 12px;
  -webkit-overflow-scrolling: touch;
}

.standings-table {
  display: grid;
  grid-template-columns: 24px 30px 110px repeat(8, 35px);
  min-width: 600px;
  align-items: center;
}

.sticky-col {
  position: sticky;
  z-index: 2;
  background: var(--surface);
}

.sticky-col-1 {
  left: 0;
}

.sticky-col-2 {
  left: 24px;
}

.sticky-col-3 {
  left: 54px;
}

.standings-head,
.standings-row,
.group-header-row {
  display: contents;
}

.standings-head > div,
.standings-row > div {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.standings-head > div {
  color: var(--silver-dim);
  font-size: 10px;
  text-transform: uppercase;
}

.standings-head .sticky-col {
  z-index: 3;
}

.standings-head .sortable {
  color: var(--silver);
  cursor: pointer;
  text-decoration: underline dotted;
}

.standings-row {
  cursor: pointer;
}

.standings-row:active > div {
  background: var(--surface-2) !important;
}

.standings-row .name {
  width: 100%;
  justify-content: flex-start;
  overflow: hidden;
  padding-left: 5px;
  font-family: "Oswald", sans-serif;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.standings-row .num,
.standings-row .diff,
.standings-row .pts,
.stat-table .num {
  font-family: "Roboto Mono", monospace;
}

.standings-row .num.sticky-col-1 {
  color: var(--silver-dim);
}

.standings-row .team-logo {
  width: 20px;
  height: 20px;
}

.standings-row .pts {
  color: var(--blue);
  font-weight: 700;
}

.group-header-row > div {
  grid-column: 1 / -1;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--silver);
  background: var(--surface-2);
  font-family: "Oswald", sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.cat-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.cat-row button {
  flex: 1;
  padding: 8px 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--silver-dim);
  background: var(--surface);
  font-family: "Oswald", sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

.cat-row button.active {
  border-color: var(--red);
  color: #fff;
  background: var(--red);
  font-weight: 700;
}

.player-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.player-row:last-child {
  border-bottom: none;
}

.player-row:active {
  background: var(--surface-2);
}

.player-row .rank {
  width: 20px;
  flex-shrink: 0;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  text-align: center;
}

.player-row .headshot {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  object-fit: cover;
}

.player-row .info {
  min-width: 0;
  flex: 1;
}

.player-row .pname {
  overflow: hidden;
  font-family: "Oswald", sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-row .pteam {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
  color: var(--silver-dim);
  font-size: 11px;
}

.player-row .pteam .team-logo {
  width: 16px;
  height: 16px;
}

.player-row .pvalue {
  flex-shrink: 0;
  color: var(--blue);
  font-family: "Roboto Mono", monospace;
  font-size: 20px;
  font-weight: 700;
}

.show-more {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--silver-dim);
  background: var(--surface-2);
  font-family: "Oswald", sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

.empty,
.loading {
  grid-column: 1 / -1;
  padding: 30px 0;
  color: var(--silver-dim);
  font-size: 13px;
  text-align: center;
}

.loading {
  font-family: "Roboto Mono", monospace;
}

.spotlight-title {
  margin: 24px 0 12px;
  color: var(--silver-dim);
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.spotlight-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  cursor: pointer;
}

.spotlight-card:active {
  background: var(--surface-2);
}

.spotlight-headshot {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  object-fit: cover;
}

.spotlight-info {
  min-width: 0;
  flex: 1;
}

.spotlight-name {
  font-family: "Oswald", sans-serif;
  font-size: 15px;
  font-weight: 600;
}

.spotlight-team {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  color: var(--silver-dim);
  font-size: 12px;
}

.spotlight-team .team-logo {
  width: 16px;
  height: 16px;
}

.spotlight-rank {
  width: 18px;
  flex-shrink: 0;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  font-size: 13px;
  text-align: center;
}

.spotlight-value {
  flex-shrink: 0;
  color: var(--blue);
  font-family: "Roboto Mono", monospace;
  font-size: 20px;
  font-weight: 700;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--silver);
  background: var(--surface);
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

.detail-head-game {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.detail-head img.team-logo,
.detail-head-game img.team-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.detail-head img.headshot {
  width: 64px;
  height: 64px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  object-fit: cover;
}

.detail-head .title,
.detail-head-game .title {
  color: var(--silver);
  font-family: "Oswald", sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-align: center;
  text-transform: uppercase;
}

.detail-head .subtitle,
.detail-head-game .subtitle {
  margin-top: 2px;
  color: var(--silver-dim);
  font-size: 12px;
  text-align: center;
}

.section-title {
  margin: 16px 0 8px;
  color: var(--silver-dim);
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.bio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  font-size: 13px;
}

.bio-grid .label {
  color: var(--silver-dim);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.bio-grid .value {
  font-family: "Oswald", sans-serif;
  font-weight: 600;
}

.stat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.stat-table th,
.stat-table td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  white-space: nowrap;
}

.stat-table th {
  color: var(--silver-dim);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stat-table th.sortable {
  color: var(--silver);
  cursor: pointer;
  text-decoration: underline dotted;
}

.stat-table td:first-child,
.stat-table th:first-child {
  font-family: "Oswald", sans-serif;
  font-weight: 600;
  text-align: left;
}

.stat-table tbody tr.clickable-row {
  cursor: pointer;
}

.stat-table tbody tr.clickable-row:active {
  background: var(--surface-2);
}

.stat-table tbody tr.playoff-header-row td {
  padding: 6px 8px;
  color: var(--silver);
  background: var(--surface-2);
  font-family: "Oswald", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-align: left;
  text-transform: uppercase;
}

.stat-table tbody tr.playoff-border {
  border-bottom: 3px solid var(--blue);
}

.table-scroll {
  overflow-x: auto;
}

.goal-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.goal-row:last-child {
  border-bottom: none;
}

.goal-row .time {
  width: 46px;
  flex-shrink: 0;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  font-size: 12px;
}

.goal-row .desc {
  flex: 1;
}

.goal-row .scorer {
  font-family: "Oswald", sans-serif;
  font-weight: 600;
}

.goal-row .assists {
  margin-top: 2px;
  color: var(--silver-dim);
  font-size: 11px;
}

.goal-row .scoreline {
  flex-shrink: 0;
  color: var(--blue);
  font-family: "Roboto Mono", monospace;
  font-weight: 700;
}

.period-label {
  margin: 10px 0 4px;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
}

.bracket-wrap {
  margin-top: 16px;
}

.bracket-round-title {
  margin: 14px 0 8px;
  color: var(--silver-dim);
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.bracket-series {
  margin-bottom: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}

.bracket-team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}

.bracket-team-row .bt-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Oswald", sans-serif;
  font-weight: 600;
}

.bracket-team-row .bt-name img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.bracket-team-row.winner .bt-name {
  color: var(--blue);
}

.bracket-team-row .bt-wins {
  font-family: "Roboto Mono", monospace;
  font-weight: 700;
}

.teamstat-head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.teamstat-head .team-logo {
  width: 26px;
  height: 26px;
}

.teamstat-head .side {
  display: flex;
  align-items: center;
  gap: 8px;
}

.teamstat-head .side.right {
  justify-content: flex-end;
}

.teamstat-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}

.teamstat-row:last-child {
  border-bottom: none;
}

.teamstat-row .val {
  color: var(--silver);
  font-family: "Roboto Mono", monospace;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
}

.teamstat-row .val.away {
  text-align: left;
}

.teamstat-row .val.home {
  text-align: right;
}

.teamstat-row .periods {
  display: block;
  margin-top: 1px;
  color: var(--silver-dim);
  font-family: "Roboto Mono", monospace;
  font-size: 10px;
  font-weight: 400;
}

.teamstat-row .label {
  color: var(--silver-dim);
  font-family: "Oswald", sans-serif;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-align: center;
  text-transform: uppercase;
}
</style>
</head>

<body>
<header>
  <h1><span class="dot"></span>NHL LIVE</h1>
  <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
</header>

<nav id="main-nav">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Игроки</button>
</nav>

<main>
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <input type="date" id="date-picker" class="date-input">
      <button id="next-day">›</button>
    </div>

    <div id="games">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <div id="view-standings" style="display:none">
    <div class="cat-row">
      <button id="std-mode-all" class="active">Общая</button>
      <button id="std-mode-conf">По конференциям</button>
      <button id="std-mode-div">По дивизионам</button>
    </div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;">
      <span style="font-family:'Oswald',sans-serif;font-size:12px;color:var(--silver-dim);text-transform:uppercase;letter-spacing:0.04em;">
        Сезон
      </span>
      <select id="season-select" class="date-input" style="width:auto;flex:1;"></select>
    </div>

    <div class="card" style="padding:0;">
      <div class="table-wrapper">
        <div class="standings-table">
          <div class="standings-head">
            <div class="sticky-col sticky-col-1"></div>
            <div class="sticky-col sticky-col-2"></div>
            <div class="sticky-col sticky-col-3"></div>
            <div class="sortable" data-sort="gamesPlayed">И</div>
            <div class="sortable" data-sort="wins">В</div>
            <div class="sortable" data-sort="otLosses">ОТ</div>
            <div class="sortable" data-sort="losses">П</div>
            <div class="sortable" data-sort="goalFor">ЗШ</div>
            <div class="sortable" data-sort="goalAgainst">ПШ</div>
            <div class="sortable" data-sort="goalDifferential">+/-</div>
            <div class="sortable" data-sort="points">О</div>
          </div>

          <div id="standings-body" style="display:contents;">
            <div class="loading">Загрузка...</div>
          </div>
        </div>
      </div>
    </div>

    <div id="bracket-container"></div>
  </div>

  <div id="view-players" style="display:none">
    <div class="cat-row">
      <button data-cat="points" class="active">Очки</button>
      <button data-cat="goals">Голы</button>
      <button data-cat="assists">Передачи</button>
      <button data-cat="plusMinus">+/-</button>
      <button data-cat="goalies">Вратари</button>
    </div>

    <div class="card">
      <div id="players-body">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
  </div>

  <div id="view-detail" style="display:none">
    <button class="back-btn" id="back-btn">‹ Назад</button>

    <div id="detail-body">
      <div class="loading">Загрузка...</div>
    </div>
  </div>
</main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

function nameStr(value) {
  if (!value) return "";
  if (typeof value === "string") return value;
  return value.default || value.name || "";
}

function val(value, fallback = "—") {
  return value === undefined || value === null || value === ""
    ? fallback
    : value;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function getTeamAbbrev(team) {
  if (!team) return "";

  if (typeof team === "string") {
    return team.trim().toUpperCase();
  }

  if (typeof team === "object") {
    return String(
      team.default ||
      team.abbrev ||
      team.abbreviation ||
      team.teamAbbrev ||
      ""
    ).trim().toUpperCase();
  }

  return "";
}

function getTeamName(team) {
  if (!team) return "";

  if (typeof team === "string") {
    return team;
  }

  if (typeof team === "object") {
    return String(
      team.default ||
      team.name ||
      team.teamName ||
      ""
    );
  }

  return "";
}

function getTeamLogo(team) {
  if (!team) return "";

  if (typeof team === "string") {
    return team;
  }

  if (typeof team === "object") {
    return String(
      team.logo ||
      team.teamLogo ||
      team.crest ||
      ""
    );
  }

  return "";
}

function fmtDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function seasonIdFromEndDate(endDate) {
  if (!endDate || typeof endDate !== "string") {
    return null;
  }

  const match = endDate.match(/^(\d{4})-\d{2}-\d{2}$/);

  if (!match) {
    return null;
  }

  const endYear = Number(match[1]);
  return `${endYear - 1}${endYear}`;
}

function formatPeriodLabel(descriptor) {
  if (!descriptor) return "Период";

  const type = descriptor.periodType;
  const number = descriptor.number;

  if (type === "SO") {
    return "Буллиты";
  }

  if (type === "OT") {
    const otNumber = number && number > 3 ? number - 3 : 1;
    return otNumber > 1
      ? `${otNumber}-й овертайм`
      : "Овертайм";
  }

  return number
    ? `${number}-й период`
    : "Период";
}

function switchTab(tab) {
  document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
  document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
  document.getElementById("tab-players").classList.toggle("active", tab === "players");

  document.getElementById("view-schedule").style.display =
    tab === "schedule" ? "" : "none";

  document.getElementById("view-standings").style.display =
    tab === "standings" ? "" : "none";

  document.getElementById("view-players").style.display =
    tab === "players" ? "" : "none";

  document.getElementById("view-detail").style.display = "none";
  document.getElementById("main-nav").style.display = "flex";

  lastMainTab = tab;

  if (tab === "standings") {
    loadStandings();

    if (!bracketLoadedOnce) {
      const now = new Date();
      const currentSeasonStartYear =
        now.getMonth() >= 8
          ? now.getFullYear()
          : now.getFullYear() - 1;

      const playoffYear = currentSeasonStartYear + 1;
      const playoffStartApprox = new Date(playoffYear, 3, 14);

      if (now >= playoffStartApprox) {
        loadPlayoffBracket(String(playoffYear));
      } else {
        document.getElementById("bracket-container").innerHTML = `
          <div class="bracket-wrap">
            <div class="section-title">Сетка плей-офф</div>
            <div class="empty">
              Регулярный сезон ещё не завершён — плей-офф начнётся позже
            </div>
          </div>
        `;
      }

      bracketLoadedOnce = true;
    }
  }

  if (tab === "players") {
    loadPlayers();
  }
}

async function buildSeasonOptions() {
  const select = document.getElementById("season-select");
  select.innerHTML = "<option value=''>Загрузка сезонов...</option>";

  try {
    const res = await fetch(`${API_BASE}/api/seasons-list`);

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const seasons = data?.seasons || [];

    if (!seasons.length) {
      select.innerHTML = "<option value=''>Текущий сезон</option>";
      return;
    }

    const sorted = [...seasons].sort((a, b) => b.id - a.id);

    let optionsHtml = "<option value=''>Текущий сезон</option>";

    sorted.forEach(season => {
      const id = String(season.id);
      const startYear = id.slice(0, 4);
      const endYearShort = id.slice(6, 8);
      const label = `${startYear}-${endYearShort}`;

      optionsHtml += `
        <option
          value="${escapeHtml(season.standingsEnd || "")}"
          data-start-year="${escapeHtml(startYear)}"
        >
          ${escapeHtml(label)}
        </option>
      `;
    });

    select.innerHTML = optionsHtml;
  } catch (error) {
    console.error("Ошибка загрузки сезонов:", error);
    select.innerHTML = "<option value=''>Текущий сезон</option>";
  }
}

        ? now.getFullYear()

  const playoffYear = String(Number(startYear) + 1);

  if (isCurrentSeason) {
    const now = new Date();
    const playoffStartApprox = new Date(Number(playoffYear), 3, 14);

    if (now >= playoffStartApprox) {
      loadPlayoffBracket(playoffYear);
    } else {
      document.getElementById("bracket-container").innerHTML = `
        <div class="bracket-wrap">
          <div class="section-title">Сетка плей-офф</div>
          <div class="empty">
            Регулярный сезон ещё не завершён — плей-офф начнётся позже
          </div>
        </div>
      `;

  }
});

async function loadSchedule() {
  const games = document.getElementById("games");
  const date = fmtDate(currentDate);

  games.innerHTML = '<div class="loading">Загрузка...</div>';
  datePicker.value = date;

  try {
    const res = await fetch(
      `${API_BASE}/api/schedule?date=${encodeURIComponent(date)}`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const week = data.gameWeek || [];
    const day = week.find(item => item.date === date);
    const list = day?.games || [];

    if (!list.length) {
      games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
      loadSpotlight();
      return;
    }

    games.innerHTML = list.map(renderGame).join("");

    games.querySelectorAll(".score-box.clickable").forEach(element => {
      element.addEventListener("click", () => {
        openGameDetail(
          element.dataset.gameId,
          element.dataset.away,
          element.dataset.home,
          element.dataset.awayLogo,
          element.dataset.homeLogo
        );
      });
    });
  } catch (error) {
    console.error("Ошибка загрузки матчей:", error);
    games.innerHTML =
      '<div class="empty">Не удалось загрузить матчи</div>';
  }
}

async function loadSpotlight() {
  const games = document.getElementById("games");

  try {
    const res = await fetch(`${API_BASE}/api/leaders/points?limit=6`);

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const players = data.points || [];

    if (!players.length) {
      return;
    }

    let html = '<div class="spotlight-title">Лидеры лиги по очкам</div>';
    html += players
      .map((player, index) => renderSpotlightCard(player, index + 1))
      .join("");

    games.insertAdjacentHTML("beforeend", html);

    games.querySelectorAll(".spotlight-card").forEach(element => {
      element.addEventListener("click", () => {
        if (element.dataset.playerId) {
          openPlayerDetail(element.dataset.playerId);
        }
      });
    });
  } catch (error) {
    console.error("Ошибка загрузки spotlight:", error);
  }
}

function renderSpotlightCard(player, rank) {
  const name =
    `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
      .trim() || "Игрок";

  const playerId = player.id || player.playerId || "";

  return `
    <div
      class="spotlight-card"
      data-player-id="${escapeHtml(playerId)}"
    >
      <div class="spotlight-rank">${rank}</div>

      <img
        class="spotlight-headshot"
        src="${escapeHtml(player.headshot || "")}"
        alt=""
        onerror="this.style.visibility='hidden'"
      >

      <div class="spotlight-info">
        <div class="spotlight-name">${escapeHtml(name)}</div>

        <div class="spotlight-team">
          <img
            class="team-logo"
            src="${escapeHtml(player.teamLogo || "")}"
            alt=""
            onerror="this.style.display='none'"
          >
          <span>${escapeHtml(player.teamAbbrev || "")}</span>
        </div>
      </div>

      <div class="spotlight-value">${escapeHtml(player.value ?? "")}</div>
    </div>
  `;
}

function renderTeamRecord(team) {
  const record = team?.currentRecord;

  if (!record) {
    return "";
  }

  const normalize = value => {
    const number = Number(value ?? 0);
    return Number.isFinite(number) ? number : 0;
  };

  return `
    <div class="team-record">
      <strong>
        ${normalize(record.wins)}-${normalize(record.losses)}-${normalize(record.otLosses)}-${normalize(record.points)}
      </strong>
    </div>
  `;
}

function renderGame(game) {
  const away = game.awayTeam || {};
  const home = game.homeTeam || {};
  const state = game.gameState;

  const started = state !== "FUT" && state !== "PRE";

  const status = started
    ? ((state === "LIVE" || state === "CRIT") ? "LIVE" : "Финал")
    : new Date(game.startTimeUTC).toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });

  const score = started
    ? `${away.score ?? 0} : ${home.score ?? 0}`
    : "vs";

  return `
    <div class="card">
      <div class="game-row">
        <div class="team">
          <img
            class="team-logo"
            src="${escapeHtml(away.logo || "")}"
            alt=""
            onerror="this.style.display='none'"
          >

          <div>
            <div class="abbr">${escapeHtml(away.abbrev || "")}</div>
            ${renderTeamRecord(away)}
          </div>
        </div>

        <div
          class="${started ? "score-box clickable" : "score-box"}"
          ${started ? `
            data-game-id="${escapeHtml(game.id)}"
            data-away="${escapeHtml(away.abbrev || "")}"
            data-home="${escapeHtml(home.abbrev || "")}"
            data-away-logo="${escapeHtml(away.logo || "")}"
            data-home-logo="${escapeHtml(home.logo || "")}"
          ` : ""}
        >
          <div class="score">${score}</div>
          <div class="status">${status}</div>
        </div>

        <div class="team right">
          <div>
            <div class="abbr">${escapeHtml(home.abbrev || "")}</div>
            ${renderTeamRecord(home)}
          </div>

          <img
            class="team-logo"
            src="${escapeHtml(home.logo || "")}"
            alt=""
            onerror="this.style.display='none'"
          >
        </div>
      </div>
    </div>
  `;
}

async function loadStandings() {
  const body = document.getElementById("standings-body");

  if (currentStandingsData.length === 0) {
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const url = selectedSeasonEndDate
        ? `${API_BASE}/api/standings-by-date/${encodeURIComponent(selectedSeasonEndDate)}`
        : `${API_BASE}/api/standings`;

      const res = await fetch(url);

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const data = await res.json();
      currentStandingsData = data.standings || [];
    } catch (error) {
      console.error("Ошибка загрузки таблицы:", error);
      body.innerHTML =
        '<div class="empty">Не удалось загрузить таблицу</div>';
      return;
    }
  }

  renderStandings();
}

function renderTeamRow(team, rank) {
  const teamAbbrev = getTeamAbbrev(
    team.teamAbbrev ||
    team.abbrev ||
    team.team
  );

  const teamName = getTeamName(
    team.teamName ||
    team.name
  ) || teamAbbrev;

  const teamLogo = getTeamLogo(
    team.teamLogo ||
    team.logo
  );

  const goalFor = Number(team.goalFor ?? 0);
  const goalAgainst = Number(team.goalAgainst ?? 0);

  const difference = Number(
    team.goalDifferential ??
    (goalFor - goalAgainst)
  );

  const formattedDifference =
    difference > 0 ? `+${difference}` : difference;

  return `
    <div
      class="standings-row"
      data-team="${escapeHtml(teamAbbrev)}"
      data-name="${escapeHtml(teamName)}"
      data-logo="${escapeHtml(teamLogo)}"
    >
      <div class="num sticky-col sticky-col-1">${rank}</div>

      <div class="sticky-col sticky-col-2">
        <img
          class="team-logo"
          src="${escapeHtml(teamLogo)}"
          alt=""
          onerror="this.style.visibility='hidden'"
        >
      </div>

      <div class="name sticky-col sticky-col-3">
        ${escapeHtml(teamAbbrev)}
      </div>

      <div class="num">${team.gamesPlayed ?? 0}</div>
      <div class="num">${team.wins ?? 0}</div>
      <div class="num">${team.otLosses ?? 0}</div>
      <div class="num">${team.losses ?? 0}</div>
      <div class="num">${goalFor}</div>
      <div class="num">${goalAgainst}</div>

      <div
        class="diff"
        style="color:${difference >= 0 ? "#2ecc71" : "#e74c3c"}"
      >
        ${formattedDifference}
      </div>

      <div class="pts">${team.points ?? 0}</div>
    </div>
  `;
}

function sortTeams(teams) {
  const sorted = [...teams];

  sorted.sort((a, b) => {
    let valueA = a[standingsSortKey] ?? 0;
    let valueB = b[standingsSortKey] ?? 0;

    if (standingsSortKey === "goalDifferential") {
      valueA = a.goalDifferential ??
        ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));

      valueB = b.goalDifferential ??
        ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
    }

    valueA = Number(valueA);
    valueB = Number(valueB);

    return standingsSortAsc
      ? valueA - valueB
      : valueB - valueA;
  });

  return sorted;
}

function renderStandings() {
  const body = document.getElementById("standings-body");

  if (!currentStandingsData.length) {
    body.innerHTML = '<div class="empty">Нет данных</div>';
    return;
  }

  let html = "";

  if (standingsViewMode === "all") {
    html = sortTeams(currentStandingsData)
      .map((team, index) => renderTeamRow(team, index + 1))
      .join("");
  } else {
    const groupField =
      standingsViewMode === "conf"
        ? "conferenceName"
        : "divisionName";

    const hasGroupData =
      currentStandingsData.some(team => team[groupField]);

    if (!hasGroupData) {
      html = `
        <div class="group-header-row">
          <div>
            Для этого сезона данные о
            ${standingsViewMode === "conf"
              ? "конференциях"
              : "дивизионах"}
            отсутствуют
          </div>
        </div>
      `;

      html += sortTeams(currentStandingsData)
        .map((team, index) => renderTeamRow(team, index + 1))
        .join("");
    } else {
      const groups = {};

      currentStandingsData.forEach(team => {
        const key = nameStr(team[groupField]) || "Без группы";

        if (!groups[key]) {
          groups[key] = [];
        }

        groups[key].push(team);
      });

      Object.keys(groups)
        .sort()
        .forEach(groupName => {
          html += `
            <div class="group-header-row">
              <div>${escapeHtml(groupName)}</div>
            </div>
          `;

          html += sortTeams(groups[groupName])
            .map((team, index) => renderTeamRow(team, index + 1))
            .join("");
        });
    }
  }

  body.innerHTML = html;

  body.querySelectorAll(".standings-row").forEach(row => {
    row.addEventListener("click", () => {
      openTeamDetail(
        row.dataset.team,
        row.dataset.name,
        row.dataset.logo
      );
    });
  });
}

async function loadPlayoffBracket(playoffYear) {
  const container = document.getElementById("bracket-container");

  if (!playoffYear) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = `
    <div class="bracket-wrap">
      <div class="loading">Загрузка сетки плей-офф...</div>
    </div>
  `;

  try {
    const res = await fetch(
      `${API_BASE}/api/playoff-bracket/${encodeURIComponent(playoffYear)}`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const seriesList = data?.series || [];

    if (!seriesList.length) {
      container.innerHTML = `
        <div class="bracket-wrap">
          <div class="section-title">Сетка плей-офф</div>
          <div class="empty">
            Плей-офф для этого сезона недоступен или ещё не начался
          </div>
        </div>
      `;
      return;
    }

    const roundsMap = {};

    seriesList.forEach(series => {
      const round =
        series.round ??
        series.roundNumber ??
        series.playoffRound ??
        1;

      if (!roundsMap[round]) {
        roundsMap[round] = [];
      }

      roundsMap[round].push(series);
    });

    const roundNames = {
      1: "1-й раунд",
      2: "2-й раунд (полуфинал конференции)",
      3: "Финал конференции",
      4: "Финал Кубка Стэнли"
    };

    let html = `
      <div class="bracket-wrap">
        <div class="section-title">Сетка плей-офф</div>
    `;

    Object.keys(roundsMap)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(round => {
        html += `
          <div class="bracket-round-title">
            ${escapeHtml(roundNames[round] || `Раунд ${round}`)}
          </div>
        `;

        roundsMap[round].forEach(series => {
          const top =
            series.topSeedTeam ||
            series.matchupTeams?.[0] ||
            series.team1 ||
            {};

          const bottom =
            series.bottomSeedTeam ||
            series.matchupTeams?.[1] ||
            series.team2 ||
            {};

          const topWins =
            series.topSeedWins ??
            series.matchupTeams?.[0]?.seriesWins ??
            series.team1Wins ??
            0;

          const bottomWins =
            series.bottomSeedWins ??
            series.matchupTeams?.[1]?.seriesWins ??
            series.team2Wins ??
            0;

          const topWinner =
            topWins > bottomWins &&
            (topWins === 4 || bottomWins === 4);

          const bottomWinner =
            bottomWins > topWins &&
            (topWins === 4 || bottomWins === 4);

          const topAbbrev =
            top.abbrev ||
            top.teamAbbrev?.default ||
            top.placeName?.default ||
            "TBD";

          const bottomAbbrev =
            bottom.abbrev ||
            bottom.teamAbbrev?.default ||
            bottom.placeName?.default ||
            "TBD";

          const topLogo =
            top.logo ||
            top.teamLogo ||
            "";

          const bottomLogo =
            bottom.logo ||
            bottom.teamLogo ||
            "";

          html += `
            <div class="bracket-series">
              <div class="bracket-team-row ${topWinner ? "winner" : ""}">
                <div class="bt-name">
                  <img
                    src="${escapeHtml(topLogo)}"
                    alt=""
                    onerror="this.style.display='none'"
                  >
                  <span>${escapeHtml(topAbbrev)}</span>
                </div>
                <div class="bt-wins">${topWins}</div>
              </div>

              <div class="bracket-team-row ${bottomWinner ? "winner" : ""}">
                <div class="bt-name">
                  <img
                    src="${escapeHtml(bottomLogo)}"
                    alt=""
                    onerror="this.style.display='none'"
                  >
                  <span>${escapeHtml(bottomAbbrev)}</span>
                </div>
                <div class="bt-wins">${bottomWins}</div>
              </div>
            </div>
          `;
        });
      });

    html += "</div>";
    container.innerHTML = html;
  } catch (error) {
    console.error("Ошибка загрузки сетки:", error);

      <div class="bracket-wrap">
        <div class="empty">Не удалось загрузить сетку плей-офф</div>

async function loadPlayers() {
  const body = document.getElementById("players-body");
  body.innerHTML = '<div class="loading">Загрузка...</div>';

  if (currentCat === "goalies") {
    await loadGoalieLeaders();
    return;
  }

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);

    const params = new URLSearchParams({
      limit: String(currentLimit)
    });

    if (seasonId) {
      params.set("season", seasonId);
    }

    const res = await fetch(
      `${API_BASE}/api/leaders/${encodeURIComponent(currentCat)}?${params}`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const list = data[currentCat] || [];

    if (!list.length) {
      body.innerHTML = '<div class="empty">Нет данных игроков</div>';
      return;
    }

    body.innerHTML = list.map((player, index) => `
      <div
        class="player-row"
        data-player-id="${escapeHtml(player.id || player.playerId || "")}"
      >
        <div class="rank">${index + 1}</div>

        <img
          class="headshot"
          src="${escapeHtml(player.headshot || "")}"
          alt=""
          onerror="this.style.visibility='hidden'"
        >

        <div class="info">
          <div class="pname">
            ${escapeHtml(nameStr(player.firstName))}
            ${escapeHtml(nameStr(player.lastName))}
          </div>

          <div class="pteam">
            <img
              class="team-logo"
              src="${escapeHtml(player.teamLogo || "")}"
              alt=""
              onerror="this.style.display='none'"
            >
            ${escapeHtml(player.teamAbbrev || "")}
          </div>
        </div>

        <div class="pvalue">${escapeHtml(player.value ?? "")}</div>
      </div>
    `).join("");

    if (list.length >= currentLimit && currentLimit < 50) {
      body.insertAdjacentHTML(
        "beforeend",
        '<button class="show-more" id="show-more-players">Показать больше</button>'
      );

      document.getElementById("show-more-players").onclick = () => {
        currentLimit = 50;
        loadPlayers();
      };

    body.querySelectorAll(".player-row").forEach(row => {
      row.addEventListener("click", () => {
        openPlayerDetail(row.dataset.playerId);

    body.innerHTML =
      '<div class="empty">Не удалось загрузить лидеров</div>';
  }
}

async function loadGoalieLeaders() {
  const body = document.getElementById("players-body");
  body.innerHTML =
    '<div class="loading">Загрузка статистики вратарей...</div>';

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);

    const params = new URLSearchParams({
      limit: "100"
    });

    if (seasonId) {
      params.set("season", seasonId);
    }

    const res = await fetch(
      `${API_BASE}/api/goalie-leaders?${params}`,
      { cache: "no-store" }
    );

    let data = null;

    try {
      data = await res.json();
    } catch (_) {
      data = null;
    }

    if (!res.ok) {
      throw new Error(data?.error || `HTTP ${res.status}`);
    }

    if (data?.error && !Array.isArray(data.goalies)) {
      throw new Error(data.error);
    }

    let rows = Array.isArray(data?.goalies)
      ? [...data.goalies]
      : [];

    if (!rows.length) {
      body.innerHTML =
        '<div class="empty">Нет данных вратарей за выбранный сезон</div>';
      return;
    }

    const valueForSort = (player, key) => {
      if (key === "name") {
        return `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
          .trim()
          .toLowerCase();
      }

      const value = player[key];

      if (value === null || value === undefined || value === "") {
        return -Infinity;
      }

      const number = Number(value);
      return Number.isNaN(number)
        ? String(value).toLowerCase()
        : number;
    };

    rows.sort((a, b) => {
      const valueA = valueForSort(a, currentGoalieSortKey);
      const valueB = valueForSort(b, currentGoalieSortKey);

      if (typeof valueA === "string" || typeof valueB === "string") {
        const result = String(valueA).localeCompare(
          String(valueB),
          "ru"
        );

        return currentGoalieSortAsc ? result : -result;
      }

      return currentGoalieSortAsc
        ? valueA - valueB
        : valueB - valueA;
    });

    const arrow = key => {
      if (currentGoalieSortKey !== key) return "";
      return currentGoalieSortAsc ? " ↑" : " ↓";
    };

    const display = value => {
      return value === null ||
        value === undefined ||
        value === ""
        ? "—"
        : value;
    };

    body.innerHTML = `
      <div class="section-title">Вратари</div>

      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th class="sortable" data-goalie-sort="name">
                Вратарь${arrow("name")}
              </th>
              <th class="sortable" data-goalie-sort="gamesPlayed">
                И${arrow("gamesPlayed")}
              </th>
              <th class="sortable" data-goalie-sort="wins">
                В${arrow("wins")}
              </th>
              <th class="sortable" data-goalie-sort="losses">
                П${arrow("losses")}
              </th>
              <th class="sortable" data-goalie-sort="otLosses">
                ПБО${arrow("otLosses")}
              </th>
              <th class="sortable" data-goalie-sort="savePctg">
                %ОБ${arrow("savePctg")}
              </th>
              <th class="sortable" data-goalie-sort="gaa">
                Г (ср)${arrow("gaa")}
              </th>
              <th class="sortable" data-goalie-sort="shutouts">
                SO${arrow("shutouts")}
              </th>
            </tr>
          </thead>

          <tbody>
            ${rows.map((player, index) => {
              const savePctg =
                player.savePctg === null ||
                player.savePctg === undefined
                  ? "—"
                  : Number(player.savePctg).toFixed(3);

              const gaa =
                player.gaa === null ||
                player.gaa === undefined
                  ? "—"
                  : Number(player.gaa).toFixed(2);

              const fullName =
                `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
                  .trim();

              return `
                <tr
                  class="clickable-row"
                  data-player-id="${escapeHtml(player.playerId || player.id || "")}"
                >
                  <td>
                    <div style="display:flex;align-items:center;gap:7px;min-width:155px;">
                      <span style="color:var(--silver-dim);font-family:'Roboto Mono',monospace;width:20px;">
                        ${index + 1}
                      </span>

                      <div>
                        <div>${escapeHtml(fullName || "Вратарь")}</div>
                        <div style="font-size:10px;color:var(--silver-dim);margin-top:2px;">
                          ${escapeHtml(player.teamAbbrev || "")}
                        </div>
                      </div>
                    </div>
                  </td>

                  <td class="num">${display(player.gamesPlayed)}</td>
                  <td class="num">${display(player.wins)}</td>
                  <td class="num">${display(player.losses)}</td>
                  <td class="num">${display(player.otLosses)}</td>
                  <td class="num">${escapeHtml(savePctg)}</td>
                  <td class="num">${escapeHtml(gaa)}</td>
                  <td class="num">${display(player.shutouts)}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;

    body.querySelectorAll("th[data-goalie-sort]").forEach(header => {
      header.addEventListener("click", event => {
        event.stopPropagation();

        const key = header.dataset.goalieSort;

        if (currentGoalieSortKey === key) {
          currentGoalieSortAsc = !currentGoalieSortAsc;
        } else {
          currentGoalieSortKey = key;
          currentGoalieSortAsc = false;
        }

        loadGoalieLeaders();
      });
    });

    body.querySelectorAll("tr.clickable-row").forEach(row => {
      row.addEventListener("click", () => {
        openPlayerDetail(row.dataset.playerId);
      });
    });
  } catch (error) {
    console.error("Ошибка загрузки вратарей:", error);

    body.innerHTML = `
      <div class="empty">
        Не удалось загрузить статистику вратарей
        <br>
        <small>${escapeHtml(error.message || "Ошибка загрузки")}</small>
      </div>
    `;
  }
}

async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
  const abbrev = getTeamAbbrev(teamAbbrev);
  const name = getTeamName(teamName) || abbrev;
  const logo = getTeamLogo(teamLogo);

  openDetail();

  if (!abbrev) {
    document.getElementById("detail-body").innerHTML =
      '<div class="empty">Не удалось определить клуб</div>';
    return;
  }

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams();

    if (seasonId) {
      params.set("season", seasonId);
    }

    const query = params.toString()
      ? `?${params.toString()}`
      : "";

    const url =
      `${API_BASE}/api/roster-stats/` +
      `${encodeURIComponent(abbrev)}${query}`;

    const res = await fetch(url, {
      cache: "no-store",
      headers: {
        Accept: "application/json"
      }
    });

    let data = null;

    try {
      data = await res.json();
    } catch (_) {
      data = null;
    }

    if (!res.ok) {
      throw new Error(data?.error || `HTTP ${res.status}`);
    }

    if (!data || typeof data !== "object") {
      throw new Error("Сервер вернул пустой ответ");
    }

    if (data.error) {
      throw new Error(data.error);
    }

    currentTeamFullData =
      data.data ||
      data.result ||
      data.roster ||
      data;

    currentTeamType = "regular";
    currentTeamSortKey = "points";
    currentTeamSortAsc = false;

    renderTeamTabsAndTables(abbrev, name, logo);
  } catch (error) {
    console.error("Ошибка загрузки состава клуба:", error);

    document.getElementById("detail-body").innerHTML = `
      <div class="empty">
        Не удалось загрузить состав команды
        <br>
        <small>${escapeHtml(error.message || "Ошибка сервера")}</small>
      </div>
    `;
  }
}

function normalizeTeamDataset(data) {
  if (!data || typeof data !== "object") {
    return {
      skaters: [],
      goalies: []
    };
  }

  const skaters =
    data.skaters ||
    data.skatersStats ||
    data.players ||
    data.forwards ||
    [];

  const goalies =
    data.goalies ||
    data.goaltenders ||
    data.goaliesStats ||
    [];

  return {
    skaters: Array.isArray(skaters) ? skaters : [],
    goalies: Array.isArray(goalies) ? goalies : []
  };
}

function buildTeamTablesBlock() {
  const container = document.getElementById("team-tables-container");

  if (!currentTeamFullData) {
    container.innerHTML = '<div class="empty">Данные отсутствуют</div>';
    return;
  }

  const rawDataset =
    currentTeamFullData[currentTeamType] ||
    currentTeamFullData[
      currentTeamType === "regular"
        ? "regularSeason"
        : "playoffs"
    ] ||
    currentTeamFullData;

  const dataset = normalizeTeamDataset(rawDataset);

  let skaters = [...dataset.skaters];
  let goalies = [...dataset.goalies];

  skaters.sort((a, b) => {
    let valueA;
    let valueB;

    if (currentTeamSortKey === "penaltyMinutes") {
      valueA = Number(a.penaltyMinutes ?? a.pim ?? 0);
      valueB = Number(b.penaltyMinutes ?? b.pim ?? 0);
    } else {
      valueA = Number(a[currentTeamSortKey] ?? 0);
      valueB = Number(b[currentTeamSortKey] ?? 0);
    }

    if (Number.isNaN(valueA)) valueA = 0;
    if (Number.isNaN(valueB)) valueB = 0;

    return currentTeamSortAsc
      ? valueA - valueB
      : valueB - valueA;
  });

  goalies.sort((a, b) => {
    return Number(b.gamesPlayed ?? 0) -
      Number(a.gamesPlayed ?? 0);
  });

  let html = '<div class="section-title">Полевые игроки</div>';

  if (!skaters.length) {
    html += '<div class="empty">Нет данных полевых игроков</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th class="sortable" data-sort="gamesPlayed">И</th>
              <th class="sortable" data-sort="goals">Г</th>
              <th class="sortable" data-sort="assists">П</th>
              <th class="sortable" data-sort="points">О</th>
              <th class="sortable" data-sort="plusMinus">+/-</th>
              <th class="sortable" data-sort="penaltyMinutes">Штр</th>
            </tr>
          </thead>

          <tbody>
            ${skaters.map(player => {
              const playerId =
                player.playerId ||
                player.id ||
                "";

              const fullName =
                `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
                  .trim() || "Игрок";

              const penaltyMinutes =
                player.penaltyMinutes ??
                player.pim ??
                0;

              return `
                <tr
                  class="clickable-row"
                  data-player-id="${escapeHtml(playerId)}"
                >
                  <td>${escapeHtml(fullName)}</td>
                  <td class="num">${val(player.gamesPlayed)}</td>
                  <td class="num">${val(player.goals)}</td>
                  <td class="num">${val(player.assists)}</td>
                  <td class="num">${val(player.points)}</td>
                  <td class="num">${val(player.plusMinus)}</td>
                  <td class="num">${val(penaltyMinutes)}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  html += '<div class="section-title">Вратари</div>';

  if (!goalies.length) {
    html += '<div class="empty">Нет данных вратарей</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th>И</th>
              <th>В</th>
              <th>П</th>
              <th>%ОБ</th>
              <th>ГКИ</th>
            </tr>
          </thead>

          <tbody>
            ${goalies.map(player => {
              const playerId =
                player.playerId ||
                player.id ||
                "";

              const fullName =
                `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
                  .trim() || "Вратарь";

              const savePct =
                player.savePercentage ??
                player.savePctg;

              const gaa =
                player.goalsAgainstAverage ??
                player.gaa;

              return `
                <tr
                  class="clickable-row"
                  data-player-id="${escapeHtml(playerId)}"
                >
                  <td>${escapeHtml(fullName)}</td>
                  <td class="num">${val(player.gamesPlayed)}</td>
                  <td class="num">${val(player.wins)}</td>
                  <td class="num">${val(player.losses)}</td>
                  <td class="num">
                    ${typeof savePct === "number"
                      ? savePct.toFixed(3)
                      : val(savePct)}
                  </td>
                  <td class="num">
                    ${typeof gaa === "number"
                      ? gaa.toFixed(2)
                      : val(gaa)}
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;

  container.querySelectorAll("tr.clickable-row").forEach(row => {
    row.addEventListener("click", () => {
      if (row.dataset.playerId) {
        openPlayerDetail(row.dataset.playerId);
      }
    });
  });

  container.querySelectorAll("th.sortable").forEach(header => {
    header.onclick = () => {
      const key = header.dataset.sort;

      if (currentTeamSortKey === key) {
        currentTeamSortAsc = !currentTeamSortAsc;
      } else {
        currentTeamSortKey = key;
        currentTeamSortAsc = false;
      }

      buildTeamTablesBlock();
    };
  });
}

const TEAM_STAT_LABELS = {
  sog: "Броски в створ",
  shotsOnGoal: "Броски в створ",
  faceoffWinningPctg: "Вбрасывания, %",
  faceoffWins: "Выигранные вбрасывания",
  powerPlay: "Большинство",
  powerPlayPctg: "Большинство, %",
  pim: "Штраф (мин)",
  penaltyMinutes: "Штраф (мин)",
  hits: "Силовые приёмы",
  blockedShots: "Заблокировано бросков",
  giveaways: "Потери шайбы",
  takeaways: "Отборы шайбы"
};

function formatPeriodsBreakdown(periods) {
  if (!Array.isArray(periods) || periods.length === 0) {
    return "";
  }

  return `(${periods.map(value => val(value, "0")).join(" / ")})`;
}

function renderTeamGameStats(
  rightRail,
  awayAbbrev,
  homeAbbrev,
  awayLogo,
  homeLogo
) {
  const teamStats = rightRail?.teamGameStats || [];

  let html = '<div class="section-title">Статистика команд</div>';

  if (!teamStats.length) {
    html += '<div class="empty">Статистика недоступна</div>';
    return html;
  }

  html += `
    <div class="teamstat-head">
      <div class="side">
        <img
          class="team-logo"
          src="${escapeHtml(awayLogo)}"
          alt=""
          onerror="this.style.display='none'"
        >
        <span>${escapeHtml(awayAbbrev)}</span>
      </div>

      <div></div>

      <div class="side right">
        <span>${escapeHtml(homeAbbrev)}</span>
        <img
          class="team-logo"
          src="${escapeHtml(homeLogo)}"
          alt=""
          onerror="this.style.display='none'"
        >
      </div>
    </div>
  `;

  teamStats.forEach(stat => {
    const category = stat.category;
    const label = TEAM_STAT_LABELS[category] || category;

    let awayValue = stat.awayValue;
    let homeValue = stat.homeValue;

    if (
      typeof awayValue === "number" &&
      (
        category === "faceoffWinningPctg" ||
        category === "powerPlayPctg"
      )
    ) {
      awayValue = `${(awayValue * 100).toFixed(1)}%`;
      homeValue = `${(homeValue * 100).toFixed(1)}%`;
    }

    const awayPeriods = formatPeriodsBreakdown(
      stat.awayPeriods || stat.away?.periods
    );

    const homePeriods = formatPeriodsBreakdown(
      stat.homePeriods || stat.home?.periods
    );

    html += `
      <div class="teamstat-row">
        <div class="val away">
          ${escapeHtml(val(awayValue))}
          ${awayPeriods
            ? `<span class="periods">${escapeHtml(awayPeriods)}</span>`
            : ""}
        </div>

        <div class="label">${escapeHtml(label)}</div>

        <div class="val home">
          ${escapeHtml(val(homeValue))}
          ${homePeriods
            ? `<span class="periods">${escapeHtml(homePeriods)}</span>`
            : ""}
        </div>
      </div>
    `;
  });

  return html;
}

async function openGameDetail(

  homeLogo

  const body = document.getElementById("detail-body");

  let html = `

      <img
        class="team-logo"
        src="${escapeHtml(awayLogo)}"
        alt=""
        onerror="this.style.visibility='hidden'"
      >

        <div class="title">
          ${escapeHtml(awayAbbrev)} — ${escapeHtml(homeAbbrev)}

      </div>

      <img
        class="team-logo"
        src="${escapeHtml(homeLogo)}"

        return;

      anyGoals = true;

      html += `
        <div class="period-label">
          ${escapeHtml(formatPeriodLabel(period.periodDescriptor))}
        </div>
      `;

      goals.forEach(goal => {
        const scorerName =
          `${nameStr(goal.firstName)} ${nameStr(goal.lastName)}`
            .trim();

        const assists = Array.isArray(goal.assists)
          ? goal.assists
              .map(assist =>
                `${nameStr(assist.firstName)} ${nameStr(assist.lastName)}`
              )
              .join(", ")
          : "";

        const teamAbbrevValue =
          goal.teamAbbrev?.default ||
          goal.teamAbbrev ||
          "";

        html += `
          <div class="goal-row">
            <div class="time">${escapeHtml(val(goal.timeInPeriod))}</div>

            <div class="desc">
              <div class="scorer">
                ${escapeHtml(scorerName)}
                (${escapeHtml(teamAbbrevValue)})
              </div>

              ${assists
                ? `<div class="assists">Передачи: ${escapeHtml(assists)}</div>`
                : ""}
            </div>

            <div class="scoreline">
              ${escapeHtml(val(goal.awayScore))} :
              ${escapeHtml(val(goal.homeScore))}
            </div>
          </div>
        `;
      });
    });

    if (!anyGoals) {
      html += '<div class="empty">Голов пока не было</div>';
    }

    html += renderTeamGameStats(
      rightRail,
      awayAbbrev,
      homeAbbrev,
      awayLogo,
      homeLogo
    );

    html += '<div class="section-title">Вратари</div>';

    const awayGoalies =
      box?.playerByGameStats?.awayTeam?.goalies || [];

    const homeGoalies =
      box?.playerByGameStats?.homeTeam?.goalies || [];

    const allGoalies = [
      ...awayGoalies,
      ...homeGoalies
    ];

    if (!allGoalies.length) {
      html += '<div class="empty">Нет данных о вратарях</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Вратарь</th>
                <th>Броски</th>
                <th>%ОБ</th>
                <th>Время</th>
                <th>ГКИ</th>
              </tr>
            </thead>
            <tbody>
      `;

      html += allGoalies.map(goalie => {
        let gaa = "—";

        if (typeof goalie.goalsAgainstAverage === "number") {
          gaa = goalie.goalsAgainstAverage.toFixed(2);
        } else if (goalie.goalsAgainst !== undefined) {
          gaa = Number(goalie.goalsAgainst).toFixed(2);
        }

        const goalieName =
          goalie.name?.default ||
          goalie.playerName?.default ||
          `${nameStr(goalie.firstName)} ${nameStr(goalie.lastName)}`
            .trim() ||
          "Вратарь";

        const savePct =
          typeof goalie.savePctg === "number"
            ? goalie.savePctg.toFixed(3)
            : val(goalie.savePctg);

        return `
          <tr>
            <td>${escapeHtml(goalieName)}</td>
            <td class="num">${escapeHtml(val(goalie.saveShotsAgainst))}</td>
            <td class="num">${escapeHtml(savePct)}</td>
            <td class="num">${escapeHtml(val(goalie.toi))}</td>
            <td class="num">${escapeHtml(gaa)}</td>
          </tr>
        `;
      }).join("");

      html += `
            </tbody>
          </table>
        </div>
      `;
    }
  } catch (error) {
    console.error("Ошибка загрузки деталей матча:", error);
    html += '<div class="empty">Не удалось загрузить подробности матча</div>';
  }

  body.innerHTML = html;
}

async function openPlayerDetail(playerId) {
  openDetail();

  const body = document.getElementById("detail-body");

  if (!playerId) {
    body.innerHTML =
      '<div class="empty">Не удалось определить игрока</div>';
    return;
  }

  try {
    const res = await fetch(
      `${API_BASE}/api/player/${encodeURIComponent(playerId)}`
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const player = await res.json();

    const fullName =
      `${nameStr(player.firstName)} ${nameStr(player.lastName)}`
        .trim();

    const birthPlace = [
      nameStr(player.birthCity),
      player.birthCountry
    ]
      .filter(Boolean)
      .join(", ");

    const position =
      player.positionCode ||
      player.position ||
      "";

    let draftText = "На драфте не выбран";

    if (player.draftDetails) {
      const draft = player.draftDetails;

      draftText =
        `Выбран командой «${draft.teamAbbrev || ""}» ` +
        `в ${draft.year} году ` +
        `(раунд ${draft.round}, общий номер ${draft.overallPick})`;
    }

    let html = `
      <div class="detail-head">
        <img
          class="headshot"
          src="${escapeHtml(player.headshot || "")}"
          alt=""
          onerror="this.style.visibility='hidden'"
        >

        <div>
          <div class="title">${escapeHtml(fullName || "Игрок")}</div>
          <div class="subtitle">
            ${escapeHtml(player.teamAbbrev || "")}
            · №${escapeHtml(val(player.sweaterNumber))}
            · ${escapeHtml(position)}
          </div>
        </div>

        <img
          class="team-logo"
          src="${escapeHtml(player.teamLogo || "")}"
          alt=""
          onerror="this.style.visibility='hidden'"
          style="margin-left:auto"
        >
      </div>

      <div class="section-title">Личные данные</div>

      <div class="bio-grid">
        <div>
          <div class="label">Дата рождения</div>
          <div class="value">${escapeHtml(val(player.birthDate))}</div>
        </div>

        <div>
          <div class="label">Место рождения</div>
          <div class="value">${escapeHtml(birthPlace || "—")}</div>
        </div>

        <div>
          <div class="label">Рост</div>
          <div class="value">
            ${player.heightInCentimeters
              ? `${player.heightInCentimeters} см`
              : "—"}
          </div>
        </div>

        <div>
          <div class="label">Вес</div>
          <div class="value">
            ${player.weightInKilograms
              ? `${player.weightInKilograms} кг`
              : "—"}
          </div>
        </div>

        <div>
          <div class="label">Хват</div>
          <div class="value">
            ${escapeHtml(val(player.shootsCatches))}
          </div>
        </div>

        <div style="grid-column:1 / -1;">
          <div class="label">Драфт</div>
          <div class="value">${escapeHtml(draftText)}</div>
        </div>
      </div>
    `;

    const subSeason =
      player.featuredStats?.regularSeason?.subSeason;

    html += '<div class="section-title">Статистика в текущем сезоне</div>';

    if (!subSeason) {
      html += `
        <div class="empty">
          Статистика текущего сезона отсутствует
        </div>
      `;
    } else if (position === "G") {
      const savePctg =
        typeof subSeason.savePctg === "number"
          ? subSeason.savePctg.toFixed(3)
          : "—";

      const gaa =
        typeof subSeason.goalsAgainstAverage === "number"
          ? subSeason.goalsAgainstAverage.toFixed(2)
          : "—";

      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>И</th>
                <th>В</th>
                <th>П</th>
                <th>%ОБ</th>
                <th>ГКИ</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td class="num">${escapeHtml(val(subSeason.gamesPlayed))}</td>
                <td class="num">${escapeHtml(val(subSeason.wins))}</td>
                <td class="num">${escapeHtml(val(subSeason.losses))}</td>
                <td class="num">${escapeHtml(savePctg)}</td>
                <td class="num">${escapeHtml(gaa)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>И</th>
                <th>Г</th>
                <th>П</th>
                <th>О</th>
                <th>+/-</th>
                <th>Штр</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td class="num">${escapeHtml(val(subSeason.gamesPlayed))}</td>
                <td class="num">${escapeHtml(val(subSeason.goals))}</td>
                <td class="num">${escapeHtml(val(subSeason.assists))}</td>
                <td class="num">${escapeHtml(val(subSeason.points))}</td>
                <td class="num">${escapeHtml(val(subSeason.plusMinus))}</td>
                <td class="num">${escapeHtml(val(subSeason.pim ?? subSeason.penaltyMinutes))}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    html += '<div class="section-title">История карьеры в NHL</div>';

    if (
      player.seasonTotals &&
      Array.isArray(player.seasonTotals)
    ) {
      const nhlHistory = player.seasonTotals.filter(
        season => season.leagueAbbrev === "NHL"
      );

      if (!nhlHistory.length) {
        html += `
          <div class="empty">
            История выступлений в NHL отсутствует
          </div>
        `;
      } else {
        const regularSeasonRows = nhlHistory.filter(
          season =>
            season.gameTypeId === 2 ||
            season.gameTypeCode === 2
        );

        const playoffRows = nhlHistory.filter(
          season =>
            season.gameTypeId === 3 ||
            season.gameTypeCode === 3
        );

        const columns = position === "G" ? 7 : 8;

        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Сезон</th>
                  <th>Клуб</th>
                  <th>И</th>
        `;

        if (position === "G") {
          html += `
                  <th>В</th>
                  <th>П</th>
                  <th>%ОБ</th>
                  <th>ГКИ</th>
          `;
        } else {
          html += `
                  <th>Г</th>
                  <th>П</th>
                  <th>О</th>
                  <th>+/-</th>
                  <th>Штр</th>
          `;
        }

        html += `
                </tr>
              </thead>
              <tbody>
        `;

        if (regularSeasonRows.length) {
          html += `
            <tr class="playoff-header-row">
              <td colspan="${columns}">
                Регулярный сезон
              </td>
            </tr>
          `;

          regularSeasonRows.forEach(season => {
            html += renderCareerRow(season, position);
          });
        }

        if (playoffRows.length) {
          html += `
            <tr class="playoff-header-row playoff-border">
              <td colspan="${columns}">
                Плей-офф
              </td>
            </tr>
          `;

          playoffRows.forEach(season => {
            html += renderCareerRow(season, position);
          });
        }

        html += `
              </tbody>
            </table>
          </div>
        `;
      }
    } else {
      html += `
        <div class="empty">
          История выступлений недоступна
        </div>
      `;
    }

    body.innerHTML = html;
  } catch (error) {
    console.error("Ошибка загрузки карточки игрока:", error);

    body.innerHTML =
      '<div class="empty">Не удалось загрузить карточку игрока</div>';
  }
}

function renderCareerRow(season, position) {
  const seasonName = String(season.season)
    .replace(/^(\d{4})(\d{4})$/, "$1-$2");

  const teamName =
    season.teamName?.default ||
    season.teamAbbrev ||
    "—";

  let html = `
    <tr>
      <td>${escapeHtml(seasonName)}</td>
      <td>${escapeHtml(teamName)}</td>
      <td class="num">${escapeHtml(val(season.gamesPlayed))}</td>
  `;

  if (position === "G") {
    const savePctg =
      season.savePctg ??
      season.savePercentage;

    const gaa =
      season.goalsAgainstAverage ??
      season.gaa;

    html += `
      <td class="num">${escapeHtml(val(season.wins))}</td>
      <td class="num">${escapeHtml(val(season.losses))}</td>
      <td class="num">
        ${typeof savePctg === "number"
          ? savePctg.toFixed(3)
          : escapeHtml(val(savePctg))}
      </td>
      <td class="num">
        ${typeof gaa === "number"
          ? gaa.toFixed(2)
          : escapeHtml(val(gaa))}
      </td>
    `;
  } else {
    html += `
      <td class="num">${escapeHtml(val(season.goals))}</td>
      <td class="num">${escapeHtml(val(season.assists))}</td>
      <td class="num">${escapeHtml(val(season.points))}</td>
      <td class="num">${escapeHtml(val(season.plusMinus))}</td>
      <td class="num">
        ${escapeHtml(val(season.pim ?? season.penaltyMinutes))}
      </td>
    `;
  }

  html += "</tr>";
  return html;
}

buildSeasonOptions();
loadSchedule();
</script>
