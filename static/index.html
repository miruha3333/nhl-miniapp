<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NHL Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --surface: #161616;
    --surface-2: #232323;
    --silver: #E6E9EA;
    --silver-dim: #9CA3AA;
    --blue: #1F5FCE;
    --red: #C8102E;
    --border: #2C2C2C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--silver);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }

  header {
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--blue);
    background: linear-gradient(180deg, #141414 0%, var(--bg) 100%);
  }

  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--silver);
  }

  header h1 .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  header .sub { color: var(--silver-dim); font-size: 12px; }

  nav {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  nav button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 10px 8px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  nav button.active {
    color: #fff;
    background: var(--blue);
    border-color: var(--blue);
    font-weight: 700;
  }

  main { padding: 14px 16px 0; }

  /* Календарь */
  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0 14px;
  }
  .date-input { 
    background: transparent; border: 1px solid var(--border); color: var(--silver); 
    padding: 6px 12px; border-radius: 8px; font-family: 'Roboto Mono', monospace; 
    font-size: 14px; text-align: center; cursor: pointer; outline: none; width: 140px; 
  }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

  /* Явно задаём цвета для option — без этого на некоторых системах (включая
     Telegram WebView) выпадающий список рисуется системными цветами:
     белый фон + светлый текст, из-за чего пункты невозможно прочитать. */
  select.date-input { appearance: none; -webkit-appearance: none; }
  select.date-input option {
    background-color: #1A1A1A;
    color: #E6E9EA;
  }

  .date-row button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }

  /* Матчи */
  .game-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }

  .team { display: flex; align-items: center; gap: 10px; }
  .team.right { justify-content: flex-end; text-align: right; }
  .team .abbr { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }

  .team-logo { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }

  .score-box { text-align: center; min-width: 70px; border-radius: 10px; padding: 4px 6px; }
  .score-box.clickable { cursor: pointer; transition: background 0.15s; }
  .score-box.clickable:active { background: var(--surface-2); }

  .score-box .score { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 22px; color: var(--silver); }
  .score-box .status { font-size: 10px; color: var(--red); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* Липкая таблица (Standings) */
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; position: relative; border-radius: 12px; }
  .standings-table {
    display: grid;
    grid-template-columns: 24px 30px 110px repeat(8, 35px);
    min-width: 600px;
    align-items: center;
  }
  
  .sticky-col { position: sticky; background: var(--surface); z-index: 2; }
  .sticky-col-1 { left: 0; }
  .sticky-col-2 { left: 24px; }
  .sticky-col-3 { left: 54px; }
  
  .standings-head { display: contents; font-size: 10px; color: var(--silver-dim); text-transform: uppercase; }
  .standings-head .sticky-col { z-index: 3; }
  .standings-head > div { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: center; align-items: center; }
  .standings-head .sortable { cursor: pointer; text-decoration: underline dotted; color: var(--silver); transition: color 0.15s; }
  .standings-head .sortable:hover { color: #fff; }

  .standings-row { display: contents; cursor: pointer; }
  .standings-row:active > div { background: var(--surface-2) !important; }
  .standings-row > div { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: center; align-items: center; font-size: 13px; }
  .standings-row .name { justify-content: flex-start; padding-left: 5px; font-family: 'Oswald', sans-serif; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .standings-row .num, .standings-row .diff, .standings-row .pts { font-family: 'Roboto Mono', monospace; }
  .standings-row .num.sticky-col-1 { color: var(--silver-dim); }
  .standings-row .team-logo { width: 20px; height: 20px; }
  .standings-row .pts { font-weight: 700; color: var(--blue); }

  /* Игроки */
  .cat-row { display: flex; gap: 6px; margin-bottom: 12px; }

  .cat-row button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver-dim);
    padding: 8px 6px;
    border-radius: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cat-row button.active { color: #fff; background: var(--red); border-color: var(--red); font-weight: 700; }

  .player-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .player-row:active { background: var(--surface-2); }
  .player-row:last-child { border-bottom: none; }

  .player-row .rank { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); width: 20px; flex-shrink: 0; text-align: center; }
  .player-row .headshot { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--border); }
  .player-row .info { flex: 1; min-width: 0; }
  .player-row .pname { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-row .pteam { font-size: 11px; color: var(--silver-dim); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .player-row .pteam .team-logo { width: 16px; height: 16px; }
  .player-row .pvalue { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 20px; color: var(--blue); flex-shrink: 0; }


  .player-search {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .player-search input {
    flex: 1;
    min-width: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--silver);
    padding: 10px 12px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .player-search input:focus { border-color: var(--red); }
  .player-search button {
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    padding: 0 14px;
    border-radius: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result .sr-name {
    flex: 1;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }
  .search-result .sr-meta {
    font-size: 11px;
    color: var(--silver-dim);
  }
  .team-calendar-row {
    display: grid;
    grid-template-columns: 72px 42px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .team-calendar-row:last-child { border-bottom: none; }
  .team-calendar-date {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--silver-dim);
  }
  .team-calendar-opponent {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .team-calendar-opponent .team-logo { width: 24px; height: 24px; }
  .team-calendar-opponent .opp-name {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-calendar-location {
    font-size: 10px;
    color: var(--silver-dim);
  }
  .team-calendar-score {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    text-align: right;
    white-space: nowrap;
  }
  .team-calendar-score.win { color: var(--blue); }
  .team-calendar-score.loss { color: var(--red); }
  .team-calendar-month {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--silver-dim);
    margin: 18px 0 8px;
  }
  .team-calendar-month:first-child { margin-top: 0; }
  @media (max-width: 520px) {
    .team-calendar-row { grid-template-columns: 58px 32px 1fr auto; gap: 7px; }
    .team-calendar-location { display: none; }
  }

  .show-more {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--silver-dim);
    padding: 10px; border-radius: 10px; font-family: 'Oswald', sans-serif; font-size: 12px;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; margin-top: 10px;
  }

  .empty, .loading { text-align: center; color: var(--silver-dim); font-size: 13px; padding: 30px 0; grid-column: 1 / -1; }

  /* Карточки игроков "в центре внимания" — заполняют пустое пространство
     на вкладке "Матчи" в дни без игр */
  .spotlight-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--silver-dim);
    margin: 24px 0 12px;
  }

  .spotlight-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .spotlight-card:active { background: var(--surface-2); }

  .spotlight-headshot {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .spotlight-info { flex: 1; min-width: 0; }

  .spotlight-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .spotlight-team {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--silver-dim);
    margin-top: 4px;
  }
  .spotlight-team .team-logo { width: 16px; height: 16px; }

  .spotlight-rank {
    font-family: 'Roboto Mono', monospace;
    color: var(--silver-dim);
    width: 18px;
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
  }

  .spotlight-value {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    color: var(--blue);
    flex-shrink: 0;
  }
  .loading { font-family: 'Roboto Mono', monospace; }

  /* Детали матча/команды/игрока */
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
    color: var(--silver); padding: 8px 14px; border-radius: 10px; font-family: 'Oswald', sans-serif;
    font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; margin-bottom: 12px;
  }

  .detail-head-game { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-bottom: 14px; }
  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .detail-head img.team-logo, .detail-head-game img.team-logo { width: 48px; height: 48px; object-fit: contain; }
  .detail-head img.headshot { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface-2); border: 1px solid var(--border); }
  
  .detail-head .title, .detail-head-game .title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.03em; text-transform: uppercase; text-align: center; }
  .detail-head .subtitle, .detail-head-game .subtitle { font-size: 12px; color: var(--silver-dim); margin-top: 2px; text-align: center; }

  .section-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--silver-dim); margin: 16px 0 8px; }

  .bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; }
  .bio-grid .label { color: var(--silver-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .bio-grid .value { font-family: 'Oswald', sans-serif; font-weight: 600; }

  .stat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stat-table th, .stat-table td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  
  .stat-table th { color: var(--silver-dim); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  .stat-table th.sortable { cursor: pointer; text-decoration: underline dotted; color: var(--silver); }
  .stat-table td:first-child, .stat-table th:first-child { text-align: left; font-family: 'Oswald', sans-serif; font-weight: 600; }

  .stat-table tbody tr.clickable-row { cursor: pointer; }
  .stat-table tbody tr.clickable-row:active { background: var(--surface-2); }
  .stat-table tbody tr.playoff-header-row td { background: var(--surface-2); color: var(--silver); font-family: 'Oswald', sans-serif; font-weight: 700; text-align: left; padding: 6px 8px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .stat-table tbody tr.playoff-border { border-bottom: 3px solid var(--blue); }

  .stat-table .num { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); }
  .table-scroll { overflow-x: auto; }

  .goal-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .goal-row:last-child { border-bottom: none; }
  .goal-row .time { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); font-size: 12px; flex-shrink: 0; width: 46px; }
  .goal-row .desc { flex: 1; }
  .goal-row .scorer { font-family: 'Oswald', sans-serif; font-weight: 600; }
  .goal-row .assists { color: var(--silver-dim); font-size: 11px; margin-top: 2px; }
  .goal-row .scoreline { font-family: 'Roboto Mono', monospace; font-weight: 700; color: var(--blue); flex-shrink: 0; }

  .period-label { font-family: 'Roboto Mono', monospace; color: var(--silver-dim); font-size: 11px; text-transform: uppercase; margin: 10px 0 4px; }

  /* Заголовок группы (конференция/дивизион) в таблице */
  .group-header-row { display: contents; }
  .group-header-row > div {
    grid-column: 1 / -1;
    background: var(--surface-2);
    color: var(--silver);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Сетка плей-офф (bracket) */
  .bracket-wrap { margin-top: 16px; }
  .bracket-round-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--silver-dim);
    margin: 14px 0 8px;
  }
  .bracket-series {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .bracket-team-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
  }
  .bracket-team-row .bt-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
  }
  .bracket-team-row .bt-name img { width: 20px; height: 20px; object-fit: contain; }
  .bracket-team-row.winner .bt-name { color: var(--blue); }
  .bracket-team-row .bt-wins {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
  }

  /* Командная статистика матча: броски, хиты, вбрасывания, силовые приёмы, штраф */
  .teamstat-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .teamstat-head .team-logo { width: 26px; height: 26px; }
  .teamstat-head .side { display: flex; align-items: center; gap: 8px; }
  .teamstat-head .side.right { justify-content: flex-end; }

  .teamstat-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .teamstat-row:last-child { border-bottom: none; }

  .teamstat-row .val {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
  }
  .teamstat-row .val.away { text-align: left; }
  .teamstat-row .val.home { text-align: right; }

  .teamstat-row .periods {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--silver-dim);
    font-weight: 400;
    display: block;
    margin-top: 1px;
  }

  .teamstat-row .label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--silver-dim);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>NHL LIVE</h1>
  <div class="sub">Расписание, результаты, таблица и статистика NHL</div>
</header>

<nav id="main-nav">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Игроки</button>
</nav>

<main>
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <input type="date" id="date-picker" class="date-input">
      <button id="next-day">›</button>
    </div>
    <div id="games"><div class="loading">Загрузка...</div></div>
  </div>

  <div id="view-standings" style="display:none">
    <div class="cat-row">
      <button id="std-mode-all" class="active">Общая</button>
      <button id="std-mode-conf">По конференциям</button>
      <button id="std-mode-div">По дивизионам</button>
    </div>

    <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 10px 14px;">
      <span style="font-family:'Oswald',sans-serif; font-size:12px; color:var(--silver-dim); text-transform:uppercase; letter-spacing:0.04em;">Сезон</span>
      <select id="season-select" class="date-input" style="width:auto; flex:1;"></select>
    </div>

    <div class="card" style="padding: 0;">
      <div class="table-wrapper">
        <div class="standings-table">
          <div class="standings-head">
            <div class="sticky-col sticky-col-1"></div>
            <div class="sticky-col sticky-col-2"></div>
            <div class="sticky-col sticky-col-3"></div>
            <div class="sortable" data-sort="gamesPlayed">И</div>
            <div class="sortable" data-sort="wins">В</div>
            <div class="sortable" data-sort="otLosses">ОТ</div>
            <div class="sortable" data-sort="losses">П</div>
            <div class="sortable" data-sort="goalFor">ЗШ</div>
            <div class="sortable" data-sort="goalAgainst">ПШ</div>
            <div class="sortable" data-sort="goalDifferential">+/-</div>
            <div class="sortable" data-sort="points">О</div>
          </div>
          <div id="standings-body" style="display: contents;"><div class="loading">Загрузка...</div></div>
        </div>
      </div>
    </div>

    <div id="bracket-container"></div>
  </div>

  <div id="view-players" style="display:none">
    <div class="card">
      <div class="player-search">
        <input id="player-search-input" type="search" placeholder="Найти игрока..." autocomplete="off">
        <button id="player-search-button">Найти</button>
      </div>
      <div id="player-search-results" style="display:none"></div>
    </div>

    <div class="cat-row">
      <button data-cat="points" class="active">Очки</button>
      <button data-cat="goals">Голы</button>
      <button data-cat="assists">Передачи</button>
      <button data-cat="plusMinus">+/-</button>
    </div>
    <div class="card">
      <div id="players-body"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div id="view-detail" style="display:none">
    <button class="back-btn" id="back-btn">‹ Назад</button>
    <div id="detail-body"><div class="loading">Загрузка...</div></div>
  </div>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const API_BASE = "";

  let currentTeamFullData = null; 
  let currentTeamType = "regular"; 
  let currentTeamSortKey = "points"; 
  let currentTeamSortAsc = false;
  let currentTeamSchedule = null;
  let currentTeamScheduleLoaded = false;
  
  let currentStandingsData = [];
  let standingsSortKey = "points";
  let standingsSortAsc = false;
  let standingsViewMode = "all"; // all | conf | div
  let selectedSeasonEndDate = ""; // "" значит текущий сезон (now)
  let bracketLoadedOnce = false; // чтобы не дёргать bracket повторно при каждом переключении вкладки

  // Список сезонов загружается с backend через /api/seasons-list —
  // это реальные данные от NHL API (эндпоинт standings-season), включающие
  // точную дату окончания регулярного сезона (standingsEnd) для каждого года.
  // Больше никакого угадывания дат.
  async function buildSeasonOptions() {
    const select = document.getElementById("season-select");
    select.innerHTML = `<option value="">Загрузка сезонов...</option>`;

    try {
      const res = await fetch(`${API_BASE}/api/seasons-list`);
      const data = await res.json();
      const seasons = data?.seasons || [];

      if (seasons.length === 0) {
        select.innerHTML = `<option value="">Текущий сезон</option>`;
        return;
      }

      // Сезоны от API идут от старых к новым — разворачиваем, чтобы новые были сверху
      const sorted = [...seasons].sort((a, b) => b.id - a.id);

      let optionsHtml = `<option value="">Текущий сезон</option>`;
      sorted.forEach(s => {
        const startYear = String(s.id).slice(0, 4);
        const endYearShort = String(s.id).slice(6, 8);
        const label = `${startYear}-${endYearShort}`;
        // standingsEnd — точная дата окончания регулярного сезона от самого NHL API
        optionsHtml += `<option value="${s.standingsEnd}" data-start-year="${startYear}">${label}</option>`;
      });
      select.innerHTML = optionsHtml;
    } catch (e) {
      select.innerHTML = `<option value="">Текущий сезон</option>`;
    }

    select.addEventListener("change", () => {
      const opt = select.options[select.selectedIndex];
      selectedSeasonEndDate = opt.value;
      currentStandingsData = [];
      loadStandings();

      // Если выбран "Текущий сезон" (value="") — у него нет data-start-year,
      // вычисляем год начала текущего хоккейного сезона сами
      const isCurrentSeason = !opt.dataset.startYear;
      let startYear = opt.dataset.startYear;
      if (!startYear) {
        const now = new Date();
        startYear = String(now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1);
      }

      // playoff-bracket принимает год ЗАВЕРШЕНИЯ плей-офф (как на
      // nhl.com/playoffs/2026 для сезона 2025-26), а не год начала сезона.
      // Год завершения = год начала сезона + 1.
      const playoffYear = String(parseInt(startYear, 10) + 1);

      if (isCurrentSeason) {
        // Для текущего сезона проверяем, начался ли плей-офф вообще —
        // иначе показываем устаревшие или несуществующие данные
        const now = new Date();
        const playoffStartApprox = new Date(parseInt(playoffYear, 10), 3, 14);
        if (now >= playoffStartApprox) {
          loadPlayoffBracket(playoffYear);
        } else {
          const container = document.getElementById("bracket-container");
          container.innerHTML = `
            <div class="bracket-wrap">
              <div class="section-title">Сетка плей-офф</div>
              <div class="empty">Регулярный сезон ещё не завершён — плей-офф начнётся позже</div>
            </div>
          `;
        }
      } else {
        // Для прошлых сезонов плей-офф точно состоялся — грузим как обычно
        loadPlayoffBracket(playoffYear);
      }
    });
  }

  let lastMainTab = "schedule";
  let currentDate = new Date();
  let currentCat = "points";
  let currentLimit = 25;

  const datePicker = document.getElementById("date-picker");

  // Инициализация сортировки таблицы лиги
  document.querySelectorAll(".standings-head .sortable").forEach(th => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if (standingsSortKey === key) {
        standingsSortAsc = !standingsSortAsc;
      } else {
        standingsSortKey = key;
        standingsSortAsc = false;
      }
      renderStandings();
    };
  });

  document.getElementById("std-mode-all").onclick = () => setStandingsMode("all");
  document.getElementById("std-mode-conf").onclick = () => setStandingsMode("conf");
  document.getElementById("std-mode-div").onclick = () => setStandingsMode("div");

  function setStandingsMode(mode) {
    standingsViewMode = mode;
    document.getElementById("std-mode-all").classList.toggle("active", mode === "all");
    document.getElementById("std-mode-conf").classList.toggle("active", mode === "conf");
    document.getElementById("std-mode-div").classList.toggle("active", mode === "div");
    // Если данные ещё не загружены (например, режим переключили мгновенно
    // после открытия вкладки) — сначала загружаем, потом рисуем
    if (currentStandingsData.length === 0) {
      loadStandings();
    } else {
      renderStandings();
    }
  }

  buildSeasonOptions();

  function openDetail() {
    document.getElementById("view-schedule").style.display = "none";
    document.getElementById("view-standings").style.display = "none";
    document.getElementById("view-players").style.display = "none";
    document.getElementById("view-detail").style.display = "";
    document.getElementById("main-nav").style.display = "none";
    document.getElementById("detail-body").innerHTML = '<div class="loading">Загрузка...</div>';
    window.scrollTo(0, 0);
  }

  function nameStr(n) {
    if (!n) return "";
    if (typeof n === "string") return n;
    return n.default || "";
  }

  function val(v, fallback = "—") {
    return (v === undefined || v === null || v === "") ? fallback : v;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // Подпись периода с учётом типа: обычные периоды 1-3, затем овертайм (OT),
  // затем буллиты (SO). NHL API кодирует это в periodDescriptor.periodType,
  // номер периода (number) продолжает расти и для овертайма/буллитов,
  // поэтому нельзя ориентироваться только на number.
  function formatPeriodLabel(descriptor) {
    if (!descriptor) return "Период";
    const type = descriptor.periodType;
    const num = descriptor.number;

    if (type === "SO") return "Буллиты";
    if (type === "OT") {
      // В плей-офф овертаймов может быть несколько — отличаем их по number
      // относительно трёх основных периодов
      const otNumber = num && num > 3 ? num - 3 : 1;
      return otNumber > 1 ? `${otNumber}-й овертайм` : "Овертайм";
    }
    return num ? `${num}-й период` : "Период";
  }

  function switchTab(tab) {
    document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
    document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
    document.getElementById("tab-players").classList.toggle("active", tab === "players");

    document.getElementById("view-schedule").style.display = tab === "schedule" ? "" : "none";
    document.getElementById("view-standings").style.display = tab === "standings" ? "" : "none";
    document.getElementById("view-players").style.display = tab === "players" ? "" : "none";
    document.getElementById("view-detail").style.display = "none";
    document.getElementById("main-nav").style.display = "flex";

    lastMainTab = tab;
    if (tab === "standings") {
      loadStandings();
      // Сетку плей-офф показываем для текущего сезона, но только если
      // плей-офф объективно мог уже начаться (после середины апреля года
      // завершения плей-офф). playoff-bracket принимает год ЗАВЕРШЕНИЯ
      // плей-офф (как nhl.com/playoffs/2026 для сезона 2025-26), а не год
      // начала сезона — раньше мы передавали год начала, отсюда показывался
      // плей-офф прошлого цикла как актуальный.
      if (!bracketLoadedOnce) {
        const now = new Date();
        const currentSeasonStartYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
        const playoffYear = currentSeasonStartYear + 1;

        const playoffStartApprox = new Date(playoffYear, 3, 14); // 14 апреля года завершения плей-офф
        if (now >= playoffStartApprox) {
          loadPlayoffBracket(String(playoffYear));
        } else {
          const container = document.getElementById("bracket-container");
          container.innerHTML = `
            <div class="bracket-wrap">
              <div class="section-title">Сетка плей-офф</div>
              <div class="empty">Регулярный сезон ещё не завершён — плей-офф начнётся позже</div>
            </div>
          `;
        }
        bracketLoadedOnce = true;
      }
    }
    if (tab === "players") loadPlayers();
  }

  document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);
  document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
  document.getElementById("tab-standings").onclick = () => switchTab("standings");
  document.getElementById("tab-players").onclick = () => switchTab("players");

  // ----- РАЗДЕЛ МАТЧЕЙ -----
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  datePicker.addEventListener("change", (e) => {
    if (e.target.value) {
      currentDate = new Date(e.target.value);
      loadSchedule();
    }
  });

  async function loadSchedule() {
    const games = document.getElementById("games");
    games.innerHTML = '<div class="loading">Загрузка...</div>';
    datePicker.value = fmtDate(currentDate);

    try {
      const res = await fetch(`${API_BASE}/api/schedule?date=${fmtDate(currentDate)}`);
      const data = await res.json();
      const week = data.gameWeek || [];
      const day = week.find(d => d.date === fmtDate(currentDate));
      const list = day?.games || [];

      if (list.length === 0) {
        games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
        loadSpotlight();
        return;
      }
      games.innerHTML = list.map(renderGame).join("");

      games.querySelectorAll(".score-box.clickable").forEach(el => {
        el.addEventListener("click", () => openGameDetail(
          el.dataset.gameId, el.dataset.away, el.dataset.home, el.dataset.awayLogo, el.dataset.homeLogo
        ));
      });
    } catch (e) {
      games.innerHTML = '<div class="empty">Не удалось загрузить матчи</div>';
    }
  }

  // Заполняет пустое пространство в дни без матчей карточками игроков
  // "в центре внимания" — подборка от самого NHL API на основе недавних
  // результатов, с фото и краткой статистикой.
  // Заполняет пустое пространство в дни без матчей карточками лидеров лиги
  // по очкам — используем тот же эндпоинт /api/leaders, который уже точно
  // работает на вкладке "Игроки", поэтому структура данных надёжна.
  async function loadSpotlight() {
    const games = document.getElementById("games");
    try {
      const res = await fetch(`${API_BASE}/api/leaders/points?limit=6`);
      const data = await res.json();
      const players = data.points || [];

      if (!players.length) return;

      let html = '<div class="spotlight-title">Лидеры лиги по очкам</div>';
      html += players.map((p, i) => renderSpotlightCard(p, i + 1)).join("");
      games.insertAdjacentHTML("beforeend", html);

      games.querySelectorAll(".spotlight-card").forEach(el => {
        el.addEventListener("click", () => {
          if (el.dataset.playerId) openPlayerDetail(el.dataset.playerId);
        });
      });
    } catch (e) {
      // Если лидеры не загрузились — просто оставляем сообщение
      // "матчей нет" без дополнительной ошибки, это не критично
    }
  }

  function renderSpotlightCard(p, rank) {
    const name = `${nameStr(p.firstName)} ${nameStr(p.lastName)}`.trim() || "Игрок";
    const headshot = p.headshot || "";
    const teamAbbrev = p.teamAbbrev || "";
    const teamLogo = p.teamLogo || "";
    const playerId = p.id || "";

    return `
      <div class="spotlight-card" data-player-id="${playerId}">
        <div class="spotlight-rank">${rank}</div>
        <img class="spotlight-headshot" src="${headshot}" alt="" onerror="this.style.visibility='hidden'">
        <div class="spotlight-info">
          <div class="spotlight-name">${escapeHtml(name)}</div>
          <div class="spotlight-team">
            <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
            <span>${escapeHtml(teamAbbrev)}</span>
          </div>
        </div>
        <div class="spotlight-value">${p.value ?? ""}</div>
      </div>
    `;
  }

  function renderGame(g) {
    const away = g.awayTeam;
    const home = g.homeTeam;
    const state = g.gameState; 

    let status = "—";
    let awayScore = "";
    let homeScore = "";
    const started = !(state === "FUT" || state === "PRE");

    if (!started) {
      status = new Date(g.startTimeUTC).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    } else {
      status = (state === "LIVE" || state === "CRIT") ? "LIVE" : "Финал";
      awayScore = away.score ?? 0;
      homeScore = home.score ?? 0;
    }

    const scoreClass = started ? "score-box clickable" : "score-box";
    const dataAttrs = started ? `data-game-id="${g.id}" data-away="${away.abbrev}" data-home="${home.abbrev}" data-away-logo="${away.logo ?? ""}" data-home-logo="${home.logo ?? ""}"` : "";

    return `
      <div class="card">
        <div class="game-row">
          <div class="team">
            <img class="team-logo" src="${away.logo}" alt="" onerror="this.style.display='none'">
            <div class="abbr">${away.abbrev}</div>
          </div>
          <div class="${scoreClass}" ${dataAttrs}>
            <div class="score">${awayScore !== "" ? awayScore + " : " + homeScore : "vs"}</div>
            <div class="status">${status}</div>
          </div>
          <div class="team right">
            <div class="abbr">${home.abbrev}</div>
            <img class="team-logo" src="${home.logo}" alt="" onerror="this.style.display='none'">
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById("prev-day").onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadSchedule(); };
  document.getElementById("next-day").onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadSchedule(); };

  // ----- ТУРНИРНАЯ ТАБЛИЦА -----
  async function loadStandings() {
    const body = document.getElementById("standings-body");
    if (currentStandingsData.length === 0) {
      body.innerHTML = '<div class="loading">Загрузка...</div>';
      try {
        const url = selectedSeasonEndDate
          ? `${API_BASE}/api/standings-by-date/${selectedSeasonEndDate}`
          : `${API_BASE}/api/standings`;
        const res = await fetch(url);
        const data = await res.json();
        currentStandingsData = data.standings || [];
      } catch (e) {
        return body.innerHTML = '<div class="empty">Не удалось загрузить таблицу</div>';
      }
    }
    renderStandings();
  }

  function renderTeamRow(t, rank) {
    const gf = t.goalFor ?? 0;
    const ga = t.goalAgainst ?? 0;
    const diff = t.goalDifferential ?? (gf - ga);
    const formattedDiff = diff > 0 ? `+${diff}` : diff;
    const tName = t.teamName?.default || t.teamAbbrev?.default || t.teamAbbrev || "";

    return `
      <div class="standings-row" data-team="${t.teamAbbrev?.default || t.teamAbbrev || ""}" data-name="${escapeHtml(tName)}" data-logo="${t.teamLogo || ""}">
        <div class="num sticky-col sticky-col-1">${rank}</div>
        <div class="sticky-col sticky-col-2"><img class="team-logo" src="${t.teamLogo}" alt="" onerror="this.style.visibility='hidden'"></div>
        <div class="name sticky-col sticky-col-3">${t.teamAbbrev?.default || t.teamAbbrev || ""}</div>
        <div class="num">${t.gamesPlayed ?? 0}</div>
        <div class="num">${t.wins ?? 0}</div>
        <div class="num">${t.otLosses ?? 0}</div>
        <div class="num">${t.losses ?? 0}</div>
        <div class="num">${gf}</div>
        <div class="num">${ga}</div>
        <div class="diff" style="color: ${diff >= 0 ? '#2ecc71' : '#e74c3c'}">${formattedDiff}</div>
        <div class="pts">${t.points ?? 0}</div>
      </div>
    `;
  }

  function sortTeams(arr) {
    const sorted = [...arr];
    sorted.sort((a, b) => {
      let valA = a[standingsSortKey] ?? 0;
      let valB = b[standingsSortKey] ?? 0;

      if (standingsSortKey === 'goalDifferential') {
        valA = a.goalDifferential ?? ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));
        valB = b.goalDifferential ?? ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
      }

      return standingsSortAsc ? valA - valB : valB - valA;
    });
    return sorted;
  }

  function renderStandings() {
    const body = document.getElementById("standings-body");
    if (!currentStandingsData.length) {
       body.innerHTML = '<div class="empty">Нет данных</div>';
       return;
    }

    let html = "";

    if (standingsViewMode === "all") {
      const sorted = sortTeams(currentStandingsData);
      html = sorted.map((t, i) => renderTeamRow(t, i + 1)).join("");
    } else {
      const groupField = standingsViewMode === "conf" ? "conferenceName" : "divisionName";
      const hasGroupData = currentStandingsData.some(t => t[groupField]);

      if (!hasGroupData) {
        html = `<div class="group-header-row"><div>Для этого сезона данные о ${standingsViewMode === "conf" ? "конференциях" : "дивизионах"} отсутствуют</div></div>`;
        const sorted = sortTeams(currentStandingsData);
        html += sorted.map((t, i) => renderTeamRow(t, i + 1)).join("");
      } else {
        const groups = {};
        currentStandingsData.forEach(t => {
          const key = t[groupField] || "Без группы";
          if (!groups[key]) groups[key] = [];
          groups[key].push(t);
        });

        Object.keys(groups).sort().forEach(groupName => {
          const sorted = sortTeams(groups[groupName]);
          html += `<div class="group-header-row"><div>${escapeHtml(groupName)}</div></div>`;
          html += sorted.map((t, i) => renderTeamRow(t, i + 1)).join("");
        });
      }
    }

    body.innerHTML = html;

    body.querySelectorAll(".standings-row").forEach(el => {
      el.addEventListener("click", () => openTeamDetail(el.dataset.team, el.dataset.name, el.dataset.logo));
    });
  }

  // ----- ПЛЕЙ-ОФФ BRACKET -----
  // ВАЖНО: год для playoff-bracket — это год ЗАВЕРШЕНИЯ плей-офф (например,
  // плей-офф сезона 2025-26 называется "2026", как на nhl.com/playoffs/2026).
  // Раньше использовался год НАЧАЛА сезона, что показывало плей-офф
  // предыдущего цикла как актуальный.
  async function loadPlayoffBracket(playoffYear) {
    const container = document.getElementById("bracket-container");
    if (!playoffYear) {
      container.innerHTML = "";
      return;
    }

    container.innerHTML = '<div class="bracket-wrap"><div class="loading">Загрузка сетки плей-офф...</div></div>';

    try {
      const res = await fetch(`${API_BASE}/api/playoff-bracket/${playoffYear}`);
      const data = await res.json();

      // Подтверждено реальным ответом API: серии лежат прямо в data.series,
      // без обёртки rounds. Группируем их по номеру раунда сами.
      const seriesList = data?.series || [];

      if (!seriesList.length) {
        const topLevelKeys = data && typeof data === "object" ? Object.keys(data).join(", ") : "не объект";
        console.log("BRACKET DEBUG: top-level keys =", topLevelKeys, "full data:", data);
        container.innerHTML = `
          <div class="bracket-wrap">
            <div class="section-title">Сетка плей-офф</div>
            <div class="empty">Плей-офф для этого сезона недоступен или ещё не начался</div>
          </div>
        `;
        return;
      }

      // Группируем серии по раунду. Поле может называться round, roundNumber
      // или playoffRound в зависимости от сезона — пробуем все варианты.
      const roundsMap = {};
      seriesList.forEach(series => {
        const roundNum = series.round ?? series.roundNumber ?? series.playoffRound ?? 1;
        if (!roundsMap[roundNum]) roundsMap[roundNum] = [];
        roundsMap[roundNum].push(series);
      });

      const roundNames = {
        1: "1-й раунд",
        2: "2-й раунд (полуфинал конференции)",
        3: "Финал конференции",
        4: "Финал Кубка Стэнли"
      };

      let html = '<div class="bracket-wrap"><div class="section-title">Сетка плей-офф</div>';

      Object.keys(roundsMap).sort((a, b) => a - b).forEach(roundNum => {
        html += `<div class="bracket-round-title">${escapeHtml(roundNames[roundNum] || `Раунд ${roundNum}`)}</div>`;

        roundsMap[roundNum].forEach(series => {
          // Подтверждённые названия команд-участников серии: bottomSeed/topSeed
          // могут называться по-разному, пробуем известные варианты,
          // а также возможные top/bottom team объекты внутри series.
          const top = series.topSeedTeam || series.matchupTeams?.[0] || series.team1 || {};
          const bottom = series.bottomSeedTeam || series.matchupTeams?.[1] || series.team2 || {};
          const topWins = series.topSeedWins ?? series.matchupTeams?.[0]?.seriesWins ?? series.team1Wins ?? 0;
          const bottomWins = series.bottomSeedWins ?? series.matchupTeams?.[1]?.seriesWins ?? series.team2Wins ?? 0;
          const topIsWinner = topWins > bottomWins && (topWins === 4 || bottomWins === 4);
          const bottomIsWinner = bottomWins > topWins && (topWins === 4 || bottomWins === 4);

          const topAbbrev = top.abbrev || top.teamAbbrev?.default || top.placeName?.default || "TBD";
          const bottomAbbrev = bottom.abbrev || bottom.teamAbbrev?.default || bottom.placeName?.default || "TBD";
          const topLogo = top.logo || top.teamLogo || "";
          const bottomLogo = bottom.logo || bottom.teamLogo || "";

          html += `
            <div class="bracket-series">
              <div class="bracket-team-row ${topIsWinner ? 'winner' : ''}">
                <div class="bt-name">
                  <img src="${topLogo}" alt="" onerror="this.style.display='none'">
                  <span>${escapeHtml(topAbbrev)}</span>
                </div>
                <div class="bt-wins">${topWins}</div>
              </div>
              <div class="bracket-team-row ${bottomIsWinner ? 'winner' : ''}">
                <div class="bt-name">
                  <img src="${bottomLogo}" alt="" onerror="this.style.display='none'">
                  <span>${escapeHtml(bottomAbbrev)}</span>
                </div>
                <div class="bt-wins">${bottomWins}</div>
              </div>
            </div>
          `;
        });
      });
      html += "</div>";

      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div class="bracket-wrap"><div class="empty">Не удалось загрузить сетку плей-офф</div></div>';
    }
  }

  // ----- ПОИСК ИГРОКА -----
  async function searchPlayers() {
    const input = document.getElementById("player-search-input");
    const results = document.getElementById("player-search-results");
    const query = input.value.trim();

    if (query.length < 2) {
      results.style.display = "none";
      results.innerHTML = "";
      return;
    }

    results.style.display = "block";
    results.innerHTML = '<div class="loading" style="padding:16px 0">Поиск...</div>';

    try {
      const res = await fetch(`${API_BASE}/api/search/player?q=${encodeURIComponent(query)}`);
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        results.innerHTML = '<div class="empty" style="padding:16px 0">Игрок не найден</div>';
        return;
      }

      results.innerHTML = data.map(p => {
        const name = typeof p.name === "string" ? p.name : (p.name?.default || "Игрок");
        const team = p.teamAbbrev || "";
        const position = p.positionCode || "";
        return `
          <div class="search-result" data-player-id="${p.playerId}">
            <div class="sr-name">${escapeHtml(name)}</div>
            <div class="sr-meta">${escapeHtml([team, position].filter(Boolean).join(" · "))}</div>
          </div>
        `;
      }).join("");

      results.querySelectorAll(".search-result").forEach(el => {
        el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
      });
    } catch (e) {
      results.innerHTML = '<div class="empty" style="padding:16px 0">Не удалось выполнить поиск</div>';
    }
  }

  document.getElementById("player-search-button").onclick = searchPlayers;
  document.getElementById("player-search-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") searchPlayers();
  });

  // ----- ЛИДЕРЫ ЛИГИ -----
  async function loadPlayers() {
    const body = document.getElementById("players-body");
    body.innerHTML = '<div class="loading">Загрузка...</div>';

    try {
      const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
      const url = seasonId
        ? `${API_BASE}/api/leaders/${currentCat}?limit=${currentLimit}&season=${seasonId}`
        : `${API_BASE}/api/leaders/${currentCat}?limit=${currentLimit}`;
      const res = await fetch(url);
      const data = await res.json();
      const list = data[currentCat] || [];

      if (list.length === 0) {
        body.innerHTML = '<div class="empty">Нет данных игроков</div>';
        return;
      }

      body.innerHTML = list.map((p, i) => `
        <div class="player-row" data-player-id="${p.id}">
          <div class="rank">${i + 1}</div>
          <img class="headshot" src="${p.headshot}" alt="" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="pname">${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</div>
            <div class="pteam">
              <img class="team-logo" src="${p.teamLogo}" alt="" onerror="this.style.display='none'">
              ${p.teamAbbrev || ""}
            </div>
          </div>
          <div class="pvalue">${p.value ?? ""}</div>
        </div>
      `).join("");

      if (list.length >= currentLimit && currentLimit < 50) {
        body.insertAdjacentHTML("beforeend", '<button class="show-more" id="show-more-players">Показать больше</button>');
        document.getElementById("show-more-players").onclick = () => { currentLimit = 50; loadPlayers(); };
      }

      body.querySelectorAll(".player-row").forEach(el => {
        el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
      });
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить лидеров</div>';
    }
  }

  // Важно: исключаем кнопки std-mode-* (общая/конференции/дивизионы) из этого
  // общего обработчика — они тоже лежат в .cat-row, но имеют свою собственную
  // логику (setStandingsMode). Без этого исключения общий обработчик
  // перезаписывал .onclick кнопок таблицы, и переключение режима ломалось:
  // кнопка подсвечивалась активной, но реальный режим не менялся.
  document.querySelectorAll(".cat-row button:not(#std-mode-all):not(#std-mode-conf):not(#std-mode-div)").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".cat-row button:not(#std-mode-all):not(#std-mode-conf):not(#std-mode-div)").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      currentLimit = 25;
      loadPlayers();
    };
  });

  // ----- ДЕТАЛИ КЛУБА -----
  // Вычисляет season ID в формате YYYYYYYY (например 20232024) из даты конца
  // сезона. Дата вида "2024-04-18" означает сезон 2023-2024, то есть начало —
  // на год раньше года из даты.
  function seasonIdFromEndDate(endDate) {
    if (!endDate) return null;
    const endYear = parseInt(endDate.slice(0, 4), 10);
    const startYear = endYear - 1;
    return `${startYear}${endYear}`;
  }

  async function openTeamDetail(teamAbbrev, teamName, teamLogo) {
    openDetail();
    try {
      const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
      const url = seasonId
        ? `${API_BASE}/api/roster-stats/${teamAbbrev}?season=${seasonId}`
        : `${API_BASE}/api/roster-stats/${teamAbbrev}`;
      const res = await fetch(url);
      currentTeamFullData = await res.json();

      currentTeamType = "regular"; 
      currentTeamSortKey = "points";
      currentTeamSortAsc = false;
      currentTeamSchedule = null;
      currentTeamScheduleLoaded = false;

      renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo);
    } catch (e) {
      document.getElementById("detail-body").innerHTML = '<div class="empty">Не удалось загрузить состав команды</div>';
    }
  }

  function renderTeamTabsAndTables(teamAbbrev, teamName, teamLogo) {
    const body = document.getElementById("detail-body");
    body.innerHTML = `
      <div class="detail-head">
        <img class="team-logo" src="${teamLogo}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="title">${escapeHtml(teamName || teamAbbrev)}</div>
          <div class="subtitle">${teamAbbrev}</div>
        </div>
      </div>
      <div class="cat-row" style="margin-top: 14px;">
        <button id="btn-team-reg" class="active">Регулярный сезон</button>
        <button id="btn-team-po">Плей-офф</button>
        <button id="btn-team-calendar">Календарь</button>
      </div>
      <div id="team-tables-container"></div>
    `;

    document.getElementById("btn-team-reg").onclick = () => {
      currentTeamType = "regular";
      document.getElementById("btn-team-reg").classList.add("active");
      document.getElementById("btn-team-po").classList.remove("active");
      document.getElementById("btn-team-calendar").classList.remove("active");
      buildTeamTablesBlock();
    };

    document.getElementById("btn-team-po").onclick = () => {
      currentTeamType = "playoff";
      document.getElementById("btn-team-po").classList.add("active");
      document.getElementById("btn-team-reg").classList.remove("active");
      document.getElementById("btn-team-calendar").classList.remove("active");
      buildTeamTablesBlock();
    };

    document.getElementById("btn-team-calendar").onclick = () => {
      document.getElementById("btn-team-reg").classList.remove("active");
      document.getElementById("btn-team-po").classList.remove("active");
      document.getElementById("btn-team-calendar").classList.add("active");
      loadTeamCalendar(teamAbbrev);
    };

    buildTeamTablesBlock();
  }

  function teamScheduleSeason() {
    return seasonIdFromEndDate(selectedSeasonEndDate) || "now";
  }

  function teamScheduleGameState(game) {
    const state = game.gameState || game.gameScheduleState || "";
    if (state === "OFF") return "Завершён";
    if (state === "LIVE" || state === "CRIT") return "LIVE";
    if (state === "FUT" || state === "PRE") return "Предстоящий";
    return state || "";
  }

  function renderTeamCalendar(teamAbbrev, data) {
    const container = document.getElementById("team-tables-container");
    const games = Array.isArray(data?.games) ? data.games : [];

    if (!games.length) {
      container.innerHTML = '<div class="empty">Календарь команды пуст</div>';
      return;
    }

    const sorted = [...games].sort((a, b) => String(a.gameDate || "").localeCompare(String(b.gameDate || "")));
    let html = "";
    let currentMonth = "";

    sorted.forEach(game => {
      const dateStr = game.gameDate || (game.startTimeUTC ? game.startTimeUTC.slice(0, 10) : "");
      const monthKey = dateStr.slice(0, 7);
      if (monthKey !== currentMonth) {
        currentMonth = monthKey;
        const monthDate = dateStr ? new Date(`${dateStr}T12:00:00`) : null;
        const monthName = monthDate && !Number.isNaN(monthDate.getTime())
          ? monthDate.toLocaleDateString("ru-RU", { month: "long", year: "numeric" })
          : monthKey;
        html += `<div class="team-calendar-month">${escapeHtml(monthName)}</div>`;
      }

      const isHome = game.homeTeam?.abbrev === teamAbbrev;
      const opponent = isHome ? (game.awayTeam || {}) : (game.homeTeam || {});
      const opponentAbbrev = opponent.abbrev || opponent.teamAbbrev || "—";
      const opponentName = opponent.placeName?.default || opponent.commonName?.default || opponent.name?.default || opponentAbbrev;
      const opponentLogo = opponent.logo || opponent.teamLogo || "";
      const dateLabel = dateStr ? new Date(`${dateStr}T12:00:00`).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) : "—";
      const venueLabel = isHome ? "Дома" : "В гостях";
      const state = game.gameState || game.gameScheduleState || "";
      const awayScore = game.awayTeam?.score;
      const homeScore = game.homeTeam?.score;
      let scoreHtml = teamScheduleGameState(game);
      let resultClass = "";

      if (state === "OFF" && awayScore != null && homeScore != null) {
        const teamScore = isHome ? homeScore : awayScore;
        const oppScore = isHome ? awayScore : homeScore;
        scoreHtml = `${teamScore} : ${oppScore}`;
        if (teamScore > oppScore) resultClass = "win";
        if (teamScore < oppScore) resultClass = "loss";
      }

      html += `
        <div class="team-calendar-row">
          <div class="team-calendar-date">${dateLabel}</div>
          <div class="team-calendar-opponent">
            <img class="team-logo" src="${opponentLogo}" alt="" onerror="this.style.display='none'">
          </div>
          <div>
            <div class="team-calendar-opponent">
              <div class="opp-name">${escapeHtml(opponentName)} (${escapeHtml(opponentAbbrev)})</div>
            </div>
            <div class="team-calendar-location">${venueLabel}</div>
          </div>
          <div class="team-calendar-score ${resultClass}">${escapeHtml(scoreHtml)}</div>
        </div>
      `;
    });

    container.innerHTML = `<div class="card" style="padding:12px 14px;">${html}</div>`;
  }

  async function loadTeamCalendar(teamAbbrev) {
    const container = document.getElementById("team-tables-container");
    container.innerHTML = '<div class="loading">Загрузка календаря...</div>';

    try {
      if (!currentTeamScheduleLoaded) {
        const season = teamScheduleSeason();
        const res = await fetch(`${API_BASE}/api/team-schedule/${teamAbbrev}?season=${encodeURIComponent(season)}`);
        currentTeamSchedule = await res.json();
        currentTeamScheduleLoaded = true;
      }
      renderTeamCalendar(teamAbbrev, currentTeamSchedule);
    } catch (e) {
      container.innerHTML = '<div class="empty">Не удалось загрузить календарь команды</div>';
    }
  }

  function buildTeamTablesBlock() {
    const container = document.getElementById("team-tables-container");
    if (!currentTeamFullData || !currentTeamFullData[currentTeamType]) {
      container.innerHTML = '<div class="empty">Данные отсутствуют</div>';
      return;
    }

    const dataset = currentTeamFullData[currentTeamType];
    let filteredSkaters = [...(dataset.skaters || [])];
    let filteredGoalies = [...(dataset.goalies || [])];

    // Сортировка с поддержкой альтернативных полей
    filteredSkaters.sort((a, b) => {
      let valA = a[currentTeamSortKey];
      let valB = b[currentTeamSortKey];
      
      if (currentTeamSortKey === "penaltyMinutes") {
        valA = a.penaltyMinutes ?? a.pim ?? 0;
        valB = b.penaltyMinutes ?? b.pim ?? 0;
      } else {
        valA = valA ?? 0;
        valB = valB ?? 0;
      }
      return currentTeamSortAsc ? valA - valB : valB - valA;
    });

    filteredGoalies.sort((a, b) => (b.gamesPlayed ?? 0) - (a.gamesPlayed ?? 0));

    let html = '<div class="section-title">Полевые игроки</div>';
    if (filteredSkaters.length === 0) {
      html += '<div class="empty">Нет данных полевых игроков</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Игрок</th>
                <th class="sortable" data-sort="gamesPlayed">И</th>
                <th class="sortable" data-sort="goals">Г</th>
                <th class="sortable" data-sort="assists">П</th>
                <th class="sortable" data-sort="points">О</th>
                <th class="sortable" data-sort="plusMinus">+/-</th>
                <th class="sortable" data-sort="penaltyMinutes">Штр</th>
              </tr>
            </thead>
            <tbody>
      `;
      html += filteredSkaters.map(p => {
        const pMinutes = p.penaltyMinutes ?? p.pim ?? 0;
        return `
          <tr class="clickable-row" data-player-id="${p.playerId}">
            <td>${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</td>
            <td class="num">${val(p.gamesPlayed)}</td>
            <td class="num">${val(p.goals)}</td>
            <td class="num">${val(p.assists)}</td>
            <td class="num">${val(p.points)}</td>
            <td class="num">${val(p.plusMinus)}</td>
            <td class="num">${val(pMinutes)}</td>
          </tr>
        `;
      }).join("");
      html += "</tbody></table></div>";
    }

    html += '<div class="section-title">Вратари</div>';
    if (filteredGoalies.length === 0) {
      html += '<div class="empty">Нет данных вратарей</div>';
    } else {
      html += `
        <div class="table-scroll">
          <table class="stat-table">
            <thead>
              <tr>
                <th>Игрок</th><th>И</th><th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>
              </tr>
            </thead>
            <tbody>
      `;
      html += filteredGoalies.map(p => {
        const svPct = p.savePercentage ?? p.savePctg;
        const gaa = p.goalsAgainstAverage ?? p.gaa;
        return `
          <tr class="clickable-row" data-player-id="${p.playerId}">
            <td>${escapeHtml(nameStr(p.firstName))} ${escapeHtml(nameStr(p.lastName))}</td>
            <td class="num">${val(p.gamesPlayed)}</td>
            <td class="num">${val(p.wins)}</td>
            <td class="num">${val(p.losses)}</td>
            <td class="num">${typeof svPct === 'number' ? svPct.toFixed(3) : val(svPct)}</td>
            <td class="num">${typeof gaa === 'number' ? gaa.toFixed(2) : val(gaa)}</td>
          </tr>
        `;
      }).join("");
      html += "</tbody></table></div>";
    }

    container.innerHTML = html;

    container.querySelectorAll("tr.clickable-row").forEach(el => {
      el.addEventListener("click", () => openPlayerDetail(el.dataset.playerId));
    });

    container.querySelectorAll("th.sortable").forEach(th => {
      th.onclick = () => {
        const key = th.dataset.sort;
        if (currentTeamSortKey === key) {
          currentTeamSortAsc = !currentTeamSortAsc;
        } else {
          currentTeamSortKey = key;
          currentTeamSortAsc = false;
        }
        buildTeamTablesBlock();
      };
    });
  }

  // ----- ДЕТАЛИ МАТЧА -----

  // Категории командной статистики из right-rail и их русские подписи.
  // Если NHL API вернёт другую категорию — она покажется с тем именем, что прислал API,
  // строка не потеряется.
  const TEAM_STAT_LABELS = {
    sog: "Броски в створ",
    shotsOnGoal: "Броски в створ",
    faceoffWinningPctg: "Вбрасывания, %",
    faceoffWins: "Выигранные вбрасывания",
    powerPlay: "Большинство",
    powerPlayPctg: "Большинство, %",
    pim: "Штраф (мин)",
    penaltyMinutes: "Штраф (мин)",
    hits: "Силовые приёмы",
    blockedShots: "Заблокировано бросков",
    giveaways: "Потери шайбы",
    takeaways: "Отборы шайбы",
  };

  function formatPeriodsBreakdown(periods) {
    if (!periods || !Array.isArray(periods) || periods.length === 0) return "";
    return "(" + periods.map(p => val(p, "0")).join(" / ") + ")";
  }

  function renderTeamGameStats(rightRail, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
    const teamStats = rightRail?.teamGameStats || [];

    let html = '<div class="section-title">Статистика команд</div>';

    if (!teamStats || teamStats.length === 0) {
      html += '<div class="empty">Статистика недоступна</div>';
      return html;
    }

    html += `
      <div class="teamstat-head">
        <div class="side">
          <img class="team-logo" src="${awayLogo}" alt="" onerror="this.style.display='none'">
          <span>${awayAbbrev}</span>
        </div>
        <div></div>
        <div class="side right">
          <span>${homeAbbrev}</span>
          <img class="team-logo" src="${homeLogo}" alt="" onerror="this.style.display='none'">
        </div>
      </div>
    `;

    teamStats.forEach(stat => {
      const category = stat.category;
      const label = TEAM_STAT_LABELS[category] || category;

      let awayVal = stat.awayValue;
      let homeVal = stat.homeValue;

      if (typeof awayVal === "number" && (category === "faceoffWinningPctg" || category === "powerPlayPctg")) {
        awayVal = (awayVal * 100).toFixed(1) + "%";
        homeVal = (homeVal * 100).toFixed(1) + "%";
      }

      const awayPeriods = formatPeriodsBreakdown(stat.awayPeriods || stat.away?.periods);
      const homePeriods = formatPeriodsBreakdown(stat.homePeriods || stat.home?.periods);

      html += `
        <div class="teamstat-row">
          <div class="val away">${val(awayVal)}${awayPeriods ? `<span class="periods">${awayPeriods}</span>` : ""}</div>
          <div class="label">${escapeHtml(label)}</div>
          <div class="val home">${val(homeVal)}${homePeriods ? `<span class="periods">${homePeriods}</span>` : ""}</div>
        </div>
      `;
    });

    return html;
  }

  async function openGameDetail(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
    openDetail();
    const body = document.getElementById("detail-body");

    let html = `
      <div class="detail-head-game">
        <img class="team-logo" src="${awayLogo}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="title">${awayAbbrev} — ${homeAbbrev}</div>
          <div class="subtitle">Статистика матча</div>
        </div>
        <img class="team-logo" src="${homeLogo}" alt="" onerror="this.style.visibility='hidden'">
      </div>
    `;

    try {
      const [landingRes, rightRailRes, boxRes] = await Promise.all([
        fetch(`${API_BASE}/api/score/${gameId}`),
        fetch(`${API_BASE}/api/right-rail/${gameId}`),
        fetch(`${API_BASE}/api/boxscore/${gameId}`),
      ]);
      const landing = await landingRes.json();
      const rightRail = await rightRailRes.json();
      const box = await boxRes.json();

      const scoring = landing?.summary?.scoring || [];
      html += '<div class="section-title">Голы</div>';

      let anyGoals = false;
      scoring.forEach(period => {
        const goals = period.goals || [];
        if (goals.length === 0) return;
        anyGoals = true;
        html += `<div class="period-label">${formatPeriodLabel(period.periodDescriptor)}</div>`;
        goals.forEach(goal => {
          const scorerName = `${nameStr(goal.firstName)} ${nameStr(goal.lastName)}`;
          const assistsArr = [];
          if (goal.assists && Array.isArray(goal.assists)) {
            goal.assists.forEach(ast => { assistsArr.push(`${nameStr(ast.firstName)} ${nameStr(ast.lastName)}`); });
          }
          const assists = assistsArr.join(", ");

          html += `
            <div class="goal-row">
              <div class="time">${val(goal.timeInPeriod)}</div>
              <div class="desc">
                <div class="scorer">${escapeHtml(scorerName)} (${escapeHtml(goal.teamAbbrev?.default || goal.teamAbbrev || "")})</div>
                ${assists ? `<div class="assists">Передачи: ${escapeHtml(assists)}</div>` : ""}
              </div>
              <div class="scoreline">${val(goal.awayScore)} : ${val(goal.homeScore)}</div>
            </div>
          `;
        });
      });
      if (!anyGoals) html += '<div class="empty">Голов пока не было</div>';

      // Статистика команд (броски, хиты, вбрасывания, силовые приёмы, штраф —
      // общий показатель, в скобках разбивка по периодам)
      html += renderTeamGameStats(rightRail, awayAbbrev, homeAbbrev, awayLogo, homeLogo);

      // Вратари — данные берутся из boxscore, а не right-rail
      html += '<div class="section-title">Вратари</div>';
      const awayGoalies = box?.playerByGameStats?.awayTeam?.goalies || [];
      const homeGoalies = box?.playerByGameStats?.homeTeam?.goalies || [];
      const allGoalies = [...awayGoalies, ...homeGoalies];

      if (allGoalies.length === 0) {
        html += '<div class="empty">Нет данных о вратарях</div>';
      } else {
        html += `
          <div class="table-scroll">
            <table class="stat-table">
              <thead>
                <tr>
                  <th>Вратарь</th><th>Броски</th><th>%ОБ</th><th>Время</th><th>ГКИ</th>
                </tr>
              </thead>
              <tbody>
        `;
        html += allGoalies.map(gk => {
          let gaa = "—";
          if (typeof gk.goalsAgainstAverage === 'number') {
            gaa = gk.goalsAgainstAverage.toFixed(2);
          } else if (gk.goalsAgainst !== undefined) {
            gaa = Number(gk.goalsAgainst).toFixed(2);
          }

          let gName = gk.name?.default || gk.playerName?.default || `${nameStr(gk.firstName)} ${nameStr(gk.lastName)}`.trim() || "Вратарь";

          return `
            <tr>
              <td>${escapeHtml(gName)}</td>
              <td class="num">${val(gk.saveShotsAgainst)}</td>
              <td class="num">${typeof gk.savePctg === 'number' ? gk.savePctg.toFixed(3) : val(gk.savePctg)}</td>
              <td class="num">${val(gk.toi)}</td>
              <td class="num">${gaa}</td>
            </tr>
          `;
        }).join("");
        html += "</tbody></table></div>";
      }

    } catch (e) {
      html += '<div class="empty">Не удалось загрузить подробности матча</div>';
    }

    body.innerHTML = html;
  }

  // ----- ДЕТАЛИ ИГРОКА И ЕГО КАРЬЕРА -----
  async function openPlayerDetail(playerId) {
    openDetail();
    const body = document.getElementById("detail-body");

    try {
      const res = await fetch(`${API_BASE}/api/player/${playerId}`);
      const p = await res.json();

      const name = `${nameStr(p.firstName)} ${nameStr(p.lastName)}`;
      const birthPlace = [nameStr(p.birthCity), p.birthCountry].filter(Boolean).join(", ");
      const pos = p.positionCode || p.position || "";

      let draftText = "На драфте не выбран";
      if (p.draftDetails) {
        const d = p.draftDetails;
        draftText = `Выбран командой «${d.teamAbbrev || ""}» в ${d.year} году (раунд ${d.round}, общий номер ${d.overallPick})`;
      }

      let html = `
        <div class="detail-head">
          <img class="headshot" src="${p.headshot || ""}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="title">${escapeHtml(name)}</div>
            <div class="subtitle">${escapeHtml(p.teamAbbrev || "")} · №${val(p.sweaterNumber)} · ${escapeHtml(pos)}</div>
          </div>
          <img class="team-logo" src="${p.teamLogo || ""}" alt="" onerror="this.style.visibility='hidden'" style="margin-left:auto">
        </div>

        <div class="section-title">Личные данные</div>
        <div class="bio-grid">
          <div><div class="label">Дата рождения</div><div class="value">${val(p.birthDate)}</div></div>
          <div><div class="label">Место рождения</div><div class="value">${escapeHtml(birthPlace) || "—"}</div></div>
          <div><div class="label">Рост</div><div class="value">${p.heightInCentimeters ? p.heightInCentimeters + " см" : "—"}</div></div>
          <div><div class="label">Вес</div><div class="value">${p.weightInKilograms ? p.weightInKilograms + " кг" : "—"}</div></div>
          <div><div class="label">Хват</div><div class="value">${val(p.shootsCatches)}</div></div>
          <div style="grid-column: 1 / -1;"><div class="label">Драфт</div><div class="value">${escapeHtml(draftText)}</div></div>
        </div>
      `;

      const subSeason = p.featuredStats?.regularSeason?.subSeason;
      html += '<div class="section-title">Статистика в текущем сезоне</div>';

      if (!subSeason) {
        html += '<div class="empty">Статистика текущего сезона отсутствует</div>';
      } else if (pos === "G") {
        html += `
          <div class="table-scroll"><table class="stat-table"><thead><tr>
            <th>И</th><th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>
          </tr></thead><tbody><tr>
            <td class="num">${val(subSeason.gamesPlayed)}</td>
            <td class="num">${val(subSeason.wins)}</td>
            <td class="num">${val(subSeason.losses)}</td>
            <td class="num">${subSeason.savePctg !== undefined ? subSeason.savePctg.toFixed(3) : "—"}</td>
            <td class="num">${subSeason.goalsAgainstAverage !== undefined ? subSeason.goalsAgainstAverage.toFixed(2) : "—"}</td>
          </tr></tbody></table></div>
        `;
      } else {
        html += `
          <div class="table-scroll"><table class="stat-table"><thead><tr>
            <th>И</th><th>Г</th><th>П</th><th>О</th><th>+/-</th><th>Штр</th>
          </tr></thead><tbody><tr>
            <td class="num">${val(subSeason.gamesPlayed)}</td>
            <td class="num">${val(subSeason.goals)}</td>
            <td class="num">${val(subSeason.assists)}</td>
            <td class="num">${val(subSeason.points)}</td>
            <td class="num">${val(subSeason.plusMinus)}</td>
            <td class="num">${val(subSeason.pim ?? subSeason.penaltyMinutes)}</td>
          </tr></tbody></table></div>
        `;
      }

      html += '<div class="section-title">История карьеры в NHL</div>';
      
      if (p.seasonTotals && Array.isArray(p.seasonTotals)) {
        const nhlHistory = p.seasonTotals.filter(s => s.leagueAbbrev === "NHL");

        if (nhlHistory.length === 0) {
          html += '<div class="empty">История выступлений в NHL отсутствует</div>';
        } else {
          const regularSeasonRows = nhlHistory.filter(s => s.gameTypeId === 2 || s.gameTypeCode === 2);
          const playoffRows = nhlHistory.filter(s => s.gameTypeId === 3 || s.gameTypeCode === 3);

          html += `<div class="table-scroll"><table class="stat-table"><thead><tr>`;
          html += `<th>Сезон</th><th>Клуб</th><th>И</th>`;
          if (pos === "G") {
            html += `<th>В</th><th>П</th><th>%ОБ</th><th>ГКИ</th>`;
          } else {
            html += `<th>Г</th><th>П</th><th>О</th><th>+/-</th><th>Штр</th>`;
          }
          html += `</tr></thead><tbody>`;

          if (regularSeasonRows.length > 0) {
            html += `<tr class="playoff-header-row"><td colspan="${pos === 'G' ? 7 : 8}">Регулярный сезон</td></tr>`;
            regularSeasonRows.forEach(s => { html += renderCareerRow(s, pos); });
          }

          if (playoffRows.length > 0) {
            html += `<tr class="playoff-header-row playoff-border"><td colspan="${pos === 'G' ? 7 : 8}">Плей-офф</td></tr>`;
            playoffRows.forEach(s => { html += renderCareerRow(s, pos); });
          }

          html += `</tbody></table></div>`;
        }
      } else {
         html += '<div class="empty">История выступлений недоступна</div>';
      }

      body.innerHTML = html;
    } catch (e) {
      body.innerHTML = '<div class="empty">Не удалось загрузить карточку игрока</div>';
    }
  }

  function renderCareerRow(s, pos) {
    const yearStr = String(s.season).replace(/^(\d{4})(\d{4})$/, "$1-$2");
    const teamName = s.teamName?.default || s.teamAbbrev || "—";
    
    let rHtml = `<tr>
      <td>${yearStr}</td>
      <td>${escapeHtml(teamName)}</td>
      <td class="num">${val(s.gamesPlayed)}</td>`;
    
    if (pos === "G") {
      const svPct = s.savePctg ?? s.savePercentage;
      const gaa = s.goalsAgainstAverage ?? s.gaa;
      rHtml += `
        <td class="num">${val(s.wins)}</td>
        <td class="num">${val(s.losses)}</td>
        <td class="num">${typeof svPct === 'number' ? svPct.toFixed(3) : val(svPct)}</td>
        <td class="num">${typeof gaa === 'number' ? gaa.toFixed(2) : val(gaa)}</td>`;
    } else {
      rHtml += `
        <td class="num">${val(s.goals)}</td>
        <td class="num">${val(s.assists)}</td>
        <td class="num">${val(s.points)}</td>
        <td class="num">${val(s.plusMinus)}</td>
        <td class="num">${val(s.pim ?? s.penaltyMinutes)}</td>`;
    }
    rHtml += `</tr>`;
    return rHtml;
  }

  loadSchedule();
</script>
</body>
</html>
