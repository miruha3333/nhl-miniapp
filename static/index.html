<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NHL Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключение HLS.js для проигрывания m3u8 видеопотоков -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0a;
  --surface:#161616;
  --surface-2:#232323;
  --silver:#e6e9ea;
  --silver-dim:#9ca3aa;
  --blue:#1f5fce;
  --red:#c8102e;
  --border:#2c2c2c;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding-bottom:24px;
  color:var(--silver);
  background:var(--bg);
  font-family:"Inter",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select {
  font:inherit;
}

header {
  padding:20px 16px 14px;
  border-bottom:2px solid var(--blue);
  background:linear-gradient(180deg,#141414 0%,var(--bg) 100%);
}

header h1 {
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 2px;
  font-family:"Oswald",sans-serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

header h1 .dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

header .sub {
  color:var(--silver-dim);
  font-size:12px;
}

nav {
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  gap:6px;
  padding:12px 16px 0;
  background:var(--bg);
}

nav button,
.cat-row button,
.back-btn,
.date-row button,
.show-more {
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--silver-dim);
  background:var(--surface);
  cursor:pointer;
}

nav button {
  flex:1;
  padding:10px 8px;
  font-family:"Oswald",sans-serif;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

nav button.active {
  border-color:var(--blue);
  color:#fff;
  background:var(--blue);
  font-weight:700;
}

main {
  padding:14px 16px 0;
}

.date-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 14px;
}

.date-input {
  width:140px;
  padding:6px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  color:var(--silver);
  background:transparent;
  font-family:"Roboto Mono",monospace;
  font-size:14px;
  text-align:center;
}

.date-input::-webkit-calendar-picker-indicator {
  filter:invert(1);
}

select.date-input {
  appearance:none;
  -webkit-appearance:none;
  background:var(--surface);
}

select.date-input option {
  color:var(--silver);
  background:#1a1a1a;
}

.date-row button {
  width:34px;
  height:34px;
  color:var(--silver);
  font-size:16px;
}

.card {
  margin-bottom:10px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}

.game-row {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  cursor:pointer;
}

.team.right {
  justify-content:flex-end;
  text-align:right;
}

.team-logo {
  width:32px;
  height:32px;
  flex-shrink:0;
  object-fit:contain;
}

.abbr {
  font-family:"Oswald",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.04em;
}

.team-record {
  margin-top:3px;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  line-height:1.1;
  white-space:nowrap;
}

.team-record strong {
  color:var(--silver);
}

.score-box {
  min-width:70px;
  padding:4px 6px;
  border-radius:10px;
  text-align:center;
}

.score-box.clickable,
.score-box.game-center {
  cursor:pointer;
}

.score-box:active,
.team:active,
.player-row:active,
.spotlight-card:active {
  background:var(--surface-2);
}

.score-box .score {
  font-family:"Roboto Mono",monospace;
  font-size:22px;
  font-weight:700;
}

.score-box .status {
  margin-top:2px;
  color:var(--red);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.table-wrapper,
.table-scroll {
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.standings-table {
  display:grid;
  grid-template-columns: 24px 30px 110px repeat(8, 35px) repeat(2, 60px);
  min-width:600px;
  align-items:center;
}

.sticky-col {
  position:sticky;
  z-index:2;
  background:var(--surface);
}

.sticky-col-1 { left:0; }
.sticky-col-2 { left:24px; }
.sticky-col-3 { left:54px; }

.standings-head,
.standings-row,
.group-header-row {
  display:contents;
}

.standings-head > div,
.standings-row > div {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.standings-head > div {
  color:var(--silver-dim);
  font-size:10px;
  text-transform:uppercase;
}

.standings-head .sticky-col {
  z-index:3;
}

.standings-head .sortable {
  color:var(--silver);
  cursor:pointer;
  text-decoration:underline dotted;
}

.standings-row {
  cursor:pointer;
}

.standings-row:active > div {
  background:var(--surface-2)!important;
}

.standings-row .name {
  width:100%;
  justify-content:flex-start;
  overflow:hidden;
  padding-left:5px;
  font-family:"Oswald",sans-serif;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.standings-row .num,
.standings-row .diff,
.standings-row .pts,
.stat-table .num {
  font-family:"Roboto Mono",monospace;
}

.standings-row .num.sticky-col-1 {
  color:var(--silver-dim);
}

.standings-row .team-logo {
  width:20px;
  height:20px;
}

.standings-row .pts {
  color:var(--blue);
  font-weight:700;
}

.group-header-row > div {
  grid-column:1/-1;
  padding:8px 10px;
  border-bottom:1px solid var(--border);
  color:var(--silver);
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.cat-row {
  display:flex;
  flex-wrap: wrap;
  gap:6px;
  margin-bottom:6px;
}

.cat-row button {
  flex:1;
  min-width:0;
  padding:8px 6px;
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.cat-row button.active {
  border-color:var(--red);
  color:#fff;
  background:var(--red);
  font-weight:700;
}

.player-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.player-row:last-child {
  border-bottom:none;
}

.player-row .rank {
  width:20px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  text-align:center;
}

.player-row .headshot {
  width:42px;
  height:42px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.player-row .info {
  min-width:0;
  flex:1;
}

.player-row .pname {
  overflow:hidden;
  font-family:"Oswald",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-row .pteam {
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:2px;
  color:var(--silver-dim);
  font-size:11px;
}

.player-row .pteam .team-logo {
  width:16px;
  height:16px;
}

.player-row .pvalue-group {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.player-row .pvalue {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-size:20px;
  font-weight:700;
  text-align: right;
  min-width: 48px;
}

.show-more {
  width:100%;
  margin-top:10px;
  padding:10px;
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.empty,
.loading {
  grid-column:1/-1;
  padding:14px 0;
  color:var(--silver-dim);
  font-size:13px;
  text-align:center;
}

.loading {
  font-family:"Roboto Mono",monospace;
}

.spotlight-title {
  margin:24px 0 12px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.spotlight-card {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  cursor:pointer;
}

.spotlight-headshot {
  width:52px;
  height:52px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.spotlight-info {
  min-width:0;
  flex:1;
}

.spotlight-name {
  font-family:"Oswald",sans-serif;
  font-size:15px;
  font-weight:600;
}

.spotlight-team {
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
  color:var(--silver-dim);
  font-size:12px;
}

.spotlight-team .team-logo {
  width:16px;
  height:16px;
}

.spotlight-rank {
  width:18px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  text-align:center;
}

.spotlight-value {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-size:20px;
  font-weight:700;
}

.matchup-card {
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.matchup-title {
  margin-bottom:8px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.matchup-summary {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  text-align:center;
}

.matchup-team {
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
}

.matchup-record {
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:12px;
}

.matchup-games {
  margin-top:8px;
}

.matchup-game {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  padding:7px 0;
  border-top:1px solid var(--border);
  color:var(--silver-dim);
  font-size:11px;
}

.matchup-game .winner {
  color:var(--silver);
  font-weight:700;
}

.matchup-game .score {
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-weight:700;
  text-align:center;
}

.matchup-game small {
  display:block;
  margin-top:2px;
  color:var(--silver-dim);
  font-size:9px;
}

/* Видеоплеер обзора */
.video-container {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:14px;
  border:1px solid var(--border);
}

.video-container video,
.video-container iframe {
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.back-btn {
  position:fixed;
  left:16px;
  bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:1000;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin:0;
  padding:9px 15px;
  border:1px solid var(--blue);
  border-radius:12px;
  color:#fff;
  background:rgba(31,95,206,.96);
  box-shadow:0 6px 20px rgba(0,0,0,.45);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.detail-head-game {
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}

.detail-head {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}

.detail-head img.team-logo,
.detail-head-game img.team-logo {
  width:48px;
  height:48px;
}

.detail-head img.headshot {
  width:64px;
  height:64px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface-2);
  object-fit:cover;
}

.detail-head .title,
.detail-head-game .title {
  font-family:"Oswald",sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:center;
  text-transform:uppercase;
}

.detail-head .subtitle,
.detail-head-game .subtitle {
  margin-top:2px;
  color:var(--silver-dim);
  font-size:12px;
  text-align:center;
}

.section-title {
  margin:12px 0 6px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.bio-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 14px;
  font-size:13px;
}

.bio-grid .label {
  color:var(--silver-dim);
  font-size:11px;
  text-transform:uppercase;
}

.bio-grid .value {
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.stat-table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.stat-table th,
.stat-table td {
  padding:5px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
  white-space:nowrap;
}

.stat-table th {
  color:var(--silver-dim);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.stat-table th.sortable {
  color:var(--silver);
  cursor:pointer;
  text-decoration:underline dotted;
}

.stat-table td:first-child,
.stat-table th:first-child {
  font-family:"Oswald",sans-serif;
  font-weight:600;
  text-align:left;
}

.stat-table tbody tr.clickable-row {
  cursor:pointer;
}

.stat-table tbody tr.clickable-row:active {
  background:var(--surface-2);
}

.stat-table tbody tr.playoff-header-row td {
  padding:6px 8px;
  color:var(--silver);
  background:var(--surface-2);
  font-family:"Oswald",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.05em;
  text-align:left;
  text-transform:uppercase;
}

.stat-table tbody tr.playoff-border {
  border-bottom:3px solid var(--blue);
}

.goal-row {
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.goal-row .time {
  width:46px;
  flex-shrink:0;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:12px;
}

.goal-row .desc {
  flex:1;
}

.goal-row .scorer {
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.goal-row .assists {
  margin-top:2px;
  color:var(--silver-dim);
  font-size:11px;
}

.goal-row .scoreline {
  flex-shrink:0;
  color:var(--blue);
  font-family:"Roboto Mono",monospace;
  font-weight:700;
}

.period-label {
  margin:10px 0 4px;
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:11px;
  text-transform:uppercase;
}

.team-schedule-list {
  margin-top:8px;
}

.team-schedule-row {
  display:grid;
  grid-template-columns:72px minmax(0,1fr) 72px 80px 28px;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
}

.team-schedule-date,
.team-schedule-location,
.team-schedule-score,
.team-schedule-result {
  color:var(--silver-dim);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
}

.team-schedule-opponent {
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.team-schedule-opponent .team-logo {
  width:24px;
  height:24px;
}

.team-schedule-opponent .abbr {
  font-size:12px;
}

.team-schedule-score {
  color:var(--silver);
  font-weight:700;
  text-align:right;
}

.team-schedule-score.winner,
.team-schedule-result.winner {
  color:#2ecc71;
}

.team-schedule-score.loser,
.team-schedule-result.loser {
  color:var(--red);
}

.team-schedule-result {
  color:var(--silver);
  font-weight:700;
  text-align:center;
}

.team-schedule-seasons {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}

.team-season-btn {
  border:1px solid var(--border);
  border-radius:9px;
  padding:7px 9px;
  color:var(--silver-dim);
  background:var(--surface);
  cursor:pointer;
  font-family:"Oswald",sans-serif;
  font-size:11px;
}

.team-season-btn.active {
  border-color:var(--blue);
  color:#fff;
  background:var(--blue);
}

.game-player-table {
  min-width:0;
  width:max-content;
  max-width:none;
  table-layout:auto;
  border-collapse:separate;
  border-spacing:0;
}

.game-player-table th:first-child,
.game-player-table td:first-child {
  position:sticky;
  left:0;
  z-index:3;
  min-width:max-content;
  width:max-content;
  background:var(--surface);
  box-shadow:6px 0 10px -9px rgba(0,0,0,.9);
}

.game-player-table thead th:first-child {
  z-index:5;
}

.game-player-table th[data-sort-key] {
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  white-space:nowrap;
}

.game-player-table th[data-sort-key]::after {
  content:"↕";
  margin-left:5px;
  opacity:.35;
  font-size:9px;
}

.game-player-table th.sort-asc::after {
  content:"↑";
  opacity:.9;
}

.game-player-table th.sort-desc::after {
  content:"↓";
  opacity:.9;
}

.game-player-table th[data-sort-key]:active {
  background:var(--surface-2);
}

.game-player-table + .section-title {
  margin-top:10px;
}

.game-player-section {
  margin-bottom:4px;
}

.game-player-table th:first-child,
.game-player-table td:first-child {
  padding-right:8px;
  white-space:nowrap;
}

.special-team-pct {
  color:var(--blue);
  font-weight:700;
}

.bracket-wrap {
  margin-top:16px;
}

.bracket-round-title {
  margin:14px 0 8px;
  color:var(--silver-dim);
  font-family:"Oswald",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.bracket-series {
  margin-bottom:8px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
}

.bracket-team-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 0;
  font-size:13px;
}

.bracket-team-row .bt-name {
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Oswald",sans-serif;
  font-weight:600;
}

.bracket-team-row .bt-name img {
  width:20px;
  height:20px;
  object-fit:contain;
}

<body>

<main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API_BASE = "https://nhl-live-api.sergvolk504.workers.dev";

let currentTeamFullData = null;
let currentTeamType = "regular";
let currentTeamSortKey = "points";
let currentTeamSortAsc = false;
let currentTeamSchedule = null;
let currentTeamScheduleSeason = "";
let currentTeamScheduleSeasons = [];

let currentStandingsData = [];
let standingsSortKey = "points";
let standingsSortAsc = false;
let standingsViewMode = "all";
let selectedSeasonEndDate = "";
let bracketLoadedOnce = false;

let lastMainTab = "schedule";
let currentDate = new Date();
let currentCat = "points";
let currentLimit = 25;

let leadersMode = "skaters";
let currentGoalieSortKey = "wins";
let currentGoalieSortAsc = false;

const goalieHeadshotCache = new Map();
const datePicker = document.getElementById("date-picker");

function nameStr(value) {
  if (!value) return "";
  if (typeof value === "string") return value;
  return value.default || value.name || "";
}

function val(value, fallback = "—") {
  return value === undefined || value === null || value === ""
    ? fallback
    : value;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function getTeamAbbrev(team) {
  if (!team) return "";
  if (typeof team === "string") return team.trim().toUpperCase();
  if (typeof team === "object") {
    return String(
      team.default ||
      team.abbrev ||
      team.abbreviation ||
      team.teamAbbrev ||
      ""
    ).trim().toUpperCase();
  }
  return "";
}

function getTeamName(team) {
  if (!team) return "";
  if (typeof team === "string") return team;
  if (typeof team === "object") {
    return String(team.default || team.name || team.teamName || "");
  }
  return "";
}

function getTeamLogo(team) {
  if (!team) return "";
  if (typeof team === "string") return team;
  if (typeof team === "object") {
    return String(team.logo || team.teamLogo || team.crest || "");
  }
  return "";
}

function getPlayerId(player) {
  return String(player?.playerId || player?.id || "");
}

function getHeadshot(player) {
  if (player?.headshot) return player.headshot;
  const playerId = getPlayerId(player);
  if (playerId && goalieHeadshotCache.has(playerId)) {
    return goalieHeadshotCache.get(playerId);
  }
  return "";
}

function fmtDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function seasonIdFromEndDate(endDate) {
  if (!endDate || typeof endDate !== "string") return null;
  const match = endDate.match(/^(\d{4})-\d{2}-\d{2}$/);
  if (!match) return null;
  const endYear = Number(match[1]);
  return `${endYear - 1}${endYear}`;
}

function formatPeriodLabel(descriptor) {
  if (!descriptor) return "Период";
  if (descriptor.periodType === "SO") return "Буллиты";
  if (descriptor.periodType === "OT") {
    const number = descriptor.number && descriptor.number > 3 ? descriptor.number - 3 : 1;
    return number > 1 ? `${number}-й овертайм` : "Овертайм";
  }
  return descriptor.number ? `${descriptor.number}-й период` : "Период";
}

function openDetail() {
  document.getElementById("view-schedule").style.display = "none";
  document.getElementById("view-standings").style.display = "none";
  document.getElementById("view-players").style.display = "none";
  document.getElementById("view-detail").style.display = "";
  document.getElementById("main-nav").style.display = "none";
  document.getElementById("detail-body").innerHTML = '<div class="loading">Загрузка...</div>';
  window.scrollTo(0, 0);
}

function resetLeadersToSkaters() {
  leadersMode = "skaters";
  currentCat = "points";
  currentLimit = 25;

  document.getElementById("leaders-skaters-btn").classList.add("active");
  document.getElementById("leaders-goalies-btn").classList.remove("active");

  document.getElementById("skater-categories").style.display = "block";
  document.getElementById("goalie-categories").style.display = "none";

  document.querySelectorAll("#skater-categories button").forEach(button => {
    button.classList.toggle("active", button.dataset.cat === "points");
  });
}

function normalizeInitialSection(section) {
  switch (section) {
    case "schedule":
    case "matches": return "schedule";
    case "standings":
    case "table": return "standings";
    case "leaders":
    case "players":
    case "goalies": return "players";
    default: return "schedule";
  }
}

function switchTab(tab) {
  document.getElementById("tab-schedule").classList.toggle("active", tab === "schedule");
  document.getElementById("tab-standings").classList.toggle("active", tab === "standings");
  document.getElementById("tab-players").classList.toggle("active", tab === "players");

  document.getElementById("view-schedule").style.display = tab === "schedule" ? "" : "none";
  document.getElementById("view-standings").style.display = tab === "standings" ? "" : "none";
  document.getElementById("view-players").style.display = tab === "players" ? "" : "none";
  document.getElementById("view-detail").style.display = "none";
  document.getElementById("main-nav").style.display = "flex";

  lastMainTab = tab;

  if (tab === "schedule") loadSchedule();
  if (tab === "standings") {
    loadStandings();
    if (!bracketLoadedOnce) {
      const now = new Date();
      const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
      const playoffYear = startYear + 1;
      const playoffStart = new Date(playoffYear, 3, 14);
      if (now >= playoffStart) {
        loadPlayoffBracket(String(playoffYear));
      } else {
        document.getElementById("bracket-container").innerHTML = `
          <div class="bracket-wrap">
            <div class="section-title">Сетка плей-офф</div>
            <div class="empty">Регулярный сезон ещё не завершён — плей-офф начнётся позже</div>
          </div>
        `;
      }
      bracketLoadedOnce = true;
    }
  }
  if (tab === "players") {
    resetLeadersToSkaters();
    loadPlayers();
  }
}

document.getElementById("tab-schedule").onclick = () => switchTab("schedule");
document.getElementById("tab-standings").onclick = () => switchTab("standings");
document.getElementById("tab-players").onclick = () => switchTab("players");
document.getElementById("back-btn").onclick = () => switchTab(lastMainTab);

document.getElementById("prev-day").onclick = () => {
  currentDate.setDate(currentDate.getDate() - 1);
  loadSchedule();
};

document.getElementById("next-day").onclick = () => {
  currentDate.setDate(currentDate.getDate() + 1);
  loadSchedule();
};

datePicker.addEventListener("change", event => {
  if (event.target.value) {
    currentDate = new Date(`${event.target.value}T12:00:00`);
    loadSchedule();
  }
});

async function buildSeasonOptions() {
  const select = document.getElementById("season-select");
  select.innerHTML = "<option value=''>Загрузка сезонов...</option>";
  try {
    const response = await fetch(`${API_BASE}/api/seasons-list`);
    const data = await response.json();
    const seasons = data?.seasons || [];
    if (!seasons.length) {
      select.innerHTML = "<option value=''>Текущий сезон</option>";
      return;
    }
    let html = "<option value=''>Текущий сезон</option>";
    [...seasons].sort((a, b) => b.id - a.id).forEach(season => {
      const id = String(season.id);
      const startYear = id.slice(0, 4);
      const endYear = id.slice(6, 8);
      html += `<option value="${escapeHtml(season.standingsEnd || "")}" data-start-year="${escapeHtml(startYear)}">${escapeHtml(`${startYear}-${endYear}`)}</option>`;
    });
    select.innerHTML = html;
  } catch (error) {
    console.error(error);
    select.innerHTML = "<option value=''>Текущий сезон</option>";
  }
}

document.getElementById("season-select").addEventListener("change", event => {
  const option = event.target.options[event.target.selectedIndex];
  selectedSeasonEndDate = option.value;
  currentStandingsData = [];
  loadStandings();

  let startYear = option.dataset.startYear;
  if (!startYear) {
    const now = new Date();
    startYear = String(now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1);
  }
  const playoffYear = String(Number(startYear) + 1);
  if (option.dataset.startYear || new Date() >= new Date(Number(playoffYear), 3, 14)) {
    loadPlayoffBracket(playoffYear);
  } else {
    document.getElementById("bracket-container").innerHTML = `
      <div class="bracket-wrap">
        <div class="section-title">Сетка плей-офф</div>
        <div class="empty">Регулярный сезон ещё не завершён — плей-офф начнётся позже</div>
      </div>
    `;
  }
});

document.querySelectorAll(".standings-head .sortable").forEach(header => {
  header.onclick = () => {
    const key = header.dataset.sort;
    if (standingsSortKey === key) {
      standingsSortAsc = !standingsSortAsc;
    } else {
      standingsSortKey = key;
      standingsSortAsc = false;
    }
    renderStandings();
  };
});

document.getElementById("std-mode-all").onclick = () => setStandingsMode("all");
document.getElementById("std-mode-conf").onclick = () => setStandingsMode("conf");
document.getElementById("std-mode-div").onclick = () => setStandingsMode("div");

function setStandingsMode(mode) {
  standingsViewMode = mode;
  document.getElementById("std-mode-all").classList.toggle("active", mode === "all");
  document.getElementById("std-mode-conf").classList.toggle("active", mode === "conf");
  document.getElementById("std-mode-div").classList.toggle("active", mode === "div");
  currentStandingsData.length ? renderStandings() : loadStandings();
}

async function loadSchedule() {
  const games = document.getElementById("games");
  const date = fmtDate(currentDate);
  games.innerHTML = '<div class="loading">Загрузка...</div>';
  datePicker.value = date;

  try {
    const response = await fetch(`${API_BASE}/api/schedule?date=${encodeURIComponent(date)}`);
    const data = await response.json();
    const day = (data.gameWeek || []).find(item => item.date === date);
    const list = day?.games || [];

    if (!list.length) {
      games.innerHTML = '<div class="empty">В этот день матчей нет</div>';
      loadSpotlight();
      return;
    }

    games.innerHTML = list.map(renderGame).join("");

    games.querySelectorAll(".score-box.game-center").forEach(element => {
      element.addEventListener("click", () => {
        const gameId = element.dataset.gameId;
        const awayAbbrev = element.dataset.away;
        const homeAbbrev = element.dataset.home;
        const awayLogo = element.dataset.awayLogo;
        const homeLogo = element.dataset.homeLogo;
        const game = list.find(item => String(item.id) === String(gameId));

        if (game && isFutureGame(game)) {
          openFutureGamePreview(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo, date);
          return;
        }
        openGameDetail(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo);
      });
    });

    games.querySelectorAll(".team[data-team]").forEach(team => {
      team.addEventListener("click", event => {
        event.stopPropagation();
        openTeamDetail(team.dataset.team, team.dataset.name, team.dataset.logo);
      });
    });
  } catch (error) {
    console.error(error);
    games.innerHTML = '<div class="empty">Не удалось загрузить матчи</div>';
  }
}

function renderTeamRecord(team) {
  const record = team?.currentRecord;
  if (!record) return "";
  return `
    <div class="team-record">
      <strong>${record.wins ?? 0}-${record.losses ?? 0}-${record.otLosses ?? 0}-${record.points ?? 0}</strong>
    </div>
  `;
}

function renderGame(game) {
  const away = game.awayTeam || {};
  const home = game.homeTeam || {};
  const started = game.gameState !== "FUT" && game.gameState !== "PRE";
  const status = started
    ? (game.gameState === "LIVE" || game.gameState === "CRIT" ? "LIVE" : "Финал")
    : new Date(game.startTimeUTC).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  return `
    <div class="card">
      <div class="game-row">
        <div class="team" data-team="${escapeHtml(away.abbrev || "")}" data-name="${escapeHtml(away.name || away.abbrev || "")}" data-logo="${escapeHtml(away.logo || "")}">

function isFutureGame(game) {
  return game.gameState === "FUT" || game.gameState === "PRE";
}

function getScheduleGames(data) {
  if (!data || typeof data !== "object") return [];
  if (Array.isArray(data.games)) return data.games;
  const result = [];
  if (Array.isArray(data.gameWeek)) {
    data.gameWeek.forEach(day => {
      if (Array.isArray(day?.games)) result.push(...day.games);
    });
  }
  return result;
}

function getGameDateValue(game) {
  return game?.gameDate || game?.date || game?.startTimeUTC || "";
}

function getGameTeamAbbrev(team) {
  if (!team) return "";
  if (typeof team === "string") return team.toUpperCase();
  return String(team.abbrev || team.teamAbbrev?.default || team.teamAbbrev || team.abbreviation || "").toUpperCase();
}

function getGameTeamName(team, fallback = "") {
  if (!team) return fallback;
  if (typeof team === "string") return team;
  return team.abbrev || team.teamAbbrev?.default || team.teamAbbrev || team.placeName?.default || team.teamName?.default || team.name?.default || fallback;
}

function getGameScore(game, side) {
  const value = game?.[`${side}Team`]?.score ?? game?.[`${side}Score`] ?? game?.[`${side}TeamScore`] ?? game?.[side]?.score;
  return value === undefined || value === null ? null : Number(value);
}

function getGoalStrengthLabel(goal) {
  const raw = String(goal?.strengthCode ?? goal?.strength ?? goal?.situationCode ?? goal?.typeCode ?? goal?.goalType ?? "").toUpperCase();
  if (goal?.isShortHanded === true || goal?.isShorthanded === true || /SH/.test(raw)) return "М";
  if (goal?.isPowerPlay === true || goal?.isPowerplay === true || /PP/.test(raw)) return "Б";
  return "";
}

function isCompletedGame(game) {
  const state = String(game?.gameState || "").toUpperCase();
  return state === "OFF" || state === "FINAL" || state === "F" || (game?.awayTeam?.score !== undefined && game?.homeTeam?.score !== undefined && !["FUT", "PRE", "LIVE", "CRIT"].includes(state));
}

async function loadMatchupHistory(awayAbbrev, homeAbbrev) {
  const away = String(awayAbbrev || "").toUpperCase();
  const home = String(homeAbbrev || "").toUpperCase();

  if (!away || !home) return [];

  let seasonIds = [];

  try {
    const response = await fetch(`${API_BASE}/api/seasons-list`, { cache: "no-store" });
    const data = await response.json();
    const seasons = Array.isArray(data?.seasons) ? data.seasons : [];

    seasonIds = seasons
      .map(item => String(item?.id || item?.season || ""))
      .filter(id => /^\d{8}$/.test(id))
      .sort((a, b) => Number(b) - Number(a));
  } catch (error) {
    console.error("Ошибка загрузки списка сезонов для личных встреч:", error);
  }

  const now = new Date();
  const startYear = now.getMonth() >= 8
    ? now.getFullYear()
    : now.getFullYear() - 1;
  const currentSeasonId = `${startYear}${startYear + 1}`;

  seasonIds = [currentSeasonId, ...seasonIds]
    .filter((id, index, array) => array.indexOf(id) === index)
    .slice(0, 7);

  const allGames = [];

  await Promise.all(seasonIds.map(async seasonId => {
    try {
      const response = await fetch(
        `${API_BASE}/api/team-schedule/${encodeURIComponent(away)}?season=${encodeURIComponent(seasonId)}`,
        { cache: "no-store" }
      );

      if (!response.ok) return;

      const data = await response.json();
      const games = getScheduleGames(data);

      games.forEach(game => {
        if (!isCompletedGame(game)) return;

        const gameAway = getGameTeamAbbrev(game.awayTeam);
        const gameHome = getGameTeamAbbrev(game.homeTeam);

        if (
          (gameAway === away && gameHome === home) ||
          (gameAway === home && gameHome === away)
        ) {
          allGames.push({ ...game, __season: seasonId });
        }
      });
    } catch (error) {
      console.error(`Ошибка расписания ${away} за сезон ${seasonId}:`, error);
    }
  }));

  const unique = [];
  const seen = new Set();

  allGames
    .sort((a, b) => {
      const da = new Date(getGameDateValue(a)).getTime() || 0;
      const db = new Date(getGameDateValue(b)).getTime() || 0;
      return db - da;
    })
    .forEach(game => {
      const key = String(game.id || `${getGameDateValue(game)}:${getGameTeamAbbrev(game.awayTeam)}:${getGameTeamAbbrev(game.homeTeam)}`);
      if (!seen.has(key)) {
        seen.add(key);
        unique.push(game);
      }
    });

  return unique.slice(0, 10);
}

function renderMatchupHistory(games, awayAbbrev, homeAbbrev) {
  let html = `
    <div class="matchup-card">
      <div class="matchup-title">Последние 10 результатов между командами</div>
  `;

  if (!games.length) {
    return html + '<div class="empty">История личных встреч недоступна</div></div>';
  }

  const wins = {
    [String(awayAbbrev).toUpperCase()]: 0,
    [String(homeAbbrev).toUpperCase()]: 0
  };

  games.forEach(game => {
    const away = getGameTeamAbbrev(game.awayTeam) || awayAbbrev;
    const home = getGameTeamAbbrev(game.homeTeam) || homeAbbrev;
    const awayScore = getGameScore(game, "away");
    const homeScore = getGameScore(game, "home");

    if (awayScore !== null && homeScore !== null) {
      if (awayScore > homeScore) wins[away] = (wins[away] || 0) + 1;
      if (homeScore > awayScore) wins[home] = (wins[home] || 0) + 1;
    }
  });

  html += `
    <div class="matchup-summary">
      <div>
        <div class="matchup-team">${escapeHtml(awayAbbrev)}</div>
        <div class="matchup-record">Побед: ${wins[String(awayAbbrev).toUpperCase()] || 0}</div>
      </div>
      <div class="matchup-record">${games.length} матчей</div>
      <div>
        <div class="matchup-team">${escapeHtml(homeAbbrev)}</div>
        <div class="matchup-record">Побед: ${wins[String(homeAbbrev).toUpperCase()] || 0}</div>
      </div>
    </div>

    <div class="matchup-games">
  `;

  games.forEach(game => {
    const gameAway = getGameTeamAbbrev(game.awayTeam) || awayAbbrev;
    const gameHome = getGameTeamAbbrev(game.homeTeam) || homeAbbrev;
    const awayScore = getGameScore(game, "away");
    const homeScore = getGameScore(game, "home");
    const date = getGameDateValue(game);
    const dateText = date
      ? new Date(date).toLocaleDateString("ru-RU")
      : "";

    const awayWinner = awayScore !== null && homeScore !== null && awayScore > homeScore;
    const homeWinner = awayScore !== null && homeScore !== null && homeScore > awayScore;

    html += `
      <div class="matchup-game">
        <div class="${awayWinner ? "winner" : ""}">
          ${escapeHtml(gameAway)}
          ${dateText ? `<small>${escapeHtml(dateText)} · ${escapeHtml(String(game.__season || "").replace(/^(\d{4})(\d{4})$/, "$1-$2"))}</small>` : ""}
        </div>

        <div class="score">
          ${awayScore === null ? "—" : escapeHtml(awayScore)} :
          ${homeScore === null ? "—" : escapeHtml(homeScore)}
        </div>

        <div class="${homeWinner ? "winner" : ""}">
          ${escapeHtml(gameHome)}
        </div>
      </div>
    `;
  });

  html += '</div></div>';
  return html;
}

async function loadMatchupPreview(awayAbbrev, homeAbbrev) {
  try {

  }

  let badgeClass = "badge-unannounced";

  if (goalie.status === "confirmed" || goalie.isConfirmed) {
    badgeClass = "badge-confirmed";

  } else if (goalie.status === "probable" || goalie.isProbable) {

    </div>
  `;
}

function renderStatComparisonRow(metricName, awayVal, homeVal, higherIsBetter, numAwayRaw, numHomeRaw) {
  let awayNum = numAwayRaw !== undefined ? Number(numAwayRaw) : parseFloat(awayVal);
  let homeNum = numHomeRaw !== undefined ? Number(numHomeRaw) : parseFloat(homeVal);

  let awayBest = false;
  let homeBest = false;

  if (!isNaN(awayNum) && !isNaN(homeNum) && awayNum !== homeNum) {
    if (higherIsBetter) {
      awayBest = awayNum > homeNum;
      homeBest = homeNum > awayNum;
    } else {
      awayBest = awayNum < homeNum;
      homeBest = homeNum < awayNum;
    }
  }

  return `
    <div class="comp-row">
      <div class="val away ${awayBest ? 'best' : ''}">${escapeHtml(val(awayVal))}</div>
      <div class="metric">${escapeHtml(metricName)}</div>
      <div class="val home ${homeBest ? 'best' : ''}">${escapeHtml(val(homeVal))}</div>
    </div>
  `;
}

function sortTeams(teams) {
  return [...teams].sort((a, b) => {
    let valueA = a[standingsSortKey] ?? 0;
    let valueB = b[standingsSortKey] ?? 0;

    if (standingsSortKey === "goalDifferential") {
      valueA = a.goalDifferential ?? ((a.goalFor ?? 0) - (a.goalAgainst ?? 0));
      valueB = b.goalDifferential ?? ((b.goalFor ?? 0) - (b.goalAgainst ?? 0));
    } else if (standingsSortKey === "powerPlayPctg") {
      valueA = getTeamSpecialPct(a, ["powerPlayPctg", "powerPlayPct", "powerPlayPercentage", "powerPlaySuccessPctg"]) ?? -1;
      valueB = getTeamSpecialPct(b, ["powerPlayPctg", "powerPlayPct", "powerPlayPercentage", "powerPlaySuccessPctg"]) ?? -1;
    } else if (standingsSortKey === "penaltyKillPctg") {
      valueA = getTeamSpecialPct(a, ["penaltyKillPctg", "penaltyKillPct", "penaltyKillPercentage", "penaltyKillSuccessPctg"]) ?? -1;
      valueB = getTeamSpecialPct(b, ["penaltyKillPctg", "penaltyKillPct", "penaltyKillPercentage", "penaltyKillSuccessPctg"]) ?? -1;
    }

    return standingsSortAsc ? Number(valueA) - Number(valueB) : Number(valueB) - Number(valueA);
  });
}

function renderStandings() {
  const body = document.getElementById("standings-body");
  if (!currentStandingsData.length) {
    body.innerHTML = '<div class="empty">Нет данных</div>';
    return;
  }

  let html = "";
  if (standingsViewMode === "all") {
    html = sortTeams(currentStandingsData).map((team, index) => renderTeamRow(team, index + 1)).join("");
  } else {
    const field = standingsViewMode === "conf" ? "conferenceName" : "divisionName";
    const groups = {};
    currentStandingsData.forEach(team => {
      const group = nameStr(team[field]) || "Без группы";
      if (!groups[group]) groups[group] = [];
      groups[group].push(team);
    });

    Object.keys(groups).sort().forEach(group => {
      html += `<div class="group-header-row"><div>${escapeHtml(group)}</div></div>`;
      html += sortTeams(groups[group]).map((team, index) => renderTeamRow(team, index + 1)).join("");
    });
  }

  body.innerHTML = html;
  body.querySelectorAll(".standings-row").forEach(row => {
    row.addEventListener("click", () => {
      openTeamDetail(row.dataset.team, row.dataset.name, row.dataset.logo);
    });
  });
}

async function loadPlayoffBracket(playoffYear) {

    const rounds = {};

      const round = item.round ?? item.roundNumber ?? item.playoffRound ?? 1;
      if (!rounds[round]) rounds[round] = [];
      rounds[round].push(item);
    });

    const roundNames = {
      1: "1-й раунд",
      2: "2-й раунд (полуфинал конференции)",

      4: "Финал Кубка Стэнли"
    };

    let html = '<div class="bracket-wrap"><div class="section-title">Сетка плей-офф</div>';
    Object.keys(rounds).sort((a, b) => Number(a) - Number(b)).forEach(round => {
      html += `<div class="bracket-round-title">${escapeHtml(roundNames[round] || `Раунд ${round}`)}</div>`;
      rounds[round].forEach(item => {
        const top = item.topSeedTeam || item.matchupTeams?.[0] || item.team1 || {};
        const bottom = item.bottomSeedTeam || item.matchupTeams?.[1] || item.team2 || {};
        const topWins = item.topSeedWins ?? item.matchupTeams?.[0]?.seriesWins ?? item.team1Wins ?? 0;
        const bottomWins = item.bottomSeedWins ?? item.matchupTeams?.[1]?.seriesWins ?? item.team2Wins ?? 0;
        const topName = top.abbrev || top.teamAbbrev?.default || top.placeName?.default || "TBD";
        const bottomName = bottom.abbrev || bottom.teamAbbrev?.default || bottom.placeName?.default || "TBD";

        html += `
          <div class="bracket-series">
            <div class="bracket-team-row ${topWins > bottomWins && topWins === 4 ? "winner" : ""}">
              <div class="bt-name">
                <img src="${escapeHtml(top.logo || top.teamLogo || "")}" alt="">
                <span>${escapeHtml(topName)}</span>
              </div>
              <div class="bt-wins">${topWins}</div>
            </div>
            <div class="bracket-team-row ${bottomWins > topWins && bottomWins === 4 ? "winner" : ""}">
              <div class="bt-name">
                <img src="${escapeHtml(bottom.logo || bottom.teamLogo || "")}" alt="">
                <span>${escapeHtml(bottomName)}</span>
              </div>
              <div class="bt-wins">${bottomWins}</div>
            </div>
          </div>
        `;
      });
    });

    html += "</div>";
    container.innerHTML = html;
  } catch (error) {
    console.error(error);
    container.innerHTML = '<div class="bracket-wrap"><div class="empty">Не удалось загрузить сетку плей-офф</div></div>';
  }
}

async function loadPlayers() {
  const body = document.getElementById("players-body");
  body.innerHTML = '<div class="loading">Загрузка...</div>';

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams({ limit: String(currentLimit) });
    if (seasonId) params.set("season", seasonId);

    const response = await fetch(`${API_BASE}/api/leaders/${encodeURIComponent(currentCat)}?${params}`);
    const data = await response.json();
    const list = data[currentCat] || [];

    if (!list.length) {
      body.innerHTML = '<div class="empty">Нет данных игроков</div>';
      return;
    }

    body.innerHTML = list.map((player, index) => `
      <div class="player-row" data-player-id="${escapeHtml(getPlayerId(player))}">
        <div class="rank">${index + 1}</div>
        <img class="headshot" src="${escapeHtml(getHeadshot(player))}" alt="" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="pname">${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Игрок")}</div>
          <div class="pteam">
            <img class="team-logo" src="${escapeHtml(player.teamLogo || "")}" alt="" onerror="this.style.display='none'">
            ${escapeHtml(player.teamAbbrev || "")}
          </div>
        </div>
        <div class="pvalue-group">
          <div class="pvalue">${escapeHtml(player.value ?? "")}</div>
        </div>
      </div>
    `).join("");

    if (list.length >= currentLimit && currentLimit < 50) {
      body.insertAdjacentHTML("beforeend", `<button class="show-more" id="show-more-players">Показать больше</button>`);
      document.getElementById("show-more-players").onclick = () => {
        currentLimit = 50;
        loadPlayers();
      };
    }

    body.querySelectorAll(".player-row").forEach(row => {
      row.addEventListener("click", () => openPlayerDetail(row.dataset.playerId));
    });
  } catch (error) {
    console.error(error);
    body.innerHTML = '<div class="empty">Не удалось загрузить лидеров</div>';
  }
}

function goalieSortValue(player) {
  if (currentGoalieSortKey === "savePctg") return Number(player.savePctg ?? player.savePercentage ?? -Infinity);
  if (currentGoalieSortKey === "gaa") return Number(player.gaa ?? player.goalsAgainstAverage ?? Infinity);
  if (currentGoalieSortKey === "timeOnIce") return Number(player.timeOnIce ?? player.toi ?? -Infinity);
  return Number(player[currentGoalieSortKey] ?? -Infinity);
}

async function loadGoalieCards() {
  const body = document.getElementById("players-body");
  body.innerHTML = '<div class="loading">Загрузка статистики вратарей...</div>';

  try {
    const seasonId = seasonIdFromEndDate(selectedSeasonEndDate);
    const params = new URLSearchParams({ limit: "100" });
    if (seasonId) params.set("season", seasonId);

    const response = await fetch(`${API_BASE}/api/goalie-leaders?${params}`, { cache: "no-store" });
    const data = await response.json();
    if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);

    let rows = Array.isArray(data.goalies) ? [...data.goalies] : [];
    if (!rows.length) {
      body.innerHTML = '<div class="empty">Нет данных вратарей за выбранный сезон</div>';
      return;
    }

    await hydrateGoalieHeadshots(rows);

    rows.sort((a, b) => {
      const valueA = goalieSortValue(a);
      const valueB = goalieSortValue(b);
      return currentGoalieSortAsc ? valueA - valueB : valueB - valueA;
    });

    body.innerHTML = rows.map((player, index) => {
      const savePct = player.savePctg ?? player.savePercentage;
      const gaa = player.gaa ?? player.goalsAgainstAverage;
      let mainValue = player[currentGoalieSortKey] ?? "—";

      if (currentGoalieSortKey === "savePctg") {
        mainValue = typeof savePct === "number" ? savePct.toFixed(3) : "—";
      }
      if (currentGoalieSortKey === "gaa") {
        mainValue = typeof gaa === "number" ? gaa.toFixed(2) : "—";
      }
      if (currentGoalieSortKey === "timeOnIce") {
        const toiSec = Number(player.timeOnIce ?? player.toi ?? 0);
        const mins = Math.floor(toiSec / 60);
        const secs = toiSec % 60;
        mainValue = `${mins}:${String(secs).padStart(2, '0')}`;
      }

      return `
        <div class="player-row" data-player-id="${escapeHtml(getPlayerId(player))}">
          <div class="rank">${index + 1}</div>
          <img class="headshot" src="${escapeHtml(getHeadshot(player))}" alt="" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="pname">${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Вратарь")}</div>
            <div class="pteam">
              <img class="team-logo" src="${escapeHtml(player.teamLogo || "")}" alt="" onerror="this.style.display='none'">
              ${escapeHtml(player.teamAbbrev || "")}
            </div>
          </div>
          <div class="pvalue-group">
            <div class="pvalue">${escapeHtml(mainValue)}</div>
          </div>
        </div>
      `;
    }).join("");

    body.querySelectorAll(".player-row").forEach(row => {
      row.addEventListener("click", () => openPlayerDetail(row.dataset.playerId));
    });
  } catch (error) {
    console.error(error);
    body.innerHTML = `<div class="empty">Не удалось загрузить статистику вратарей<br><small>${escapeHtml(error.message || "Ошибка загрузки")}</small></div>`;
  }
}

async function hydrateGoalieHeadshots(players) {
  await Promise.all(
    players.map(async player => {
      const playerId = getPlayerId(player);
      if (!playerId || player.headshot || goalieHeadshotCache.has(playerId)) return;
      try {
        const response = await fetch(`${API_BASE}/api/player/${encodeURIComponent(playerId)}`);
        if (!response.ok) return;
        const profile = await response.json();
        if (profile.headshot) {
          goalieHeadshotCache.set(playerId, profile.headshot);
          player.headshot = profile.headshot;
        }
        if (!player.firstName && profile.firstName) player.firstName = profile.firstName;
        if (!player.lastName && profile.lastName) player.lastName = profile.lastName;
        if (!player.teamLogo && profile.teamLogo) player.teamLogo = profile.teamLogo;
      } catch (error) {
        console.error("Ошибка загрузки фото вратаря:", error);
      }
    })
  );
}

  openDetail();

      cache: "no-store",
      headers: { Accept: "application/json" }
    });

async function loadTeamScheduleSeasons() {
  try {
    const response = await fetch(`${API_BASE}/api/seasons-list`, { cache: "no-store" });
    const data = await response.json();
    currentTeamScheduleSeasons = (Array.isArray(data?.seasons) ? data.seasons : [])
      .map(item => ({ id: String(item?.id || item?.season || ""), end: item?.standingsEnd || "" }))
      .filter(item => /^\d{8}$/.test(item.id))
      .sort((a, b) => Number(b.id) - Number(a.id));

    console.error("Ошибка загрузки сезонов расписания команды:", error);

function formatSeasonId(seasonId) {
  const value = String(seasonId || "");
  return /^\d{8}$/.test(value) ? `${value.slice(0, 4)}-${value.slice(6, 8)}` : value;
}

function teamScheduleGameDate(game) {
  const raw = game?.gameDate || game?.startTimeUTC || game?.date || "";
  if (!raw) return "";
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return String(raw);
  return date.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function renderTeamScheduleGame(game, teamAbbrev) {
  const team = String(teamAbbrev || "").toUpperCase();
  const away = game?.awayTeam || {};
  const home = game?.homeTeam || {};
  const awayAbbrev = getGameTeamAbbrev(away);
  const homeAbbrev = getGameTeamAbbrev(home);
  const isHome = homeAbbrev === team;
  const opponent = isHome ? home : away;
  const opponentAbbrev = isHome ? awayAbbrev : homeAbbrev;
  const opponentName = getGameTeamName(opponent, opponentAbbrev);
  const opponentLogo = opponent?.logo || opponent?.teamLogo || "";
  const state = String(game?.gameState || "").toUpperCase();
  const completed = isCompletedGame(game);
  const scoreFor = isHome ? getGameScore(game, "home") : getGameScore(game, "away");
  const scoreAgainst = isHome ? getGameScore(game, "away") : getGameScore(game, "home");
  const result = completed && scoreFor !== null && scoreAgainst !== null ? (scoreFor > scoreAgainst ? "В" : scoreFor < scoreAgainst ? "П" : "ОТ") : "";
  const resultClass = result === "В" ? "winner" : result === "П" ? "loser" : "";
  const status = completed ? `${scoreFor ?? "—"} : ${scoreAgainst ?? "—"}` : state === "LIVE" || state === "CRIT" ? "LIVE" : game?.startTimeUTC ? new Date(game.startTimeUTC).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "—";

  return `
    <div class="team-schedule-row">
      <div class="team-schedule-date">${escapeHtml(teamScheduleGameDate(game))}</div>
      <div class="team-schedule-opponent">
        <img class="team-logo" src="${escapeHtml(opponentLogo)}" alt="" onerror="this.style.display='none'">
        <div>
          <div class="abbr">${escapeHtml(opponentAbbrev)}</div>
          <div class="team-record">${escapeHtml(opponentName)}</div>
        </div>
      </div>
      <div class="team-schedule-location">${isHome ? "Дома" : "В гостях"}</div>
      <div class="team-schedule-score ${resultClass}">${escapeHtml(status)}</div>
      <div class="team-schedule-result">${escapeHtml(result)}</div>
    </div>
  `;
}

async function loadTeamSchedule(teamAbbrev, seasonId) {
  const container = document.getElementById("team-tables-container");
  currentTeamScheduleSeason = seasonId;
  currentTeamSchedule = null;
  container.innerHTML = '<div class="loading">Загрузка расписания...</div>';

  try {
    const response = await fetch(`${API_BASE}/api/team-schedule/${encodeURIComponent(teamAbbrev)}?season=${encodeURIComponent(seasonId)}`, { cache: "no-store" });
    const data = await response.json();
    if (!response.ok || data?.error) throw new Error(data?.error || `HTTP ${response.status}`);
    currentTeamSchedule = data;
    renderTeamSchedule(teamAbbrev, seasonId);
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="empty">Не удалось загрузить расписание<br><small>${escapeHtml(error.message || "Ошибка загрузки")}</small></div>`;
  }
}

function renderTeamSchedule(teamAbbrev, seasonId) {
  const container = document.getElementById("team-tables-container");
  const games = getScheduleGames(currentTeamSchedule).sort((a, b) => {
    const da = new Date(getGameDateValue(a)).getTime() || 0;
    const db = new Date(getGameDateValue(b)).getTime() || 0;
    return da - db;
  });

  let html = `<div class="section-title">Расписание ${escapeHtml(formatSeasonId(seasonId))}</div>`;
  if (!games.length) {
    container.innerHTML = html + '<div class="empty">Матчи за этот сезон не найдены</div>';
    return;
  }

  html += '<div class="team-schedule-list">';
  games.forEach(game => { html += renderTeamScheduleGame(game, teamAbbrev); });
  html += '</div>';
  container.innerHTML = html;
}

function renderTeamScheduleSeasonButtons(teamAbbrev) {
  const seasons = currentTeamScheduleSeasons.length ? currentTeamScheduleSeasons : currentTeamFullData?.season ? [{ id: String(currentTeamFullData.season), end: "" }] : [];
  if (!seasons.length) return '<div class="empty">Список сезонов недоступен</div>';

  const currentId = String(currentTeamFullData?.season || seasons[0].id);
  return `
    <div class="section-title">Сезон расписания</div>
    <div class="team-schedule-seasons">
      ${seasons.map(season => `
        <button class="team-season-btn ${season.id === currentId ? "active" : ""}" data-team-season="${escapeHtml(season.id)}">
          ${escapeHtml(formatSeasonId(season.id))}
        </button>
      `).join("")}
    </div>
  `;
}

async function openTeamScheduleTab(teamAbbrev) {
  currentTeamType = "schedule";
  const container = document.getElementById("team-tables-container");
  if (!currentTeamScheduleSeasons.length) await loadTeamScheduleSeasons();
  container.innerHTML = renderTeamScheduleSeasonButtons(teamAbbrev);

  container.querySelectorAll(".team-season-btn").forEach(button => {
    button.onclick = async () => {
      container.querySelectorAll(".team-season-btn").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      await loadTeamSchedule(teamAbbrev, button.dataset.teamSeason);
    };

  const initialSeason = currentTeamFullData?.season || currentTeamScheduleSeasons[0]?.id;
  if (initialSeason) {
    const button = container.querySelector(`.team-season-btn[data-team-season="${CSS.escape(String(initialSeason))}"]`);
    if (button) button.classList.add("active");
    await loadTeamSchedule(teamAbbrev, String(initialSeason));

}

        <div class="title">${escapeHtml(teamName || teamAbbrev)}</div>

function normalizeTeamDataset(data) {
  if (!data || typeof data !== "object") return { skaters: [], goalies: [] };
  const skaters = data.skaters || data.skatersStats || data.players || data.forwards || [];
  const goalies = data.goalies || data.goaltenders || data.goaliesStats || [];
  return { skaters: Array.isArray(skaters) ? skaters : [], goalies: Array.isArray(goalies) ? goalies : [] };
}

function buildTeamTablesBlock() {
  const container = document.getElementById("team-tables-container");
  const source = currentTeamFullData?.[currentTeamType] || currentTeamFullData?.[currentTeamType === "regular" ? "regularSeason" : "playoffs"] || currentTeamFullData;
  const dataset = normalizeTeamDataset(source);

  const skaters = [...dataset.skaters].sort((a, b) => {
    const valueA = Number(currentTeamSortKey === "penaltyMinutes" ? a.penaltyMinutes ?? a.pim ?? 0 : a[currentTeamSortKey] ?? 0);
    const valueB = Number(currentTeamSortKey === "penaltyMinutes" ? b.penaltyMinutes ?? b.pim ?? 0 : b[currentTeamSortKey] ?? 0);
    return currentTeamSortAsc ? valueA - valueB : valueB - valueA;
  });

  const goalies = [...dataset.goalies].sort((a, b) => Number(b.gamesPlayed ?? 0) - Number(a.gamesPlayed ?? 0));

  let html = '<div class="section-title">Полевые игроки</div>';
  if (!skaters.length) {
    html += '<div class="empty">Нет данных полевых игроков</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th class="sortable" data-sort="gamesPlayed">И</th>
              <th class="sortable" data-sort="goals">Г</th>
              <th class="sortable" data-sort="assists">П</th>
              <th class="sortable" data-sort="points">О</th>
              <th class="sortable" data-sort="plusMinus">+/-</th>
              <th class="sortable" data-sort="penaltyMinutes">Штр</th>
            </tr>
          </thead>
          <tbody>
            ${skaters.map(player => `
              <tr class="clickable-row" data-player-id="${escapeHtml(getPlayerId(player))}">
                <td>${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Игрок")}</td>
                <td class="num">${val(player.gamesPlayed)}</td>
                <td class="num">${val(player.goals)}</td>
                <td class="num">${val(player.assists)}</td>
                <td class="num">${val(player.points)}</td>
                <td class="num">${val(player.plusMinus)}</td>
                <td class="num">${val(player.penaltyMinutes ?? player.pim)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  html += '<div class="section-title">Вратари</div>';
  if (!goalies.length) {
    html += '<div class="empty">Нет данных вратарей</div>';
  } else {
    html += `
      <div class="table-scroll">
        <table class="stat-table">
          <thead>
            <tr>
              <th>Игрок</th>
              <th>И</th>
              <th>В</th>
              <th>П</th>
              <th>%ОБ</th>
              <th>ГКИ</th>
            </tr>
          </thead>
          <tbody>
            ${goalies.map(player => {
              const savePct = player.savePercentage ?? player.savePctg;
              const gaa = player.goalsAgainstAverage ?? player.gaa;
              return `
                <tr class="clickable-row" data-player-id="${escapeHtml(getPlayerId(player))}">
                  <td>${escapeHtml(`${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Вратарь")}</td>
                  <td class="num">${val(player.gamesPlayed)}</td>
                  <td class="num">${val(player.wins)}</td>
                  <td class="num">${val(player.losses)}</td>
                  <td class="num">${typeof savePct === "number" ? savePct.toFixed(3) : val(savePct)}</td>
                  <td class="num">${typeof gaa === "number" ? gaa.toFixed(2) : val(gaa)}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
  container.querySelectorAll(".clickable-row").forEach(row => {
    row.addEventListener("click", () => {
      if (row.dataset.playerId) openPlayerDetail(row.dataset.playerId);
    });
  });

  container.querySelectorAll("th.sortable").forEach(header => {
    header.onclick = () => {
      const key = header.dataset.sort;
      if (currentTeamSortKey === key) {
        currentTeamSortAsc = !currentTeamSortAsc;
      } else {
        currentTeamSortKey = key;
        currentTeamSortAsc = false;
      }
      buildTeamTablesBlock();
    };
  });
}

const TEAM_STAT_LABELS = {

  shotsOnGoal: "Броски в створ",
  faceoffWinningPctg: "Вбрасывания, %",
  faceoffWins: "Выигранные вбрасывания",
  powerPlay: "Большинство",
  powerPlayPctg: "Большинство, %",
  pim: "Штраф (мин)",
  penaltyMinutes: "Штраф (мин)",
  hits: "Силовые приёмы",
  blockedShots: "Заблокировано бросков",
  giveaways: "Потери шайбы",
  takeaways: "Отборы шайбы"
};

function formatPeriodsBreakdown(periods) {
  if (!Array.isArray(periods) || !periods.length) return "";
  return `(${periods.map(value => val(value, "0")).join(" / ")})`;
}

function renderTeamGameStats(rightRail, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
  const stats = rightRail?.teamGameStats || [];
  let html = '<div class="section-title">Статистика команд</div>';
  if (!stats.length) return html + '<div class="empty">Статистика недоступна</div>';

  html += `
    <div class="teamstat-head">
      <div class="side">
        <img class="team-logo" src="${escapeHtml(awayLogo)}" alt="">
        <span>${escapeHtml(awayAbbrev)}</span>
      </div>
      <div></div>
      <div class="side right">
        <span>${escapeHtml(homeAbbrev)}</span>
        <img class="team-logo" src="${escapeHtml(homeLogo)}" alt="">
      </div>
    </div>
  `;

  stats.forEach(stat => {
    const label = TEAM_STAT_LABELS[stat.category] || stat.category;
    let awayValue = stat.awayValue;
    let homeValue = stat.homeValue;

    if (typeof awayValue === "number" && (stat.category === "faceoffWinningPctg" || stat.category === "powerPlayPctg")) {
      awayValue = `${(awayValue * 100).toFixed(1)}%`;
      homeValue = `${(homeValue * 100).toFixed(1)}%`;
    }

    const awayPeriods = formatPeriodsBreakdown(stat.awayPeriods || stat.away?.periods);
    const homePeriods = formatPeriodsBreakdown(stat.homePeriods || stat.home?.periods);

    html += `
      <div class="teamstat-row">
        <div class="val away">${escapeHtml(val(awayValue))} ${awayPeriods ? `<span class="periods">${escapeHtml(awayPeriods)}</span>` : ""}</div>
        <div class="label">${escapeHtml(label)}</div>
        <div class="val home">${escapeHtml(val(homeValue))} ${homePeriods ? `<span class="periods">${escapeHtml(homePeriods)}</span>` : ""}</div>
      </div>
    `;
  });

  return html;
}

function getSkaterStatValue(player, keys, fallback = null) {
  for (const key of keys) {
    if (player?.[key] !== undefined && player?.[key] !== null && player?.[key] !== "") {
      return player[key];
    }
  }
  return fallback;
}

function formatPct(value) {
  if (value === undefined || value === null || value === "") return "—";
  const number = Number(value);
  if (!Number.isFinite(number)) return String(value);
  return `${(number <= 1 ? number * 100 : number).toFixed(1)}%`;
}

function normalizeGameSkaters(team) {
  if (!team || typeof team !== "object") return [];
  const forwards = Array.isArray(team.forwards) ? team.forwards : [];
  const defense = Array.isArray(team.defense) ? team.defense : [];
  const skaters = Array.isArray(team.skaters) ? team.skaters : [];
  return [...forwards, ...defense, ...skaters];
}

function normalizeGameGoalies(team) {
  if (!team || typeof team !== "object") return [];
  return Array.isArray(team.goalies) ? team.goalies : [];
}

function gameSortValue(value, type = "number") {
  if (value === undefined || value === null || value === "") return "";
  if (type === "name") return String(value).toLocaleLowerCase("ru");
  if (type === "time") {
    const parts = String(value).split(":").map(Number);
    if (parts.length === 2 && parts.every(Number.isFinite)) return String(parts[0] * 60 + parts[1]);
  }
  const number = Number(value);
  return Number.isFinite(number) ? String(number) : String(value).toLocaleLowerCase("ru");
}

function gameStatCell(key, value, type = "number", display = null) {
  const shown = display === null ? val(value) : display;
  const sortValue = gameSortValue(value, type);
  return `<td class="num" data-sort-column="${escapeHtml(key)}" data-sort-value="${escapeHtml(sortValue)}">${escapeHtml(shown)}</td>`;
}

function initGameStatSorting() {
  document.querySelectorAll(".game-player-table[data-sortable]").forEach(table => {
    if (table.dataset.sortReady === "1") return;
    table.dataset.sortReady = "1";

    table.querySelectorAll("thead th[data-sort-key]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sortKey;
        const type = th.dataset.sortType || "number";
        const tbody = table.querySelector("tbody");
        if (!tbody) return;

        const currentKey = table.dataset.sortKey || "";
        const currentDir = table.dataset.sortDir === "desc" ? "desc" : "asc";
        const direction = currentKey === key ? (currentDir === "asc" ? "desc" : "asc") : "desc";

        const rows = Array.from(tbody.querySelectorAll("tr"));
        rows.sort((a, b) => {
          const aCell = a.querySelector(`[data-sort-column="${CSS.escape(key)}"]`);
          const bCell = b.querySelector(`[data-sort-column="${CSS.escape(key)}"]`);
          const av = aCell?.dataset.sortValue ?? "";
          const bv = bCell?.dataset.sortValue ?? "";

          if (type === "name") return av.localeCompare(bv, "ru") * (direction === "asc" ? 1 : -1);

          const an = Number(av);
          const bn = Number(bv);
          const aEmpty = av === "" || !Number.isFinite(an);
          const bEmpty = bv === "" || !Number.isFinite(bn);

          if (aEmpty && bEmpty) return 0;
          if (aEmpty) return 1;
          if (bEmpty) return -1;
          return (an - bn) * (direction === "asc" ? 1 : -1);
        });

        rows.forEach(row => tbody.appendChild(row));
        table.dataset.sortKey = key;
        table.dataset.sortDir = direction;

        table.querySelectorAll("thead th[data-sort-key]").forEach(item => item.classList.remove("sort-asc", "sort-desc"));
        th.classList.add(direction === "asc" ? "sort-asc" : "sort-desc");
      });
    });
  });
}

function getGamePlayerPosition(player) {
  const value = player?.positionCode ?? player?.position ?? player?.positionAbbrev ?? "";
  const position = String(value || "").toUpperCase();
  if (["D", "L", "R", "C"].includes(position)) return position;
  return "";
}

function renderGamePlayerStats(team, teamAbbrev) {
  const skaters = normalizeGameSkaters(team);
  let html = `<div class="section-title">Игроки — ${escapeHtml(teamAbbrev)}</div>`;
  if (!skaters.length) return html + '<div class="empty">Статистика полевых игроков недоступна</div>';

  html += `
    <div class="table-scroll game-player-section">
      <table class="stat-table game-player-table" data-sortable="1">
        <thead>
          <tr>
            <th data-sort-key="name" data-sort-type="name">Игрок</th>
            <th data-sort-key="goals">Г</th>
            <th data-sort-key="assists">П</th>
            <th data-sort-key="points">О</th>
            <th data-sort-key="plusMinus">+/-</th>
            <th data-sort-key="shots">Б</th>
            <th data-sort-key="toi" data-sort-type="time">В</th>
            <th data-sort-key="hits">Х</th>
            <th data-sort-key="blocks">Бл</th>
            <th data-sort-key="faceoff">% Вбр</th>
          </tr>
        </thead>
        <tbody>
  `;

  skaters.forEach(player => {
    const baseName = player.name?.default || player.name || `${nameStr(player.firstName)} ${nameStr(player.lastName)}`.trim() || "Игрок";
    const position = getGamePlayerPosition(player);
    const name = position ? `${baseName} (${position})` : baseName;

    const goals = getSkaterStatValue(player, ["goals"]);
    const assists = getSkaterStatValue(player, ["assists"]);
    const points = getSkaterStatValue(player, ["points"]);
    const plusMinus = getSkaterStatValue(player, ["plusMinus"]);
    const shots = getSkaterStatValue(player, ["sog", "shotsOnGoal", "shots"]);
    const toi = getSkaterStatValue(player, ["toi", "timeOnIce"]);
    const hits = getSkaterStatValue(player, ["hits"]);
    const blocks = getSkaterStatValue(player, ["blockedShots", "blocks"]);
    const faceoff = getSkaterStatValue(player, ["faceoffWinningPctg", "faceoffWinPctg", "faceoffPctg"]);

    html += `
      <tr>
        <td data-sort-column="name" data-sort-value="${escapeHtml(gameSortValue(name, "name"))}">${escapeHtml(name)}</td>
        ${gameStatCell("goals", goals)}
        ${gameStatCell("assists", assists)}
        ${gameStatCell("points", points)}
        ${gameStatCell("plusMinus", plusMinus)}
        ${gameStatCell("shots", shots)}
        ${gameStatCell("toi", toi, "time")}
        ${gameStatCell("hits", hits)}
        ${gameStatCell("blocks", blocks)}
        ${gameStatCell("faceoff", faceoff, "number", formatPct(faceoff))}
      </tr>
    `;
  });

  html += '</tbody></table></div>';
  return html;
}

function renderGameGoalieStats(team, teamAbbrev) {
  const goalies = normalizeGameGoalies(team);
  let html = `<div class="section-title">Вратари — ${escapeHtml(teamAbbrev)}</div>`;
  if (!goalies.length) return html + '<div class="empty">Статистика вратарей недоступна</div>';

  html += `
    <div class="table-scroll game-player-section">
      <table class="stat-table game-player-table" data-sortable="1">
        <thead>
          <tr>
            <th data-sort-key="name" data-sort-type="name">Вратарь</th>
            <th data-sort-key="shotsAgainst">Бр</th>
            <th data-sort-key="saves">О</th>
            <th data-sort-key="savePct">%ОБ</th>
            <th data-sort-key="toi" data-sort-type="time">В</th>
            <th data-sort-key="gaa">ГКИ</th>
          </tr>
        </thead>
        <tbody>
  `;

  goalies.forEach(goalie => {
    const name = goalie.name?.default || goalie.name || `${nameStr(goalie.firstName)} ${nameStr(goalie.lastName)}`.trim() || "Вратарь";
    const shotsAgainst = getSkaterStatValue(goalie, ["shotsAgainst", "shots"]);
    const saves = getSkaterStatValue(goalie, ["saves"]);
    const saveShotsAgainst = getSkaterStatValue(goalie, ["saveShotsAgainst"]);
    const shots = shotsAgainst ?? (typeof saveShotsAgainst === "string" && saveShotsAgainst.includes("/") ? saveShotsAgainst.split("/").pop().trim() : null);
    const savePct = goalie.savePctg ?? goalie.savePercentage ?? (shots !== null && saves !== null && Number(shots) > 0 ? Number(saves) / Number(shots) : null);
    const toi = goalie.toi ?? goalie.timeOnIce ?? "";
    let gaa = goalie.goalsAgainstAverage ?? goalie.gaa;

    if ((gaa === undefined || gaa === null || gaa === "") && toi && goalie.goalsAgainst !== undefined) {
      const parts = String(toi).split(":").map(Number);
      if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
        const minutes = parts[0] + parts[1] / 60;
        if (minutes > 0) gaa = Number(goalie.goalsAgainst) / (minutes / 60);
      }
    }
    const gaaDisplay = typeof gaa === "number" ? gaa.toFixed(2) : val(gaa);

    html += `
      <tr>
        <td data-sort-column="name" data-sort-value="${escapeHtml(gameSortValue(name, "name"))}">${escapeHtml(name)}</td>
        ${gameStatCell("shotsAgainst", shots, "number")}
        ${gameStatCell("saves", saves, "number")}
        ${gameStatCell("savePct", savePct, "number", formatPct(savePct))}
        ${gameStatCell("toi", toi, "time")}
        ${gameStatCell("gaa", gaa, "number", gaaDisplay)}
      </tr>
    `;
  });

  html += '</tbody></table></div>';
  return html;
}

function buildVideoRecapBlock(landingData, gameId) {
  if (!landingData) return "";
  const streamUrl = landingData.threeMinRecapStream || landingData.condensedGameStream;
  const videoPath = landingData.threeMinRecap || landingData.condensedGame;

  if (streamUrl) {
    return `
      <div class="section-title">Видеообзор матча</div>
      <div class="video-container">
        <video id="recap-player-${gameId}" controls poster="${escapeHtml(landingData.heroImage || '')}">
          <source src="${escapeHtml(streamUrl)}" type="application/x-mpegURL">
        </video>
      </div>
    `;
  } else if (videoPath) {
    const fullUrl = videoPath.startsWith('http') ? videoPath : `https://www.nhl.com${videoPath}`;
    return `
      <div class="section-title">Видеообзор матча</div>
      <div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px;">
        <span style="font-size:13px; font-weight:600;">Смотреть хайлайты игры</span>
        <a href="${escapeHtml(fullUrl)}" target="_blank" class="show-more" style="width:auto; margin:0; padding:6px 14px; text-decoration:none; display:inline-block; text-align:center;">▶ Открыть видео</a>
      </div>
    `;
  }
  return "";
}

function initRecapPlayer(landingData, gameId) {
  const streamUrl = landingData?.threeMinRecapStream || landingData?.condensedGameStream;
  if (!streamUrl) return;
  const video = document.getElementById(`recap-player-${gameId}`);
  if (!video) return;

  if (Hls && Hls.isSupported() && streamUrl.includes('.m3u8')) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
  }
}

async function openGameDetail(gameId, awayAbbrev, homeAbbrev, awayLogo, homeLogo) {
  openDetail();
  const body = document.getElementById("detail-body");

  let html = `
    <div class="detail-head-game">
      <img class="team-logo" src="${escapeHtml(awayLogo)}" alt="">
      <div>
        <div class="title">${escapeHtml(awayAbbrev)} — ${escapeHtml(homeAbbrev)}</div>
        <div class="subtitle">Статистика матча</div>
      </div>
      <img class="team-logo" src="${escapeHtml(homeLogo)}" alt="">
    </div>
  `;

  try {
    const [scoreResponse, railResponse, boxResponse, landingResponse] = await Promise.all([
      fetch(`${API_BASE}/api/score/${encodeURIComponent(gameId)}`),
      fetch(`${API_BASE}/api/right-rail/${encodeURIComponent(gameId)}`),
      fetch(`${API_BASE}/api/boxscore/${encodeURIComponent(gameId)}`),
      fetch(`${API_BASE}/api/landing/${encodeURIComponent(gameId)}`).catch(() => null)
    ]);

    const score = await scoreResponse.json();
    const rail = await railResponse.json();
    const box = await boxResponse.json();
    let landing = null;

    if (landingResponse && landingResponse.ok) {
      try { landing = await landingResponse.json(); } catch (_) {}
    }

    html += buildVideoRecapBlock(landing || score, gameId);
    html += '<div class="section-title">Голы</div>';

    const scoring = score?.summary?.scoring || [];
    let hasGoals = false;

    scoring.forEach(period => {
      const goals = period.goals || [];
      if (!goals.length) return;
      hasGoals = true;
      html += `<div class="period-label">${escapeHtml(formatPeriodLabel(period.periodDescriptor))}</div>`;

      goals.forEach(goal => {
        const scorer = `${nameStr(goal.firstName)} ${nameStr(goal.lastName)}`.trim();
        const strengthLabel = getGoalStrengthLabel(goal);
        const assists = Array.isArray(goal.assists) ? goal.assists.map(item => `${nameStr(item.firstName)} ${nameStr(item.lastName)}`).join(", ") : "";

        html += `
          <div class="goal-row">
            <div class="time">${escapeHtml(val(goal.timeInPeriod))}</div>
            <div class="desc">
              <div class="scorer">${escapeHtml(scorer)} (${escapeHtml(goal.teamAbbrev?.default || goal.teamAbbrev || "")})${strengthLabel ? ` (${strengthLabel})` : ""}</div>
              ${assists ? `<div class="assists">Передачи: ${escapeHtml(assists)}</div>` : ""}
            </div>
            <div class="scoreline">${escapeHtml(val(goal.awayScore))} : ${escapeHtml(val(goal.homeScore))}</div>
          </div>
        `;
      });
    });

    if (!hasGoals) html += '<div class="empty">Голов пока не было</div>';

    html += renderTeamGameStats(rail, awayAbbrev, homeAbbrev, awayLogo, homeLogo);

    const awayPlayers = box?.playerByGameStats?.awayTeam || {};
    const homePlayers = box?.playerByGameStats?.homeTeam || {};

    html += '<div class="section-title">Статистика игроков</div>';
    html += renderGamePlayerStats(awayPlayers, awayAbbrev);
    html += renderGamePlayerStats(homePlayers, homeAbbrev);
    html += renderGameGoalieStats(awayPlayers, awayAbbrev);
    html += renderGameGoalieStats(homePlayers, homeAbbrev);
  } catch (error) {
    console.error(error);
    html += `<div class="empty">Не удалось загрузить подробности матча<br><small>${escapeHtml(error.message || "Ошибка загрузки")}</small></div>`;
  }

  body.innerHTML = html;
  initGameStatSorting();
  initRecapPlayer(landing, gameId);
}

function renderCareerRow(season, position) {
  const seasonName = String(season.season).replace(/^(\d{4})(\d{4})$/, "$1-$2");
  const teamName = season.teamName?.default || season.teamAbbrev || "—";
  let html = `<tr><td>${escapeHtml(seasonName)}</td><td>${escapeHtml(teamName)}</td><td class="num">${escapeHtml(val(season.gamesPlayed))}</td>`;

  if (position === "G") {
    const savePct = season.savePctg ?? season.savePercentage;
    const gaa = season.goalsAgainstAverage ?? season.gaa;
    html += `
      <td class="num">${escapeHtml(val(season.wins))}</td>
      <td class="num">${escapeHtml(val(season.losses))}</td>
      <td class="num">${typeof savePct === "number" ? savePct.toFixed(3) : escapeHtml(val(savePct))}</td>
      <td class="num">${typeof gaa === "number" ? gaa.toFixed(2) : escapeHtml(val(gaa))}</td>
    `;
  } else {
    html += `
      <td class="num">${escapeHtml(val(season.goals))}</td>
      <td class="num">${escapeHtml(val(season.assists))}</td>
      <td class="num">${escapeHtml(val(season.points))}</td>
      <td class="num">${escapeHtml(val(season.plusMinus))}</td>
      <td class="num">${escapeHtml(val(season.pim ?? season.penaltyMinutes))}</td>
    `;
  }
  return `${html}</tr>`;
}

function applyInitialSection() {
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section");
  if (!section) return false;

  if (section === "goalies") {
    switchTab("players");
    document.getElementById("leaders-goalies-btn").click();
    return true;
  }
  if (section === "players") {
    switchTab("players");
    document.getElementById("leaders-skaters-btn").click();
    return true;
  }
  if (section === "leaders") {
    switchTab("players");
    return true;
  }

  switchTab(normalizeInitialSection(section));
  return true;
}

buildSeasonOptions();

if (!applyInitialSection()) {
  loadSchedule();
}
</script>
</body>
</html>
